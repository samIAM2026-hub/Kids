<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Homework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1a17; --ink2:#5b4636; --mute:#8a7d70; --cream:#f6f3ed; --paper:#fffdf7; --line:#e6ddd0;
    --rust:#b4622f; --green:#3f7d4e; --greenbg:#e6f2e8; --red:#c0392b; --redbg:#fbeae7;
    --acc:#b4622f; --accbg:#fff4e8; --accline:#ffb37b;
    --goldbg:#fbf1d6; --goldline:#e8c766;
  }
  body.peach{ --acc:#d84315; --accbg:#fff4e8; --accline:#ffb37b; }
  body.river{ --acc:#35704a; --accbg:#eef6f0; --accline:#8bb98f; }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{background:var(--cream);color:var(--ink);font-family:'Newsreader',Georgia,serif;font-size:18px;
       line-height:1.45;padding-bottom:60px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
  button{font-family:inherit}

  /* ---------- sign-in ---------- */
  #signin{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
          gap:22px;padding:24px 24px 130px;text-align:center;position:relative;overflow:hidden}
  #signin h1{font-size:40px}
  #signin .lead{color:var(--ink2);font-size:19px}
  body:has(#signin:not([hidden])){padding-bottom:0}
  /* Meadow backdrop: the sky follows the clock (data-t = morn / noon / eve, set by skyNow()). */
  #signin{--sky:linear-gradient(#ffd9b8,#fff0dc 48%,#f5f6e6);--hill1:#cfe3c3;--hill2:#a8cb98;--hill3:#8dbb7f;
          --orb:#ffb37b;--glow:rgba(255,179,123,.45);background:var(--sky)}
  #signin[data-t="noon"]{--sky:linear-gradient(#bcdff3,#e6f3f7 55%,#f6f3ed);--hill1:#bfe0b3;--hill2:#98c98b;--hill3:#7db470;
          --orb:#ffd36b;--glow:rgba(255,211,107,.5)}
  #signin[data-t="eve"]{--sky:linear-gradient(#2d3864,#57578c 50%,#c68ea0);--hill1:#56657c;--hill2:#435368;--hill3:#344356;
          --orb:#fff4d2;--glow:rgba(255,244,210,.35)}
  #pickstep,#pinstep{position:relative}
  .sky{position:absolute;inset:0;pointer-events:none}
  .sky svg{position:absolute;display:block;left:0;width:100%}
  .sky .orb{position:absolute;width:86px;height:86px;border-radius:50%;background:var(--orb);left:9%;top:22%;
            box-shadow:0 0 0 18px var(--glow),0 0 70px 30px var(--glow)}
  #signin[data-t="noon"] .orb{left:80%;top:9%}
  #signin[data-t="eve"] .orb{left:82%;top:11%;width:64px;height:64px}
  .sky .stars{top:0;height:300px;opacity:0}
  #signin[data-t="eve"] .stars{opacity:1}
  .sky .clouds{top:40px;height:200px;animation:drift 60s linear infinite alternate}
  #signin[data-t="eve"] .clouds{opacity:.25}
  .sky .hills{bottom:0;height:240px}
  .sky .grass{bottom:8px;height:60px}
  .hill1{fill:var(--hill1)} .hill2{fill:var(--hill2)} .hill3{fill:var(--hill3)}
  .grass path{fill:none;stroke:var(--hill2);stroke-width:3;stroke-linecap:round}
  @keyframes drift{to{transform:translateX(40px)}}
  #signin .who{box-shadow:0 14px 30px -16px rgba(30,50,30,.45)}
  #signin[data-t="eve"] h1{color:#fffaf0}
  #signin[data-t="eve"] .lead{color:#ece6f4}
  #signin[data-t="eve"] .link{color:#e2dcef}
  #signin[data-t="eve"] .err:not(:empty){background:var(--paper);border-radius:10px;padding:4px 12px}
  .pick{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
  .who{width:230px;max-width:100%;padding:18px 12px 16px;border-radius:22px;cursor:pointer;color:var(--ink);
       border:3px solid var(--line);transition:transform .12s,border-color .12s;
       display:flex;flex-direction:column;align-items:center;gap:8px}
  .who:hover{transform:translateY(-3px)}
  .who .nm{font-family:'Fraunces',serif;font-size:26px;font-weight:600;line-height:1.1;color:var(--k)}
  .who .petnm{font-size:15px;color:var(--ink2);margin-top:-6px;line-height:1.3}
  .who .whisper{font-size:15px;font-weight:600;color:var(--k);line-height:1.3}
  .who.peach{--k:#d84315;--kl:#ffb37b;background:#fff4e8;border-color:#ffb37b}
  .who.river{--k:#35704a;--kl:#8bb98f;background:#eef6f0;border-color:#8bb98f}
  .streak{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--ink2);background:var(--paper);
          border:1px solid var(--kl,var(--accline));border-radius:99px;padding:3px 10px;font-variant-numeric:tabular-nums}
  .streak.off{color:var(--mute)}
  .medals{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
  #pinstep .av{font-size:70px;line-height:1}
  #pin{width:250px;text-align:center;font-size:34px;letter-spacing:16px;padding:14px 10px 14px 26px;
       border-radius:16px;border:3px solid var(--accline);background:var(--paper);color:var(--ink);
       font-family:'IBM Plex Mono',monospace;outline:none}
  #pin:focus{border-color:var(--acc)}
  .err{color:var(--red);font-size:16px;min-height:22px;max-width:380px}
  .link{background:none;border:none;color:var(--mute);font-size:16px;cursor:pointer;text-decoration:underline}
  .out{background:var(--paper);border:2px solid var(--acc);color:var(--acc);font-weight:600;font-size:16px;
       border-radius:12px;padding:9px 14px;cursor:pointer;white-space:nowrap}

  /* ---------- header ---------- */
  header{background:var(--accbg);border-bottom:3px solid var(--accline)}
  .hrow{display:flex;align-items:center;gap:14px;padding:22px 0 14px}
  .hrow .av{font-size:46px;line-height:1}
  .hrow h1{font-size:30px;color:var(--acc)}
  .hrow .date{font-size:15px;color:var(--ink2)}
  .hrow .spacer{margin-left:auto}
  .tabs{display:flex;gap:6px;overflow-x:auto}
  .tab{background:none;border:none;cursor:pointer;font-size:17px;font-weight:600;color:var(--ink2);
       padding:10px 16px;border-bottom:4px solid transparent;white-space:nowrap}
  .tab.on{color:var(--acc);border-bottom-color:var(--acc)}
  .tab .n{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--paper);border-radius:99px;
          padding:1px 8px;margin-left:5px;color:var(--ink2)}

  /* ---------- today ---------- */
  .progress{margin:26px 0 8px}
  .progress .big{font-family:'Fraunces',serif;font-size:26px}
  .meter{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
  .meter i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
  .cheer{margin-top:16px;background:var(--greenbg);color:var(--green);border-radius:16px;padding:16px 18px;
         font-size:19px;font-weight:600;text-align:center}
  .card{display:flex;align-items:center;gap:16px;background:var(--paper);border:2px solid var(--line);
        border-radius:18px;padding:16px 18px;margin-top:14px}
  .card.done{border-color:#b9d7c0}
  a.card.marked{text-decoration:none;color:inherit;border-color:var(--gold, #c9a227);background:#fffaf0;margin-bottom:14px}
  .card.low{border-color:#efc2bb}
  .card .ic{font-size:36px;line-height:1;flex:0 0 auto}
  .card .body{flex:1;min-width:0}
  .card .t{font-family:'Fraunces',serif;font-size:20px;font-weight:600;line-height:1.25}
  .card .meta{font-size:14.5px;color:var(--mute);margin-top:3px}
  .kind{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.6px;
        text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--cream);color:var(--ink2);
        margin-right:6px}
  .subj{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.6px;
        text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--accbg);color:var(--acc);
        border:1px solid var(--accline);margin-right:6px;white-space:nowrap;vertical-align:2px}
  h3.group{font-size:22px;margin:28px 0 -4px;display:flex;align-items:baseline;gap:10px;color:var(--acc)}
  h3.group .gn{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;color:var(--mute)}
  .status{font-size:15px;margin-top:6px;font-weight:600}
  .status.ok{color:var(--green)} .status.low{color:var(--red)}
  .go{flex:0 0 auto;text-decoration:none;font-weight:600;font-size:17px;border-radius:14px;padding:12px 20px;
      background:var(--acc);color:#fff;white-space:nowrap}
  .go.again{background:var(--paper);color:var(--acc);border:2px solid var(--acc)}
  .empty{text-align:center;color:var(--ink2);background:var(--paper);border:2px dashed var(--line);
         border-radius:18px;padding:34px 20px;margin-top:26px;font-size:19px}
  .empty .e{font-size:44px;display:block;margin-bottom:6px}

  /* ---------- my day (daily report) ---------- */
  button.card.marked{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
    border-color:var(--gold, #c9a227);background:#fffaf0;margin-bottom:14px}
  details.day{margin-top:18px}
  details.day>summary{cursor:pointer;list-style:none;font-family:'Fraunces',serif;font-size:21px;font-weight:600;
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  details.day>summary::-webkit-details-marker{display:none}
  details.day>summary::before{content:'▸';color:var(--acc);font-size:16px}
  details.day[open]>summary::before{content:'▾'}
  details.day>summary .gn{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;color:var(--mute)}
  .note{background:#fffaf0;border:2px solid #e8c766;border-radius:18px;padding:16px 18px;margin-top:14px}
  .note .from{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.8px;
    text-transform:uppercase;color:#a07a12}
  .note .head{font-size:18.5px;margin-top:6px;line-height:1.5}
  .note h4{font-family:'Fraunces',serif;font-size:17px;margin:14px 0 4px}
  .note ul{padding-left:22px}
  .note li{font-size:16.5px;line-height:1.5;margin-top:4px}
  .row .sub{font-size:13.5px;color:var(--mute);margin-top:2px}

  /* ---------- scores & mistakes ---------- */
  h2.sec{font-size:24px;margin:26px 0 4px}
  .lead2{color:var(--ink2);font-size:16px}
  .stats{display:flex;gap:12px;margin:16px 0 6px;flex-wrap:wrap}
  .stat{flex:1;min-width:130px;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:12px 16px}
  .stat .v{font-family:'Fraunces',serif;font-size:30px;font-weight:600;line-height:1.1}
  .stat .k{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
  .row{display:flex;align-items:center;gap:14px;background:var(--paper);border:2px solid var(--line);
       border-radius:16px;padding:12px 16px;margin-top:10px}
  .row .d{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--mute);width:48px;flex:0 0 auto}
  .row .body{flex:1;min-width:0}
  .row .t{font-size:17px;font-weight:600}
  .bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;border-radius:99px}
  .row .sc{font-family:'Fraunces',serif;font-size:22px;font-weight:600;width:62px;text-align:right}
  .row .go{font-size:15px;padding:9px 14px}

  /* ---------- pets & badges ---------- */
  .habitat{--k2:var(--k,var(--acc));position:relative;width:132px;height:132px;flex:0 0 auto}
  .habitat svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .habitat .track{fill:none;stroke:var(--paper);stroke-width:9}
  .habitat .fill{fill:none;stroke:var(--k2);stroke-width:9;stroke-linecap:round}
  .habitat .pet{position:absolute;inset:16px;border-radius:50%;background:var(--paper);display:grid;place-items:center;
                font-size:58px;line-height:1}
  .habitat .pet span{display:block;animation:bob 2.6s ease-in-out infinite}
  .habitat .lvl{position:absolute;right:-2px;bottom:4px;background:var(--k2);color:#fff;font-family:'IBM Plex Mono',monospace;
                font-size:12px;font-weight:600;border-radius:99px;padding:2px 8px;border:2px solid var(--paper)}
  .habitat .zz{position:absolute;left:2px;top:0;font-size:24px}
  @keyframes bob{50%{transform:translateY(-5px)}}
  .medal{--s:34px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
         font-size:calc(var(--s)*.5);line-height:1;border:2px solid var(--goldline);box-shadow:inset 0 0 0 2px var(--paper);
         background:radial-gradient(circle at 35% 30%,#fff8e0,var(--goldbg))}
  .medal.locked{background:var(--cream);border:2px dashed var(--line);box-shadow:none;color:var(--mute);
                font-family:'Fraunces',serif;font-weight:600}
  button.go{border:none;cursor:pointer}
  button.go[disabled]{opacity:.45;cursor:default}

  #pop{position:fixed;inset:0;z-index:50;background:rgba(28,26,23,.5);display:grid;place-items:center;padding:18px;overflow:auto}
  .popcard{width:100%;max-width:460px;background:var(--accbg);border:3px solid var(--accline);border-radius:24px;
           padding:26px 20px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;outline:none}
  .popcard h2{font-size:30px;color:var(--acc);line-height:1.15;text-wrap:balance}
  .popcard .plead{font-size:18px;color:var(--ink2);text-wrap:balance}
  .evolve{display:flex;align-items:center;gap:14px;font-size:58px;line-height:1}
  .evolve .from{opacity:.45;font-size:40px}
  .evolve .arrow{font-family:'Fraunces',serif;font-size:26px;color:var(--accline)}
  .evolve .to{animation:grow 1.8s ease-in-out infinite}
  @keyframes grow{0%,24%,100%{transform:scale(1)}12%{transform:scale(1.18)}}
  .since{width:100%;background:var(--paper);border:2px solid var(--accline);border-radius:18px;padding:14px 16px;
         display:flex;flex-direction:column;gap:10px;text-align:left}
  .since .k{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
  .since .r{display:flex;align-items:center;gap:12px}
  .since .v{font-family:'Fraunces',serif;font-weight:600;font-size:22px;min-width:74px;font-variant-numeric:tabular-nums}
  .since .t{font-size:16px;line-height:1.3;min-width:0}
  .since .t small{display:block;color:var(--mute);font-size:14px}
  .since .medals{justify-content:flex-start}
  .newbadge{display:flex;align-items:center;gap:12px;background:var(--goldbg);border:2px solid var(--goldline);
            border-radius:14px;padding:10px 12px}
  .newbadge .medal{--s:48px}
  .petopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
  .petopt{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:12px 8px;cursor:pointer;color:var(--ink);
          display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s}
  .petopt .po-ic{font-size:44px;line-height:1.15}
  .petopt .po-n{font-family:'Fraunces',serif;font-weight:600;font-size:19px}
  .petopt .po-g{font-size:14px;color:var(--mute)}
  .petopt[aria-pressed="true"]{border-color:var(--acc);transform:scale(1.04)}
  .plabel{font-weight:600;font-size:17px}
  #petname{width:100%;max-width:280px;text-align:center;font-size:24px;padding:10px;border-radius:14px;outline:none;
           border:3px solid var(--accline);background:var(--paper);color:var(--ink);font-family:'Fraunces',serif}
  #petname:focus{border-color:var(--acc)}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);
         font-weight:600;font-size:17px;border-radius:99px;padding:10px 20px;max-width:calc(100% - 32px);text-align:center;
         box-shadow:0 10px 24px -12px rgba(28,26,23,.6)}

  .petcard{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:24px}
  .petcard .habitat{width:150px;height:150px}
  .petcard .habitat .pet{font-size:68px;background:var(--accbg)}
  .petcard .habitat .track{stroke:var(--line)}
  .petcard .info{flex:1 1 260px;display:flex;flex-direction:column;gap:7px;min-width:0}
  .petcard .pname{font-family:'Fraunces',serif;font-size:32px;font-weight:600;line-height:1.1;color:var(--acc)}
  .petcard .stage{font-size:16px;color:var(--ink2)}
  .xpbar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
  .xpbar i{display:block;height:100%;background:var(--acc);border-radius:99px}
  .xpcap{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
  .stages{display:flex;gap:6px;align-items:center;font-size:24px;flex-wrap:wrap}
  .stages span{opacity:.3} .stages span.got{opacity:1}
  .stages i{font-style:normal;color:var(--mute);font-size:14px}
  .petcard .streakrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  /* Why the fire is on or off — a streak must never just vanish without a reason. */
  .streakwhy{font-size:15px;line-height:1.45;color:var(--ink2);margin-top:6px}
  .streakwhy b{color:var(--ink)}
  .streakwhy.gone{color:var(--ink2);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
  .rules{margin-top:10px;padding-left:20px;font-size:16px;line-height:1.6}
  .rules li{margin:4px 0}
  .rules b{white-space:nowrap}
  .earn{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin-top:22px}
  .lbl{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
  .earn table{width:100%;border-collapse:collapse;font-size:16px}
  .earn td{padding:6px 0;border-top:1px solid var(--line);vertical-align:top}
  .earn tr:first-child td{border-top:none}
  .earn td.xp{text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--green);white-space:nowrap;padding-left:12px}
  .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px}
  .bdg{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;padding:12px 6px;border-radius:14px;
       background:var(--paper);border:2px solid var(--line)}
  .bdg .medal{--s:54px}
  .bdg .bn{font-family:'Fraunces',serif;font-weight:600;font-size:15px;line-height:1.2}
  .bdg .bd{font-size:13px;color:var(--mute);line-height:1.25}
  .bdg.locked{background:transparent;border-style:dashed}
  .bdg.locked .bn{color:var(--mute)}
  .sib{display:flex;align-items:center;gap:14px;margin-top:22px;background:var(--paper);border:2px solid var(--line);
       border-radius:16px;padding:10px 16px;font-size:16px;line-height:1.35}
  .sib .e{font-size:36px;line-height:1}
  .foot{font-size:15px;color:var(--mute);margin-top:16px}

  @media(prefers-reduced-motion:reduce){
    .habitat .pet span,.evolve .to,.sky .clouds{animation:none}
    .who,.petopt{transition:none}
  }

  @media(max-width:560px){
    body{font-size:17px}
    .card{flex-wrap:wrap}
    .card .go{width:100%;text-align:center}
    .hrow h1{font-size:25px}
    .tab{padding:10px 8px;font-size:15px}
    .popcard h2{font-size:26px}
    .hrow .av{font-size:36px}
    .out{font-size:14px;padding:7px 10px}
    #signin h1{font-size:32px}
    .sky .orb{width:60px;height:60px}
  }
</style>
</head>
<body>

<!-- ---------- sign-in ---------- -->
<section id="signin" hidden>
  <div class="sky" aria-hidden="true">
    <svg class="stars" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMin slice"><g fill="#fff8e1">
      <circle cx="80" cy="60" r="2.2"/><circle cx="190" cy="140" r="1.6"/><circle cx="300" cy="40" r="2"/><circle cx="420" cy="110" r="1.4"/>
      <circle cx="560" cy="50" r="2.4"/><circle cx="650" cy="150" r="1.6"/><circle cx="720" cy="80" r="1.8"/><circle cx="900" cy="190" r="2"/>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script>
/* =====================================================================
   Kids' homework page
   Sign-in : tap your name + 6-digit PIN → Firebase email/password
             (<kid>@family.local, password = PIN). What each kid can read is
             enforced by Firestore rules — this page only shows it.
   Today   : assignments/{uid}/days/{YYYY-MM-DD} — each item carries its own
             title and link, because kids can't read the question bank
   Scores  : attempts where kidId == my uid
   Subject : every item is filed under one English subject (Chinese, Math, …).
             Today and Mistakes are grouped by it; scores carry a tag. Attempts
             have no subject, so it comes from the days that item was assigned.
   Shared  : kids share iPads / computers, and a quiz page records whoever is
             signed in. So: a clear "I'm done · Sign out", and 30 minutes with
             nobody using the site (this page or any quiz page) signs out.
             quiz-report.js uses the same key and rule.
   Pets    : JS/kid-pets.js works out XP, streak and badges from attempts + days.
             pets/{uid} keeps the pet the kid picked and a summary (both kids can
             read both pets). The sign-in screen can't read the database yet, so
             it shows this device's last look at both pets (kid.pets.v1).
===================================================================== */
const firebaseConfig = {
  apiKey: 'AIzaSyDMKUeccjFtMbotXulnMhYcoykWpw4Y7ls',
  authDomain: 'family-checklist-acc6b.firebaseapp.com',
  projectId: 'family-checklist-acc6b',
  appId: '1:127899043154:web:5a49cce9a1913fbc41e68b'
};
// Named app: this sign-in is stored apart from the parent console's and the checklists'.
const app = firebase.initializeApp(firebaseConfig, 'kid');
const auth = app.auth(), db = app.firestore();

const KIDS = {
  grace:  { n:'Grace',  av:'👧', cls:'peach', uid:'mbtSDgfFrOOS4xIT3eXr7pETEt33' },
  warren: { n:'Warren', av:'👦', cls:'river', uid:'paACSAD0W0bBNknKrAf3GfpHy8x1' }
};
const PASS = 80;
const KIND = { quiz:'Quiz', practice:'Practice', ref:'Read' };
// Subject names on this page are always English, one word. Items carry the hub's label
// ('📚 中文 Chinese', '🧮 Algebra', …); the first pattern that matches wins, and this is
// also the order the groups appear in. No label → 'Other' (file names aren't a safe guess:
// SSAT-Reading-… is SSAT, not Reading).
const SUBJECTS = [
  ['Chinese',    /Chinese|中文/i],
  ['Math',       /Math|Algebra/i],
  ['Reading',    /Reading/i],
  ['Vocabulary', /Vocab/i],
  ['Writing',    /Writing/i],
  ['SSAT',       /SSAT/i],
  ['Big Ideas',  /Big Ideas/i],
];
const subjOf = label => (SUBJECTS.find(([,re])=>re.test(label||'')) || ['Other'])[0];
const subjRank = name => { const i = SUBJECTS.findIndex(([n])=>n===name); return i<0 ? SUBJECTS.length : i; };
// [[subject, items], …] in SUBJECTS order; items keep the order they came in.
function bySubject(list){
  const m = new Map();
  list.forEach(x=>{ if(!m.has(x.subj)) m.set(x.subj, []); m.get(x.subj).push(x); });
  return [...m].sort((a,b)=>subjRank(a[0])-subjRank(b[0]));
}
// Worked out once, at load. The iPad keeps this page open for days, so anything that decides
// what "today" means has to notice when the date moves on — see dateChanged() at the bottom.
const today = new Date(); today.setHours(0,0,0,0);
// Local date, not toISOString() (UTC) — must match the key the parent console writes.
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Item hrefs are relative to Quizzes/ (a few step out with ../), same as the hub.
const pageUrl = href => encodeURI('Quizzes/' + href);

let ME = null, ITEMS = [], ATT = [], DAYS = [], V = 'today';
// Writing Lab pieces Dad or Mom marked that this kid hasn't opened yet (Writing-Lab.html stamps seenAt).
let MARKED = [];
// PET / SIB: my pet doc and the other kid's — null = not picked yet, undefined = couldn't read it.
let PET, SIB, GAME = null, petSkipped = false;

/* ---------- shared device: idle sign-out ---------- */
const ACTIVE_KEY = 'kid.lastActive.v1', IDLE_MS = 30*60*1000;
const lastActive = () => { try { return +localStorage.getItem(ACTIVE_KEY) || 0; } catch(e){ return Date.now(); } };
const idle = () => Date.now() - lastActive() > IDLE_MS;
const idleAtLoad = idle();          // read before any listener can refresh it
let touchedAt = 0;
function touch(force){
  if(!force && Date.now()-touchedAt < 10000) return;
  touchedAt = Date.now();
  try { localStorage.setItem(ACTIVE_KEY, String(touchedAt)); } catch(e){}
}

/* ---------- data ---------- */
async function load(){
  const sib = Object.values(KIDS).find(k=>k.uid!==ME.uid);
  const [days, att, pet, sibPet, wr] = await Promise.all([
    // All my assigned days (today's included): older days tell the subject of past attempts.
    db.collection(`assignments/${ME.uid}/days`).get(),
    // No orderBy here: kidId == x plus orderBy another field would need a composite index.
    db.collection('attempts').where('kidId','==',ME.uid).get(),
    getPet(ME.uid), getPet(sib.uid),
    // Same no-orderBy rule as attempts. Can't read them → no reminder card, nothing else breaks.
    db.collection('writings').where('kidId','==',ME.uid).get().catch(e=>{ console.warn('[writings]', e.code||e); return null; })
  ]);
  MARKED = wr ? wr.docs.map(d=>Object.assign({ id:d.id }, d.data())).filter(w=>w.status==='reviewed' && !w.seenAt) : [];
  // A pet that can't be read this time keeps what we already knew.
  if(pet!==undefined || !PET) PET = pet;
  if(sibPet!==undefined || !SIB) SIB = sibPet;
  const label = new Map();   // item id → hub subject label
  // Withdrawn items count too: a score on something the parent later took back still has a subject.
  days.docs.forEach(d=>{ const x = d.data()||{};
    [...(x.withdrawn||[]), ...(x.items||[])].forEach(it=>{ if(it.subj) label.set(it.id, it.subj); }); });
  const day = days.docs.find(d=>d.id===iso(today));
  ITEMS = ((day && day.data()) || {}).items || [];
  ITEMS = ITEMS.map(it=>({ ...it, subj: subjOf(it.subj) }));
  ATT = att.docs.map(d=>{
    const a = d.data();
    const when = a.submittedAt && a.submittedAt.toDate ? a.submittedAt.toDate() : null;
    const pct = typeof a.pct==='number' ? a.pct : a.total ? Math.round(100*a.score/a.total) : null;
    return { id:a.itemId, t:a.t||'', href:a.href||'', subj: subjOf(label.get(a.itemId)),
             pct, wrong:a.wrong||[], when, date: when?iso(when):'', secs: a.secs||0 };
  }).sort((a,b)=>(b.when||0)-(a.when||0));
  DAYS = days.docs.map(d=>{
    const x = d.data()||{}, one = it=>({ id:it.id, t:it.t, subj:subjOf(it.subj) });
    return { date:d.id, items:(x.items||[]).map(one), withdrawn:(x.withdrawn||[]).map(one), summary: x.summary||null };
  });
  GAME = KidPets.compute(
    ATT.map(a=>({ id:a.id, t:a.t, pct:a.pct, wrong:a.wrong.length, date:a.date, at:a.when?+a.when:0 })),
    DAYS, iso(today));
}
// A pet doc; null if this kid hasn't picked one, undefined if it can't be read right now.
function getPet(uid){
  return db.doc(`pets/${uid}`).get()
    .then(d=>{ const p = d.exists ? d.data() : null; return p && !KidPets.PETS[p.kind] ? undefined : p; })
    .catch(e=>{ console.warn('[pets] read failed:', e.code||e); return undefined; });
}

/* ---------- views ---------- */
// "Dad marked your writing" — on top of Today whether or not there's homework today.
function markedCards(){
  const who = { dad:'Dad', mom:'Mom' };
  return MARKED.map(w=>`<a class="card marked" href="Writing/Writing-Lab.html#w=${encodeURIComponent(w.id)}">
    <span class="ic">📝</span>
    <div class="body"><div class="t">${who[w.review && w.review.by] || 'Dad or Mom'} marked your writing!</div>
      <div class="meta">${esc(String(w.prompt||'').slice(0,70))}${(w.draftNo||1)>1?' · draft '+w.draftNo:''}</div></div>
    <span class="go">Read it →</span></a>`).join('');
}

function viewToday(){
  const day = iso(today);
  if(!ITEMS.length){
    return reportCard() + markedCards() + `<div class="empty"><span class="e">🎉</span>No homework today!<br>Enjoy your free time.</div>`;
  }
  const doneToday = it => ATT.find(a=>a.id===it.id && a.date===day);
  const nDone = ITEMS.filter(doneToday).length;
  let html = reportCard() + markedCards() + `<div class="progress"><div class="big">${nDone} of ${ITEMS.length} done</div>
    <div class="meter"><i style="width:${Math.round(100*nDone/ITEMS.length)}%"></i></div></div>`;
  if(nDone===ITEMS.length) html += `<div class="cheer">🌟 All done for today — great work, ${esc(ME.n)}!
    <div style="margin-top:12px"><button class="out" data-signout>👋 I'm done · Sign out</button></div></div>`;

  bySubject(ITEMS).forEach(([subj, items])=>{
    html += `<h3 class="group">${esc(subj)} <span class="gn">${items.filter(doneToday).length} of ${items.length} done</span></h3>`;
    items.forEach(it=>{ html += card(it, doneToday(it)); });
  });
  return html;
}

// One homework card; a = today's attempt at it, if any.
function card(it, a){
  const scored = a && a.pct!=null;
  const low = scored && a.pct < PASS;
  let status = '', btn = `<a class="go" href="${esc(pageUrl(it.href))}">Start →</a>`;
  if(a){
    status = !scored ? `<div class="status ok">✓ Done</div>`
      : low ? `<div class="status ok">✓ Done · ${a.pct}%</div>`
            : `<div class="status ok">✓ Done · ${a.pct}% ⭐ Nice job!</div>`;
    btn = `<a class="go again" href="${esc(pageUrl(it.href))}">Open again</a>`;
  }
  const size = it.n ? `${it.book?' · ':''}${it.n} ${it.type==='quiz'?'questions':'steps'}` : '';
  return `<div class="card${a?' done':''}">
    <span class="ic">${esc(it.ic)||'📄'}</span>
    <div class="body">
      <div class="t">${esc(it.t)}</div>
      <div class="meta"><span class="kind">${KIND[it.type]||'Task'}</span>${esc(it.book)}${size}</div>
      ${status}
    </div>
    ${btn}
  </div>`;
}

/* ---------- My day: what I did each day + Dad's / Mom's daily report ----------
   The facts come from my attempts. The report is `summary` on assignments/{uid}/days/{date}
   (parents write it — homework-system/daily-summary.mjs; kids can already read their own days). */
const WHO = { dad:'Dad', mom:'Mom' };
const dayLabel = d => new Date(d+'T00:00:00').toLocaleDateString('en-US',{ weekday:'long', month:'short', day:'numeric' });
const mins = s => s>=3600 ? `${Math.floor(s/3600)} h ${Math.round(s%3600/60)} min` : `${Math.max(1,Math.round(s/60))} min`;
const summaryOf = d => { const x = DAYS.find(y=>y.date===d); return x && x.summary; };
function reportCard(){
  const s = summaryOf(iso(today));
  if(!s) return '';
  return `<button class="card marked" data-tab="report"><span class="ic">📝</span>
    <div class="body"><div class="t">${WHO[s.by]||'Dad'} wrote your report for today!</div>
      <div class="meta">${esc(String(s.headline||'').slice(0,80))}${String(s.headline||'').length>80?'…':''}</div></div>
    <span class="go">Read it →</span></button>`;
}
function noteHtml(s, d){
  const list = (h, xs) => xs && xs.length ? `<h4>${h}</h4><ul>${xs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : '';
  return `<div class="note"><div class="from">📝 From ${WHO[s.by]||'Dad'} · ${esc(dayLabel(d))}</div>
    ${s.headline?`<p class="head">${esc(s.headline)}</p>`:''}
    ${list('🌟 What went well', s.good)}${list('🎯 What to work on', s.work)}${list('➡️ Next time', s.next)}</div>`;
}
function viewReport(){
  const since = new Date(today); since.setDate(since.getDate()-14);
  const from = iso(since);
  const dates = [...new Set([...ATT.map(a=>a.date), ...DAYS.filter(x=>x.summary).map(x=>x.date)])]
    .filter(d=>d && d>=from).sort().reverse();
  let html = `<h2 class="sec">My day</h2><p class="lead2">What you did each day, and the report Dad or Mom writes about it. The last two weeks.</p>`;
  if(!dates.length) return html + `<div class="empty"><span class="e">📅</span>Your days will show up here<br>after you finish some homework.</div>`;
  dates.forEach((d, n)=>{
    const list = ATT.filter(a=>a.date===d).slice().reverse();         // oldest first
    const pages = new Set(list.map(a=>a.id)).size;
    const firstTry = list.filter(a=>a.pct!=null).filter((a,i,arr)=>arr.findIndex(b=>b.id===a.id)===i);
    const avg = firstTry.length ? Math.round(firstTry.reduce((s,a)=>s+a.pct,0)/firstTry.length) : null;
    const secs = list.reduce((s,a)=>s+a.secs,0);
    const s = summaryOf(d);
    html += `<details class="day"${n===0?' open':''}><summary>${esc(dayLabel(d))}
      <span class="gn">${pages} done${avg!=null?` · ${avg}% average`:''}${secs?` · ${mins(secs)}`:''}${s?' · 📝 report':''}</span></summary>`;
    if(s) html += noteHtml(s, d);
    list.forEach(a=>{
      const col = a.pct==null || a.pct>=PASS ? 'var(--green)' : 'var(--red)';
      const tries = list.filter(b=>b.id===a.id);
      const k = tries.indexOf(a);
      html += `<div class="row"><span class="d">${a.when?String(a.when.getHours()).padStart(2,'0')+':'+String(a.when.getMinutes()).padStart(2,'0'):''}</span>
        <div class="body"><div class="t"><span class="subj">${esc(a.subj)}</span>${esc(a.t)}</div>
          <div class="sub">${a.secs?mins(a.secs):''}${tries.length>1?` · try ${k+1}`:''}</div></div>
        <span class="sc" style="color:${col}">${a.pct==null?'✓':a.pct+'%'}</span></div>`;
    });
    html += `</details>`;
  });
  return html;
}

function viewScores(){
  const since = new Date(today); since.setDate(since.getDate()-21);
  const mine = ATT.filter(a=>a.date >= iso(since));
  const scored = mine.filter(a=>a.pct!=null);
  let html = `<h2 class="sec">My scores</h2><p class="lead2">The last three weeks. ${PASS}% or more is a pass.</p>`;
  if(!mine.length){
    return html + `<div class="empty"><span class="e">📈</span>Your scores will show up here<br>after you finish a quiz.</div>`;
  }
  const avg = scored.length ? Math.round(scored.reduce((s,a)=>s+a.pct,0)/scored.length) : null;
  html += `<div class="stats">
    <div class="stat"><div class="v">${mine.length}</div><div class="k">Finished</div></div>
    <div class="stat"><div class="v" style="color:${avg==null?'var(--mute)':avg>=PASS?'var(--green)':'var(--rust)'}">${avg==null?'—':avg+'%'}</div><div class="k">Average</div></div>
    <div class="stat"><div class="v" style="color:var(--green)">${scored.filter(a=>a.pct>=PASS).length}</div><div class="k">Passed</div></div>
  </div>`;
  mine.forEach(a=>{
    const col = a.pct==null || a.pct>=PASS ? 'var(--green)' : 'var(--red)';
    html += `<div class="row"><span class="d">${a.date.slice(5)}</span>
      <div class="body"><div class="t"><span class="subj">${esc(a.subj)}</span>${esc(a.t)}</div>
        <div class="bar"><i style="width:${a.pct==null?100:a.pct}%;background:${col}"></i></div></div>
      <span class="sc" style="color:${col}">${a.pct==null?'✓':a.pct+'%'}</span>
      ${a.href?`<a class="go again" href="${esc(pageUrl(a.href))}">Redo</a>`:''}</div>`;
  });
  return html;
}

// One entry per page: the most recent attempt that still had wrong answers.
function mistakes(){
  const seen = new Set(), out = [];
  ATT.forEach(a=>{
    if(seen.has(a.id)) return;
    seen.add(a.id);                       // newest attempt per page decides
    if(a.wrong.length) out.push(a);
  });
  return out;
}
function viewMistakes(){
  const list = mistakes();
  let html = `<h2 class="sec">Mistakes notebook</h2>
    <p class="lead2">Questions you missed get saved here. Get them right next time and they disappear.</p>`;
  if(!list.length){
    return html + `<div class="empty"><span class="e">📒</span>Nothing to fix right now!<br>Missed questions will collect here.</div>`;
  }
  bySubject(list).forEach(([subj, rows])=>{
    html += `<h3 class="group">${esc(subj)} <span class="gn">${rows.length} to fix</span></h3>`;
    rows.forEach(a=>{
      html += `<div class="row"><span class="d">${a.date.slice(5)}</span>
        <div class="body"><div class="t">${esc(a.t)}</div>
          <div class="lead2" style="font-size:14.5px">${a.wrong.length} question${a.wrong.length>1?'s':''} to practise</div></div>
        ${a.href?`<a class="go" href="${esc(pageUrl(a.href))}">Practise</a>`:''}</div>`;
    });
  });
  return html;
}

/* ---------- pets & badges (the rules live in JS/kid-pets.js) ---------- */
const PETS_KEY = 'kid.pets.v1', NAP_MS = 3*24*3600*1000, RING = 2*Math.PI*58;
const plural = (n, w) => `${n} ${w}${n===1?'':'s'}`;
const shortDate = ms => new Date(ms).toLocaleDateString('en-US', { month:'short', day:'numeric' });
// 'YYYY-MM-DD' → what a kid would call that day ("yesterday", "Friday", "Sep 12"). Lower case
// because it always lands mid-sentence; onDay() adds the "on" only where English wants one.
function dayName(s){
  const [y,m,d] = String(s||'').split('-').map(Number);
  if(!y) return '';
  const dt = new Date(y, m-1, d), ago = Math.round((today-dt)/864e5);
  return ago===0 ? 'today' : ago===1 ? 'yesterday'
    : ago<7 ? dt.toLocaleDateString('en-US', { weekday:'long' }) : shortDate(+dt);
}
const onDay = s => { const d = dayName(s); return /^(today|yesterday)$/.test(d) ? d : `on ${d}`; };
// "Reading B" / "Reading B and Synonyms" / "Reading B and 2 more" — never a wall of titles.
function missedList(list){
  const t = (list||[]).filter(Boolean).map(esc);
  return !t.length ? '' : t.length===1 ? `<b>${t[0]}</b>`
    : t.length===2 ? `<b>${t[0]}</b> and <b>${t[1]}</b>`
    : `<b>${t[0]}</b> and ${plural(t.length-1, 'more page')}`;
}
const petOf = p => p && KidPets.PETS[p.kind];
const stageIc = p => petOf(p).stages[KidPets.stageOf(p.xp)][0];
const otherKey = () => Object.keys(KIDS).find(k=>k!==ME.key);
function readPetCache(){ try { return JSON.parse(localStorage.getItem(PETS_KEY)) || {}; } catch(e){ return {}; } }
function cachePet(key, pet){ try { const c = readPetCache(); c[key] = pet; localStorage.setItem(PETS_KEY, JSON.stringify(c)); } catch(e){} }

// The pet inside a ring that fills up towards the next level.
function habitat(p, extra){
  const L = KidPets.level(p ? p.xp : 0), frac = p ? L.into/L.need : 0;
  const fill = frac>0 ? `<circle class="fill" cx="66" cy="66" r="58" stroke-dasharray="${RING.toFixed(1)}" stroke-dashoffset="${(RING*(1-frac)).toFixed(1)}"/>` : '';
  return `<span class="habitat"><svg viewBox="0 0 132 132" aria-hidden="true"><circle class="track" cx="66" cy="66" r="58"/>${fill}</svg>
    <span class="pet"><span>${p ? stageIc(p) : '🥚'}</span></span>${p ? `<span class="lvl">Lv ${L.lv}</span>` : ''}${extra||''}</span>`;
}

// What pets/{uid} holds: the pet the kid picked, plus the latest summary.
// `left` = pages still not done on `day`. The sign-in screen (which can't read the database)
// needs it: a snapshot saved on a day that still had homework left is a streak that has since
// gone out, and showing the old number there would shrink in front of the kid at sign-in.
function petDoc(pet, g){
  return { kind:pet.kind, name:pet.name, chosenAt:pet.chosenAt,
    xp:g.xp, lv:g.lv, streak:g.streak, best:g.best, pages:g.pages, badges:g.badges.map(b=>b.id),
    todayDone:g.todayDone, left:(g.todayLeft||[]).length, day:iso(today), updatedAt:Date.now() };
}

const popEl = document.getElementById('pop'), popCard = document.getElementById('popcard');
const toastEl = document.getElementById('toast');
// Focus the card itself: focusing its first button would ring the first pet and look pre-picked.
function openPop(html){ popCard.innerHTML = html; popEl.hidden = false; popCard.tabIndex = -1; popCard.focus(); }
function closePop(){ popEl.hidden = true; popCard.innerHTML = ''; }
popEl.addEventListener('click', e=>{ if(e.target.closest('[data-close]')) closePop(); });
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape' || popEl.hidden) return;
  const later = document.getElementById('later');
  later ? later.click() : closePop();
});
let toastTimer = 0;
function toast(msg){
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ toastEl.hidden = true; }, 3500);
}

// After every load. No pet yet → offer the picker (on sign-in only). Otherwise save the new
// summary and celebrate what changed: a level, a stage, a badge or the streak gets the big
// card; XP alone gets a small toast.
async function afterLoad(from){
  const me = ME;
  if(SIB!==undefined) cachePet(otherKey(), SIB);
  if(PET===undefined) return;                 // couldn't read it — try again next time
  if(!PET){
    cachePet(ME.key, null);
    if(from==='signin' && !petSkipped) showPicker();
    return;
  }
  const prev = PET, next = petDoc(PET, GAME);
  cachePet(ME.key, next);
  const same = ['xp','lv','streak','best','pages','todayDone','left','day'].every(k=>prev[k]===next[k])
    && String(prev.badges)===String(next.badges);
  if(!same){
    try { await db.doc(`pets/${ME.uid}`).set(next); }
    catch(e){ console.warn('[pets] save failed:', e.code||e); }
  }
  if(ME!==me) return;                         // signed out meanwhile
  PET = next;
  render();
  const had = new Set(prev.badges||[]);
  const n = {
    xp: Math.max(0, GAME.xp-(prev.xp||0)),
    badges: GAME.badges.filter(b=>!had.has(b.id)),
    stageUp: KidPets.stageOf(GAME.xp) > KidPets.stageOf(prev.xp||0),
    lvUp: GAME.lv > (prev.lv||1),
    streakUp: GAME.streak > (prev.streak||0),
    // A streak that ends gets told to his face, with the reason. Never let the fire just vanish.
    streakEnd: (prev.streak||0) > 0 && !GAME.streak && GAME.streakBroke
  };
  if(!popEl.hidden) return;
  if(n.badges.length || n.stageUp || n.lvUp || n.streakUp || n.streakEnd) showNews(prev, n, from);
  else if(n.xp) toast(`+${n.xp} XP for ${PET.name} ${stageIc(PET)}`);
}

function sinceLabel(ms){
  const d = new Date(ms||0); d.setHours(0,0,0,0);
  const ago = Math.round((today-d)/864e5);
  return ago<=0 ? 'earlier today' : ago===1 ? 'yesterday'
    : ago<7 ? d.toLocaleDateString('en-US', { weekday:'long' }) : shortDate(ms);
}

function showNews(prev, n, from){
  const P = petOf(PET), st = KidPets.stageOf(GAME.xp), name = esc(PET.name);
  const pic = n.stageUp
    ? `<div class="evolve" aria-hidden="true"><span class="from">${P.stages[KidPets.stageOf(prev.xp||0)][0]}</span><span class="arrow">→</span><span class="to">${P.stages[st][0]}</span></div>`
    : habitat(PET);
  // Nothing good to report and the streak stopped: say that plainly instead of cheering.
  const onlyEnd = n.streakEnd && !n.badges.length && !n.stageUp && !n.lvUp && !n.streakUp && !n.xp;
  const head = n.stageUp ? `${name} grew into a ${esc(P.stages[st][1].toLowerCase())}!`
    : n.lvUp ? `${name} reached Lv ${GAME.lv}!`
    : onlyEnd ? `Your 🔥 streak stopped — here's why.`
    : from==='signin' ? `Here's what you did since ${sinceLabel(prev.updatedAt)}.` : 'Look what you just earned!';
  const pages = GAME.events.filter(e=>e.kind==='page' && e.at > (prev.updatedAt||0));
  let rows = '';
  if(n.xp) rows += `<div class="r"><span class="v" style="color:var(--green)">+${n.xp} XP</span><span class="t">${pages.length
    ? `${plural(pages.length, 'homework page')} finished<small>${esc(pages.slice(0,3).map(e=>e.t).join(' · '))}${pages.length>3?` · +${pages.length-3} more`:''}</small>`
    : 'for your homework'}</span></div>`;
  if(n.streakUp){
    const s = GAME.streak, b = GAME.best;
    rows += `<div class="r"><span class="v">🔥 ${s}</span><span class="t">${s===1?'homework day':'homework days in a row'}, all done<small>${
      s===1 ? 'Do it again next homework day to start a streak' : s>=b ? "That's your best ever!" : `Your best is ${b}. ${b-s+1} more to beat it!`}</small></span></div>`;
  }
  if(n.streakEnd){
    // `streakBroke` is only the LATEST unfinished day, and `after` is the run THAT day ended.
    // Those two always belong together. prev.streak does not: if he was away while two homework
    // days went by unfinished, prev.streak is the old run but streakBroke is the second day —
    // pairing them would tell him a run ended on a day that didn't end it. So when `after` is 0
    // (the latest break ended nothing, the fire was already out) name no day at all.
    const k = GAME.streakBroke, left = (GAME.todayLeft||[]).length;
    const restart = left ? `Finish today's ${plural(left, 'page')} and a new one starts at 1.`
      : 'A new one starts on your next full homework day.';
    const keep = `Your XP, badges and best (${plural(GAME.best, 'day')}) all stay.`;
    rows += k.after
      ? `<div class="r"><span class="v" style="color:var(--mute)">🔥→0</span><span class="t">Your streak of ${plural(k.after, 'day')} stopped<small>The homework from ${
          dayName(k.date)} wasn't all done${k.missed.length ? ` — ${missedList(k.missed)}` : ''}. ${restart} ${keep}</small></span></div>`
      : `<div class="r"><span class="v" style="color:var(--mute)">🔥→0</span><span class="t">Your 🔥 streak has stopped<small>While you were away, a homework day went by without everything getting done. ${restart} ${keep}</small></span></div>`;
  }
  n.badges.slice(0,3).forEach(b=>{
    const i = KidPets.badgeInfo(b.id, PET.kind);
    if(i) rows += `<div class="newbadge"><span class="medal">${i.ic}</span><span class="t"><b>New badge: ${esc(i.n)}</b><small>${esc(i.d)}</small></span></div>`;
  });
  if(n.badges.length>3) rows += `<span class="t" style="font-size:15px;color:var(--ink2)">…and ${plural(n.badges.length-3, 'more badge')} in the My pet tab.</span>`;
  openPop(`<h2>${from==='signin' ? `Welcome back, ${esc(ME.n)}!` : `Nice work, ${esc(ME.n)}!`}</h2>${pic}
    <p class="plead">${head}</p>${rows ? `<div class="since">${rows}</div>` : ''}
    <button class="go" type="button" data-close>${from==='signin' ? "See today's homework →" : 'Keep going →'}</button>`);
}

function showPicker(){
  openPop(`<h2>Pick your pet!</h2>
    <p class="plead">Your pet grows every time you do your homework. It stays with you, so choose carefully!</p>
    <div class="petopts">${Object.entries(KidPets.PETS).map(([k,p])=>`<button class="petopt" type="button" id="po-${k}" data-kind="${k}" aria-pressed="false">
      <span class="po-ic">${p.stages[1][0]}</span><span class="po-n">${p.n}</span><span class="po-g">grows into ${p.stages[3][0]}</span></button>`).join('')}</div>
    <label class="plabel" for="petname">Give it a name</label>

function showMeet(){

// Why the streak is what it is, in one or two sentences. A streak that ends must always say
// which day ended it and what was left on that day (HOMEWORK-SYSTEM.md §二十三).
function streakWhy(g){
  const left = (g.todayLeft||[]).length;
  if(g.streak){
    const nxt = `${g.streak+1} in a row`;
    const line = left ? `Finish ${missedList(g.todayLeft)} today and it's ${nxt}.`
      : g.todayDone ? `Today's homework is all done, so the fire is safe. Do it again next homework day to make it ${nxt}.`
      : `No homework today, so nothing can break it. Your next full homework day makes it ${nxt}.`;
    return `<div class="streakwhy">All done since <b>${dayName(g.streakFrom)}</b>. ${line}</div>`;
  }
  const b = g.streakBroke;
  const start = left ? `Finish all ${plural(left, 'page')} left today and a new streak starts at 1.`
    : `Finish everything a homework day gives you, on that day, and a new streak starts at 1.`;
  if(!b) return `<div class="streakwhy">${start}</div>`;
  const what = b.missed.length ? ` — ${missedList(b.missed)} ${b.missed.length===1?'was':'were'}n't done that day`
    : ` — it wasn't all finished`;
  return `<div class="streakwhy gone">🔥 <b>Your streak stopped ${onDay(b.date)}</b>${what}.${
    b.after ? ` That ended a run of ${plural(b.after, 'day')}.` : ''} ${start}</div>`;
}

function viewPet(){
  const head = `<h2 class="sec">My pet</h2>`;
  if(PET===undefined) return head + `<div class="empty"><span class="e">📡</span>Couldn't load your pet right now.<br>Check the Wi-Fi and try again.</div>`;
  if(!PET) return head + `<div class="empty"><span class="e">🥚</span>You haven't picked a pet yet.<br>
    <button class="go" type="button" data-pickpet style="margin-top:14px">Pick my pet</button></div>`;
  const g = GAME, me = { ...PET, xp:g.xp }, P = petOf(PET), st = KidPets.stageOf(g.xp), name = esc(PET.name);
  const next = st===0 ? 'Starts growing after your first homework page'
    : st<3 ? `Grows into a ${esc(P.stages[st+1][1].toLowerCase())} at Lv ${KidPets.STAGE_LV[st]}`
    : 'Fully grown! Keep going to level up.';
  let html = `<div class="petcard">${habitat(me)}
    <div class="info">
      <div class="pname">${name}</div>
      <div class="stage">${esc(P.stages[st][1])} · ${next}</div>
      <div class="xpbar"><i style="width:${Math.round(100*g.into/g.need)}%"></i></div>
      <div class="xpcap">${g.into} / ${g.need} XP to Lv ${g.lv+1}</div>
      <div class="stages">${P.stages.map((s,i)=>`${i?'<i>›</i>':''}<span class="${i<=st?'got':''}" title="${esc(s[1])}">${s[0]}</span>`).join('')}</div>
      <div class="streakrow"><span class="streak${g.streak?'':' off'}">${g.streak ? `🔥 ${plural(g.streak, 'day')} in a row` : 'No streak yet'}</span>
        <span class="xpcap">best ${g.best}</span></div>
      ${streakWhy(g)}
    </div></div>`;

  const X = KidPets.XP;
  html += `<div class="earn"><div class="lbl">How ${name} grows</div><table>
    <tr><td>Finish a homework page</td><td class="xp">+${X.page} XP</td></tr>
    <tr><td>Get ${PASS}% or more on a homework quiz (redoing it counts)</td><td class="xp">+${X.pass} XP</td></tr>
    <tr><td>Clear a page from your Mistakes notebook</td><td class="xp">+${X.fix} XP</td></tr>
    <tr><td>Finish all of a day's homework on that day</td><td class="xp">+${X.day} XP</td></tr>
  </table></div>`;

  html += `<div class="earn"><div class="lbl">How the 🔥 streak works</div><ul class="rules">
    <li>Finish <b>every page</b> a homework day gives you, <b>on that day</b> → your streak goes up by 1.</li>
    <li>Leave even one page → the streak goes back to <b>zero</b> once that day is over.</li>
    <li>A day with <b>no homework</b> never counts, and never breaks it.</li>
    <li>Today can't break it — you have until bedtime.</li>
    <li>Doing a page <b>late</b> still gives you XP, but it can't bring a stopped streak back.</li>
    <li>Your <b>best ever</b> is kept forever, even at 0. Yours is ${plural(g.best, 'day')}.</li>
  </ul></div>`;

  const subjects = [...new Set(DAYS.flatMap(d=>[...d.items, ...d.withdrawn].map(it=>it.subj)))];
  const cat = KidPets.catalog(PET.kind, subjects), got = new Map(g.badges.map(b=>[b.id, b.at]));
  const ctx = { mistakes: mistakes().length };
  const earned = cat.filter(b=>got.has(b.id)).sort((a,b)=>got.get(b.id)-got.get(a.id));
  html += `<h3 class="group">Badges <span class="gn">${earned.length} of ${cat.length}</span></h3><div class="badges">`
    + earned.map(b=>`<div class="bdg"><span class="medal">${b.ic}</span><span class="bn">${esc(b.n)}</span>
        <span class="bd">${esc(b.d)}${got.get(b.id) ? ` · ${shortDate(got.get(b.id))}` : ''}</span></div>`).join('')
    + cat.filter(b=>!got.has(b.id)).map(b=>`<div class="bdg locked"><span class="medal locked">?</span>
        <span class="bn">${esc(b.n)}</span><span class="bd">${esc(b.hint(g, ctx))}</span></div>`).join('')
    + `</div>`;

  if(petOf(SIB)){
    const L = KidPets.level(SIB.xp);
    html += `<div class="sib"><span class="e">${stageIc(SIB)}</span><span><b>${esc(KIDS[otherKey()].n)}'s pet: ${esc(SIB.name)}</b><br>
      <span class="xpcap">Lv ${L.lv} · ${SIB.streak ? `🔥 ${plural(SIB.streak, 'day')}` : 'no streak yet'} · ${plural((SIB.badges||[]).length, 'badge')}</span></span></div>`;
  }
  return html + `<p class="foot">Pets never get sick, and a streak that stops never takes XP or badges away — you keep everything you earned. If you're away for a while, yours just takes a nap.</p>`;
}

const pickCards = document.getElementById('pickcards');
function renderPick(){
  const cache = readPetCache();
  pickCards.innerHTML = Object.entries(KIDS).map(([key, k])=>{
    const p = petOf(cache[key]) ? cache[key] : null;
    if(!p) return `<button class="who ${k.cls}" type="button" data-kid="${key}">${habitat(null)}
      <span class="nm">${k.n}</span>
      <span class="whisper">${cache[key]===null ? 'Sign in to pick your pet!' : 'Sign in to see your pet!'}</span></button>`;
    const L = KidPets.level(p.xp), st = KidPets.stageOf(p.xp);
    const nap = Date.now() - (p.updatedAt||0) > NAP_MS;
    // Age the snapshot forward: it was true on p.day, not necessarily today. This screen runs
    // before sign-in and cannot read the database, so there are only three honest answers:
    //   saved today            → what today's own load worked out; today can't break it
    //   saved yesterday, clean → yesterday finished, and today can't break it either → still stands
    //   saved yesterday, left  → yesterday ended unfinished, the fire is already out → 0
    //   older than that        → homework days may have gone by unseen → we do NOT know.
    // Printing p.streak in that last case is how the fire used to shrink in his face right
    // after sign-in, so say nothing rather than a number that is probably wrong.
    const yest = new Date(today); yest.setDate(yest.getDate() - 1);
    const fresh = p.day === iso(today), known = fresh || p.day === iso(yest);
    const left = fresh ? (p.left||0) : 0;

    const wh = fresh && p.todayDone ? 'All done today ⭐'
      : left ? `${plural(left, 'page')} still to do today`
      : nap ? `${esc(p.name)} is napping. Come say hi!`
      : `${esc(p.name)} is ${L.need-L.into} XP from Lv ${L.lv+1}`;
    const medals = (p.badges||[]).slice(-3).reverse().map(id=>KidPets.badgeInfo(id, p.kind)).filter(Boolean)

    return `<button class="who ${k.cls}" type="button" data-kid="${key}">
      ${habitat(p, nap ? '<span class="zz">💤</span>' : '')}
      <span class="nm">${k.n}</span>

      ${medals ? `<span class="medals">${medals}</span>` : ''}
      <span class="whisper">${wh}</span></button>`;
  }).join('');
}

document.getElementById('notme').addEventListener('click',()=>showPick());

async function tryPin(){
  if(!/^\d{6}$/.test(pin.value)){ pinErr.textContent = 'Your PIN has 6 numbers.'; return; }
  pin.disabled = true; pinErr.textContent = '';
  try {
    await auth.signInWithEmailAndPassword(`${picking}@family.local`, pin.value);
  } catch(e){
    pinErr.textContent =
      e.code==='auth/too-many-requests' ? 'Too many tries. Take a little break, or ask a parent.' :
      e.code==='auth/network-request-failed' ? 'No internet right now. Check the Wi-Fi and try again.' :
      "That PIN didn't work. Try again!";
    pin.value = ''; pin.disabled = false; pin.focus();
  }
}
pin.addEventListener('input',()=>{ pin.value = pin.value.replace(/\D/g,''); pinErr.textContent='';
  if(pin.value.length===6) tryPin(); });
pin.addEventListener('keydown',e=>{ if(e.key==='Enter') tryPin(); });

let firstAuth = true;
auth.onAuthStateChanged(async user=>{
  const restored = firstAuth; firstAuth = false;   // first call = the sign-in saved on this device
  if(!user){ showPick(signinMsg); signinMsg = ''; return; }
  const key = Object.keys(KIDS).find(k=>KIDS[k].uid===user.uid);
  if(!key){
    signinMsg = "Who's doing homework today?";
    await auth.signOut();
    return;
  }
  // Saved sign-in, but nobody used the site for 30 minutes: probably someone else now → ask again.
  if(restored && idleAtLoad){ await auth.signOut(); return; }
  touch(true);
  ME = { ...KIDS[key], key };
  document.body.className = ME.cls;
  document.getElementById('hav').textContent = ME.av;
  document.getElementById('hname').textContent = `Hi, ${ME.n}!`;
  document.getElementById('hdate').textContent =
    today.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
  signinEl.hidden = true; appEl.hidden = false;
  viewEl.innerHTML = `<div class="empty"><span class="e">⏳</span>Loading your homework…</div>`;
  try { await load(); render(); }
  catch(e){
    console.error(e);
    viewEl.innerHTML = `<div class="empty"><span class="e">📡</span>Couldn't load your homework.<br>Check the Wi-Fi, then pull down to refresh.</div>`;
    return;
  }
  afterLoad('signin').catch(console.error);
});
document.getElementById('switch').addEventListener('click',()=>auth.signOut());
viewEl.addEventListener('click', e=>{
  if(e.target.closest('[data-signout]')) auth.signOut();
  if(e.target.closest('[data-pickpet]')) showPicker();
  const tab = e.target.closest('[data-tab]');
  if(tab) document.querySelector(`.tab[data-v="${tab.dataset.tab}"]`).click();
});

['pointerdown','keydown','scroll','touchstart'].forEach(ev=>
  window.addEventListener(ev, ()=>{ if(ME) touch(); }, { capture:true, passive:true }));
setInterval(()=>{
  // Midnight while the page just sits there (nothing hidden, nothing clicked). Not mid-popup:
  // that would throw away a card he hasn't read, or a pet name he's halfway through typing.
  if(dateChanged() && popEl.hidden){ location.reload(); return; }
  if(ME && idle()) auth.signOut();
}, 60*1000);

// A page left open overnight still thinks it's yesterday: it would show yesterday's homework as
// today's, never notice a streak had ended, and write that stale day into pets/{uid}. Nothing here
// recomputes `today`, so start the day fresh instead.
function dateChanged(){ const d = new Date(); d.setHours(0,0,0,0); return +d !== +today; }

// Coming back from a quiz page: refresh so the new score shows straight away.
// Coming back after a long time away (screen locked, iPad put down): sign out instead.
function comeBack(){
  if(dateChanged()){ location.reload(); return; }
  if(!ME) return;
  if(idle()) auth.signOut();
  else load().then(render).then(()=>afterLoad('back')).catch(console.error);
}
window.addEventListener('pageshow', e=>{ if(e.persisted) comeBack(); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') comeBack(); });
</script>
</body>
</html>
