<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家长控制台 · Parent Console</title>
<!-- Add to home screen as its own app (only this page; the kids' pages are not in scope). -->
<link rel="manifest" href="parent.webmanifest">
<link rel="apple-touch-icon" href="icons/parent-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/parent-192.png">
<meta name="theme-color" content="#14203a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家长">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0d1626; --ink2:#14203a; --card:#1a2942; --line:#2a3b58;
    --cream:#f3f0e7; --mute:#93a2bd; --gold:#c9a227; --gold2:#b0894e;
    --green:#4bb67a; --red:#d9534f; --amber:#e0a33e; --blue:#5b8fc7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{background:var(--ink);color:var(--cream);
       font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:14px;line-height:1.5;
       padding:0 0 60px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:700;letter-spacing:.2px}

  /* ---------- sign-in gate ---------- */
  #gate{position:fixed;inset:0;background:var(--ink);z-index:200;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
  #gate h1{font-size:30px;color:var(--cream)}
  #gate .sub{color:var(--mute);font-size:13px;text-align:center;max-width:420px}
  #gate .err{color:var(--red);font-size:12.5px;min-height:16px;max-width:420px;text-align:center}
  #gate .or{color:var(--mute);font-size:12px}
  #gate .pinrow{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--mute);font-size:13px}
  #gate .pinrow input{font-family:inherit;font-size:26px;letter-spacing:12px;text-align:center;width:170px;
        padding:8px 0 8px 12px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--cream);outline:none}
  #gate .pinrow input:focus{border-color:var(--gold2)}
  .btn{font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border-radius:8px;
       padding:10px 18px;border:1.5px solid var(--gold2);background:transparent;color:var(--gold);
       transition:background .12s,color .12s}
  .btn:hover{background:var(--gold2);color:var(--ink)}
  .btn.solid{background:var(--gold2);color:var(--ink);border-color:var(--gold2)}
  .btn.solid:hover{background:var(--gold)}
  .btn.ghost{border-color:var(--line);color:var(--mute)}
  .btn.ghost:hover{background:var(--line);color:var(--cream)}
  .btn:disabled{opacity:.35;cursor:not-allowed}

  /* ---------- header ---------- */
  header{border-bottom:1px solid var(--line);background:var(--ink2);position:sticky;top:0;z-index:80}
  .hrow{display:flex;align-items:baseline;gap:14px;padding:16px 0 12px;flex-wrap:wrap}
  .hrow h1{font-size:23px}
  .eyebrow{font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold2)}
  .hrow .spacer{margin-left:auto}
  .whoami{font-size:11px;color:var(--mute)}
  .tabs{display:flex;gap:4px;padding-bottom:0}
  .tab{font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;background:none;border:none;
       color:var(--mute);padding:9px 15px;border-bottom:2.5px solid transparent;transition:color .12s}
  .tab:hover{color:var(--cream)}
  .tab.on{color:var(--gold);border-bottom-color:var(--gold)}
  .tab .pill{background:var(--line);color:var(--cream);border-radius:999px;
             font-size:10.5px;padding:1px 7px;margin-left:6px}

  /* ---------- generic card ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:14px;margin-top:16px;
         align-items:start}   /* not stretch: a kid with nothing that day must not become a tall empty column */
  h2.sec{font-size:19px;margin:26px 0 2px}
  .seclead{color:var(--mute);font-size:12.5px;margin-bottom:12px}
  /* 「?」: every explanation line sits behind one of these (Sam 2026-09-19: 说明太多，做成问号，要看再点) */
  .qm{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-left:5px;padding:0;
      border:1px solid var(--line);border-radius:50%;background:none;color:var(--mute);font:600 10px/1 system-ui,sans-serif;
      vertical-align:2px;cursor:pointer;letter-spacing:0;text-transform:none}
  .qm:hover,.qm.on{border-color:var(--gold2);color:var(--gold2)}
  h2.sec .qm{width:18px;height:18px;font-size:11px;vertical-align:3px}
  #qtip{position:fixed;z-index:60;max-width:min(300px,calc(100vw - 24px));padding:9px 12px;border-radius:9px;
        background:var(--card);border:1px solid var(--gold2);box-shadow:0 6px 24px rgba(0,0,0,.45);
        color:var(--cream);font-size:12.5px;font-weight:400;line-height:1.65;letter-spacing:0;text-transform:none}
  #qtip p+p{margin-top:6px}

  /* ---------- today ---------- */
  .kidhead{display:flex;align-items:center;gap:10px;margin-bottom:3px}
  .kidhead .av{font-size:24px}
  .kidhead h3{font-size:19px}
  .kidhead .when{margin-left:auto;font-size:11px;color:var(--mute)}
  /* Kid cards fold, and start folded (kidCard / kidOpen). Folded, the summary still carries that
     kid's numbers — folding may hide the detail, never what the tab is for. */
  details.kc>summary{cursor:pointer;list-style:none;display:block}
  details.kc>summary::-webkit-details-marker{display:none}
  .kidhead .fold{color:var(--gold2);font-size:11px;margin-left:9px;display:inline-block;transition:transform .12s}
  details.kc[open] .kidhead .fold{transform:rotate(90deg)}
  .kcsum{font-size:12px;color:var(--mute);line-height:1.7;margin-top:2px}
  .kcsum b{color:var(--cream);font-weight:600}
  details.kc[open]>summary .kcsum{display:none}
  .metrics{display:flex;gap:18px;margin:12px 0 14px;padding:11px 0;
           border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .metric .v{font-size:21px;font-weight:600;font-family:'Playfair Display',serif}
  .metric .k{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mute);margin-top:1px}
  .task{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .task:last-child{border-bottom:none}
  .task .ic{font-size:17px}
  .task .nm{flex:1;min-width:0}
  .task .nm b{font-weight:600;font-size:13px;display:block}
  .task .nm span{font-size:11px;color:var(--mute)}
  .chipst{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .st-done{background:rgba(75,182,122,.16);color:var(--green)}
  .st-low{background:rgba(217,83,79,.16);color:var(--red)}
  .st-open{background:rgba(224,163,62,.16);color:var(--amber)}
  .empty{color:var(--mute);font-size:12.5px;padding:14px 0;text-align:center}
  .daynav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 0}
  .daynav input[type=date],.moverow input[type=date]{font-family:inherit;font-size:13px;background:var(--card);
         border:1.5px solid var(--line);border-radius:7px;color:var(--cream);padding:6px 9px;outline:none}
  .task .nm span.tm{display:block}
  .task .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .mini{font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;border-radius:6px;padding:3px 8px;
        border:1px solid var(--line);background:transparent;color:var(--mute)}
  .mini:hover{color:var(--cream);border-color:var(--gold2)}
  .mini.bad:hover{color:var(--red);border-color:var(--red)}
  .mini:disabled{opacity:.35;cursor:not-allowed}
  .moverow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 0 10px 27px;font-size:12px;color:var(--mute)}
  .pulled{font-size:11.5px;color:var(--mute);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
  .recent{color:var(--gold)}

  /* ---------- bank ---------- */
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 12px}
  .filters input[type=search]{flex:1;min-width:230px;font-family:inherit;font-size:13.5px;
        background:var(--card);border:1.5px solid var(--line);border-radius:8px;color:var(--cream);
        padding:10px 13px;outline:none}
  .filters input[type=search]:focus{border-color:var(--gold2)}
  .fchip{font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;border-radius:999px;
         padding:7px 13px;border:1.5px solid var(--line);background:transparent;color:var(--mute)}
  .fchip:hover{color:var(--cream);border-color:var(--gold2)}
  .fchip.on{background:var(--gold2);border-color:var(--gold2);color:var(--ink)}
  .groupbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .groupbar .spacer{margin-left:auto}
  details.subj{background:var(--card);border:1px solid var(--line);border-radius:12px;
               margin-bottom:10px;overflow:hidden}
  details.subj>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;
               padding:13px 18px;font-family:'Playfair Display',Georgia,serif;font-size:17px;font-weight:700}
  details.subj>summary::-webkit-details-marker{display:none}
  details.subj>summary::before{content:'▸';color:var(--gold2);font-size:13px;transition:transform .12s}
  details.subj[open]>summary::before{transform:rotate(90deg)}
  details.subj>summary:hover{background:rgba(42,59,88,.35)}
  .scount{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;font-weight:500;color:var(--mute)}
  .ssel{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;font-weight:600;
        background:var(--gold2);color:var(--ink);border-radius:999px;padding:1px 8px}
  .shelf{border-top:1px solid var(--line);padding:2px 18px 6px}
  .shelfhead{display:flex;align-items:center;gap:12px;padding:11px 0 3px;
             font-size:12.5px;font-weight:600;color:var(--gold)}
  .shelfhead label{display:flex;align-items:center;gap:9px;cursor:pointer}
  .shelftog{font:inherit;font-weight:600;color:var(--gold);background:none;border:none;padding:2px 0;cursor:pointer;
            display:inline-flex;align-items:center;gap:7px;text-align:left}
  .shelftog::before{content:'▸';color:var(--gold2);font-size:13px;display:inline-block;transition:transform .12s}
  .shelftog.open::before{transform:rotate(90deg)}
  .shelftog:hover{color:var(--cream)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  tbody tr{border-bottom:1px solid rgba(42,59,88,.55)}
  tbody tr:hover{background:rgba(42,59,88,.3)}
  tbody tr.sel{background:rgba(201,162,39,.09)}
  td{padding:9px}
  td.c{text-align:center}
  td .t{font-weight:600}
  a.open{color:inherit;text-decoration:none}
  a.open:hover{color:var(--gold);text-decoration:underline}
  a.open .ext{color:var(--gold2);font-size:11px;font-weight:500}
  td .d{font-size:11px;color:var(--mute);margin-top:2px}
  td .crumb{font-size:10.5px;color:var(--mute);letter-spacing:.2px}
  input[type=checkbox]{width:16px;height:16px;accent-color:var(--gold);cursor:pointer}
  .badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap}
  .b-quiz{background:rgba(91,143,199,.18);color:var(--blue)}
  .b-ref{background:rgba(147,162,189,.15);color:var(--mute)}
  .b-practice{background:rgba(201,162,39,.16);color:var(--gold)}
  .lock{font-size:11px;color:var(--mute)}
  .b-assigned{background:rgba(75,182,122,.18);color:var(--green);border:1px solid rgba(75,182,122,.45);
              margin-left:4px;vertical-align:1px;cursor:help}
  tbody tr.assigned{background:rgba(75,182,122,.07);box-shadow:inset 3px 0 var(--green)}
  tbody tr.assigned.sel{background:rgba(201,162,39,.09)}
  .sasg{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;font-weight:600;
        background:rgba(75,182,122,.18);color:var(--green);border-radius:999px;padding:1px 8px}
  tbody tr.arch{opacity:.5}
  tbody tr.arch:hover{opacity:.85}
  .b-arch{background:rgba(147,162,189,.13);color:var(--mute);border:1px solid var(--line)}
  .archnote{font-size:11.5px;color:var(--mute);margin-top:-6px;margin-bottom:10px}
  /* 每行的归档开关：安静地待在类型下面，点一下就归档 / 放回来 */
  .archbtn{font:inherit;font-size:10.5px;font-weight:600;color:var(--mute);background:none;
           border:1px solid var(--line);border-radius:5px;padding:2px 7px;cursor:pointer;white-space:nowrap}
  .archbtn:hover{color:var(--cream);border-color:var(--gold2)}
  .archbtn:disabled{opacity:.45;cursor:default}
  .archline{margin-top:4px;display:flex;gap:5px;align-items:center;justify-content:center;flex-wrap:wrap}

  /* ---------- assign bar ---------- */
  #assignbar{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--ink2);
             border-top:2px solid var(--gold2);box-shadow:0 -8px 26px rgba(0,0,0,.45)}
  #assignbar .inner{max-width:1180px;margin:0 auto;padding:13px 20px;
             display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  #assignbar .n{font-size:14px;font-weight:600}
  #assignbar .n b{color:var(--gold);font-size:19px;font-family:'Playfair Display',serif}
  #assignbar label{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mute)}
  #assignbar select,#assignbar input[type=date]{font-family:inherit;font-size:13px;background:var(--card);
             border:1.5px solid var(--line);border-radius:7px;color:var(--cream);padding:8px 10px;outline:none}
  #assignbar select:focus,#assignbar input[type=date]:focus{border-color:var(--gold2)}
  .toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);z-index:120;
         background:var(--green);color:#05210f;font-weight:600;font-size:13px;
         padding:11px 20px;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .toast.bad{background:var(--red);color:#fff}
  .demo{background:#3a2c12;border:1px solid var(--gold2);color:#e8d9ae;font-size:12.5px;
        padding:9px 14px;border-radius:8px;margin:16px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .demo .btn{margin-left:auto;padding:6px 14px;font-size:12px}

  /* ---------- focus summary ---------- */
  .stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line)}
  .stack .on{background:var(--green)}
  .stack .off{background:var(--amber)}
  .stacklbl{font-size:11px;color:var(--mute);margin:5px 0 2px}
  .subhd{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mute);margin:18px 0 2px}
  /* ---------- 知识点 (weakness list, HOMEWORK-SYSTEM.md §三十五) ---------- */
  .skrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
  .skrow.red{border-color:rgba(217,83,79,.55);background:rgba(217,83,79,.07)}
  .skrow.thin{opacity:.66}
  .sktop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .sktop .nm{font-weight:700;color:var(--cream);font-size:14px}
  .skid{font:500 10.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mute)}
  .skmet{display:flex;gap:16px;flex-wrap:wrap;margin-top:7px;font-size:12px;color:var(--mute)}
  .skmet b{display:block;font-size:15px;color:var(--cream);font-weight:700}
  .sknot{margin-top:7px;font-size:12px;color:var(--mute)}
  .skwrong{margin-top:8px}
  .skwrong summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:12px;list-style:none}
  .skwrong summary::-webkit-details-marker{display:none}
  .skwrong summary::before{content:'▸ ';font-size:10px}
  .skwrong[open] summary::before{content:'▾ '}
  .skwrong ul{margin:7px 0 0;padding-left:16px}
  .skwrong li{margin:4px 0;font-size:12.5px;color:var(--mute)}
  .skwrong li b{color:var(--cream);font-weight:600}
  .flagrow{display:flex;gap:11px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
  .flagrow .when,.frow .when{font-size:11px;color:var(--mute);width:44px;flex:0 0 auto}
  .flagrow .nm{flex:1;min-width:0}
  .flags span{display:inline-block;background:rgba(224,163,62,.16);color:var(--amber);
              font-size:10.5px;padding:2px 7px;border-radius:4px;margin:4px 4px 0 0}
  .frow{padding:10px 0;border-bottom:1px dashed var(--line)}
  .frow:last-child{border-bottom:none}
  .ftop{display:flex;gap:11px;align-items:baseline;font-size:12.5px}
  .ftop .nm{flex:1;min-width:0}
  .fnum{font-family:'Playfair Display',serif;font-size:15px;font-weight:700}
  .fmeta{font-size:11px;color:var(--mute);margin:3px 0 0 55px}
  .qstrip{display:flex;align-items:flex-end;gap:1px;height:36px;margin:8px 0 0 55px;padding-top:6px}
  .qstrip i{flex:1 1 0;max-width:10px;min-width:2px;background:var(--blue);opacity:.8;
            border-radius:2px 2px 0 0;position:relative}
  .qstrip i.miss{background:#e59b98;opacity:1}
  .qstrip i.slow{background:var(--red);opacity:1}
  .qstrip i.guess{background:var(--amber);opacity:1}
  .qstrip i.away::after{content:'';position:absolute;top:-6px;left:50%;width:4px;height:4px;
                        margin-left:-2px;border-radius:50%;background:var(--cream)}
  .legend{font-size:11.5px;color:var(--mute);margin-top:14px;line-height:1.8}
  .legend i{display:inline-block;width:9px;height:12px;border-radius:2px;vertical-align:-1px;margin:0 3px 0 8px}

  /* ---------- history (完成记录): one day at a time, every number with a note ---------- */
  .bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;border-radius:99px}
  /* The guides fold and ALL of them start folded (guideOpen) — a tab opens on data, not on prose.
     Folded, a guide is one quiet ⓘ line, the same shape Reading Club's 这些数字怎么读 already had.
     No card, no border: the box itself was half of what made the first screen look busy. */
  .hguide{font-size:12px;color:var(--mute);line-height:1.8;margin:10px 0 2px}
  .hguide ul{margin:6px 0 0 18px;max-width:920px}
  .hguide b{color:var(--cream);font-weight:600}
  .hguide .chipst{font-size:10px;padding:1px 7px}
  details.hguide>summary{cursor:pointer;list-style:none;display:inline-block;color:var(--gold2);font-size:12px}
  details.hguide>summary::-webkit-details-marker{display:none}
  details.hguide>summary::before{content:'ⓘ';margin-right:5px}
  details.hguide>summary b{color:var(--gold2);font-weight:400}
  details.hguide[open]>summary{margin-bottom:3px}
  details.hguide>summary .tap{display:none}
  .fgroup{display:contents}   /* bank filters: one row per group on a phone, flowing together on a computer */
  .flbl{display:none}
  .seg{display:contents}      /* segmented control on a phone */
  .fchip.icon svg{display:none}   /* 全部展开 / 收起: words on a computer, icons on a phone */
  .hnote{font-size:11px;color:var(--mute);margin:0 0 4px;line-height:1.6}
  .dsum{background:rgba(201,162,39,.08);border-left:3px solid var(--gold2);border-radius:0 8px 8px 0;
        padding:9px 12px;font-size:12.5px;line-height:1.8;margin:12px 0 4px}
  .dsum .lbl{display:block;font-size:10.5px;letter-spacing:1.2px;color:var(--gold2)}
  .dsum b{color:var(--cream);font-weight:600}
  .dnote{border-left:3px solid var(--green);background:rgba(75,182,122,.07);border-radius:0 8px 8px 0;
         padding:9px 12px;font-size:13px;line-height:1.7;margin:8px 0 4px}
  .dnote .lbl{display:block;font-size:10.5px;letter-spacing:1.2px;color:var(--green)}
  .dnote.quiet{border-left-color:var(--line);background:none;color:var(--mute);font-size:12px}
  .dnote.quiet .lbl{color:var(--mute)}
  .dnote>summary{cursor:pointer;list-style:none;color:var(--cream)}
  .dnote>summary::-webkit-details-marker{display:none}
  .dnote .h{font-weight:600;color:var(--cream);margin-top:8px}
  .dnote ul{padding-left:20px}
  .hmet{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px 16px;margin:12px 0 4px;
        padding:11px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

    .rc .brow{grid-template-columns:36px minmax(40px,1fr) auto;gap:8px}

===================================================================== */
const firebaseConfig = {
  apiKey: 'AIzaSyDMKUeccjFtMbotXulnMhYcoykWpw4Y7ls',
  authDomain: 'family-checklist-acc6b.firebaseapp.com',
  projectId: 'family-checklist-acc6b',

};
// Named app: its sign-in is stored separately, so the checklists' anonymous sign-in

  // A practice game (a.practice) scores one round as right-on-the-first-go / items (Sam 2026-09-14).
  const pr = a.practice;

            : !wl && pr && typeof pr.firstTry==='number' && pr.items ? Math.round(100*pr.firstTry/pr.items) : null;

async function loadDay(d){
  const [g, w] = await Promise.all([dayRef('grace', d).get(), dayRef('warren', d).get()]);
  [['grace', g], ['warren', w]].forEach(([k, snap])=>{
    const x = snap.data() || {};
    // TD may have moved on while this was loading; then only today's copy (if it's today) is still wanted.
    if(d === TD){ ASSIGN[k] = x.items || []; PULLED[k] = x.withdrawn || []; }
    if(d === iso(today)) TODAY_ITEMS[k] = x.items || [];
    NOTES[k+'|'+d] = x.summary || null;
  });
}

async function loadAll(){
  const [bankSnap, attSnap] = await Promise.all([
    db.collection('bank').get(),
    // A family writes a handful a day, so fetch them all: "最近一次" needs more than three weeks.
    db.collection('attempts').orderBy('submittedAt','desc').get(),
    loadDay(TD),
    TD === iso(today) ? null : loadDay(iso(today))
  ]);
  const col = new Intl.Collator('zh', { numeric:true });
  BANK = bankSnap.docs.map(d => Object.assign({ docId:d.id }, d.data()))
    .sort((a,b) => col.compare(a.subj,b.subj) || col.compare(a.book||'',b.book||'') || col.compare(a.t,b.t));
  BANK_BY_ID = Object.fromEntries(BANK.map(b => [b.docId, b]));
  ATT = attSnap.docs.map(toAtt).filter(Boolean);
}

// A paper's first and last score from its tries on one day (oldest first); viewed pages have none.
// A practice game lets kids retry until right, so a round scores what was right on the first go, and a
// game is several rounds (关): the paper adds its rounds up — first = each round's first go, last = each
// round's latest go (redoing a round can raise it). Rounds are not retries, so no 第一遍/第二遍 for games.
function scoreTries(tries){
  const s = tries.filter(a=>a.pct!=null), ps = s.filter(a=>a.practice && a.practice.items);
  const sum = latest => {
    const by = new Map();
    ps.forEach(a=>{ const key = a.practice.round || ''; if(latest || !by.has(key)) by.set(key, a); });
    const rs = [...by.values()], items = rs.reduce((n,a)=>n+a.practice.items,0);
    return { pct: Math.round(100*rs.reduce((n,a)=>n+a.practice.firstTry,0)/items), at: ps[ps.length-1].at, wrong: [] };
  };
  const prac = ps.length > 0;
  return { prac, scored: s.length>0,
           first: prac ? sum(false) : s[0]||tries[0], last: prac ? sum(true) : s[s.length-1]||tries[tries.length-1] };
}
// One kid, one paper, one day: its tries (oldest first), when the last was handed in, and its scores.
function dayResult(k, id, d){
  const tries = ATT.filter(a=>a.kid===k && a.id===id && a.date===d).reverse();   // ATT is newest-first
  return tries.length ? Object.assign({ tries, end: tries[tries.length-1].at }, scoreTries(tries)) : null;
}

function closeTip(){ qtip.hidden = true; if(qtipFor) qtipFor.classList.remove('on'); qtipFor = null; }
document.addEventListener('click', e=>{
  const b = e.target.closest('.qm');
  if(!b){ if(!qtip.contains(e.target)) closeTip(); return; }
  e.preventDefault(); e.stopPropagation();   // a 「?」 inside a <summary> must not fold the card
  if(qtipFor===b){ closeTip(); return; }
  closeTip();
  qtip.innerHTML = b.dataset.tip; qtip.hidden = false; qtipFor = b; b.classList.add('on');
  const r = b.getBoundingClientRect(), w = qtip.offsetWidth, h = qtip.offsetHeight;
  const left = Math.max(12, Math.min(r.left + r.width/2 - w/2, innerWidth - w - 12));
  const top = r.bottom + 6 + h > innerHeight - 8 ? r.top - 6 - h : r.bottom + 6;
  qtip.style.left = left+'px'; qtip.style.top = Math.max(8, top)+'px';
}, true);

        const again = n<2 ? '' : le ? `这天写了 ${n} 篇` : r.prac ? `这天做了 ${n} 轮${r.first.pct!==r.last.pct?'，每关第一次合起来 '+r.first.pct+'%':''}`
          : `这天做了 ${n} 遍${r.first.pct!=null?'，第一遍 '+r.first.pct+'%':''}`;
        const tm = [at?'派于 '+stamp(at):'', it.movedFrom?'从 '+ymd(it.movedFrom)+' 挪来':'', again].filter(Boolean).join(' · ');
        html += `<div class="task"><span class="ic">${esc(it.ic)||'📄'}</span><span class="nm">
          <b>${openLink(it.href, esc(it.t))}</b><span>${esc(it.subj)}${it.book?' · '+esc(it.book):''} · ${LABEL[it.type]||''}${it.n?' · '+it.n+(it.type==='quiz'?' 题':' 项'):''}</span>
          ${tm?`<span class="tm">${tm}</span>`:''}
          </span><span class="acts">${st}
            <button class="mini" data-move="${esc(key)}">改日期</button>
            <button class="mini bad" data-pull="${esc(key)}">撤回</button></span></div>`;
        if(MOVING===key){
          const next = shiftDay(day,1) < iso(today) ? iso(today) : shiftDay(day,1);   // yesterday's → today
          html += `<div class="moverow">挪到 <input type="date" class="movedate" value="${next}">
            <button class="mini" data-movego="${esc(key)}">确定</button><button class="mini" data-movecancel>取消</button></div>`;
        }
      });
    }
    if(PULLED[k].length) html += `<div class="pulled">这天撤回了 ${PULLED[k].length} 份：${PULLED[k].map(p=>{
      const w = tsDate(p.withdrawnAt); return esc(p.t) + (w ? `（${stamp(w)}）` : ''); }).join('、')}</div>`;
    html += `</details>`;
  });
  return html + `</div>`;
}

/* ===================== BANK ===================== */
let F = { q:'', kid:'all', type:'all', arch:'active', sort:'group' }, SEL = new Set();
// 上传 = `added` (when the item joined the bank); 更新 = `updated` (last real change to the page,
// written by homework-system/bank-dates.mjs). Dates within the last 7 days show in gold.
const RECENT = shiftDay(iso(today), -6);
const touched = b => b.updated && b.updated > (b.added||'') ? b.updated : (b.added||'');
function bankDates(b){
  const part = (lbl, s) => s ? `<span class="${s>=RECENT?'recent':''}">${lbl} ${ymd(s)}</span>` : '';
  const html = [part('上传', b.added), part('更新', b.updated)].filter(Boolean).join(' · ');
  return html ? `<div class="crumb">${html}</div>` : '';
}
// Same running order as the Quizzes hub (Quizzes/index.html SUBJ_ORDER); unknown subjects go last.
const SUBJ_ORDER = ['📖 Reading','📝 SSAT','🔤 Vocabulary','🧮 Math','🧮 Algebra','✍️ Writing · Reflection',
                    '🧠 Big Ideas · concept exams','📚 中文 Chinese','🍁 More'];
const OPEN = new Set();   // subjects the parent has expanded; everything starts folded
const OPEN_SHELF = new Set();   // "subject|book" shelves the parent has expanded; shelves start folded too

// Same address homework.html builds (hrefs are relative to Quizzes/), plus ?preview=1:
// quiz-report.js records nothing on a preview, even if a kid is signed in on this device.
const previewUrl = href => encodeURI('Quizzes/' + href) + '?preview=1';
const openLink = (href, inner) => href
  ? `<a class="open" href="${esc(previewUrl(href))}" target="_blank" rel="noopener" title="新标签页打开看题 · 家长预览，不记成绩">${inner} <span class="ext">↗</span></a>`
  : inner;

function bankRows(){
  const q = F.q.trim().toLowerCase();
  return BANK.filter(b=>{
    if(F.kid!=='all' && b.kid!==F.kid && b.kid!=='both') return false;
    if(F.type!=='all' && b.type!==F.type) return false;
    if(F.arch==='active' && b.archived) return false;
    if(F.arch==='archived' && !b.archived) return false;
    if(q && !(b.t+' '+b.d+' '+b.subj+' '+b.book+' '+b.href).toLowerCase().includes(q)) return false;
    return true;

}
// Which kids have this item on today's homework.
const assignedTo = id => ['grace','warren'].filter(k => TODAY_ITEMS[k].some(it => it.id===id));
function assignedBadge(id){
  const ks = assignedTo(id);

  const tip = ks.map(k => KID[k].n + (ATT.some(a=>a.kid===k && a.id===id && a.date===iso(today)) ? '（今天已做）' : '（还没做）')).join('、');
  return `<span class="badge b-assigned" title="今天已派给 ${esc(tip)}">✓ Assigned ${ks.map(k=>KID[k].av).join('')}</span>`;

// The archive switch that sits under the type badge, one per row. Archived rows also say when and why
// (the reason is whatever archived them — the batches in HOMEWORK-SYSTEM.md §三之二, or 家长手动).
function archCell(b){
  const why = [b.archivedOn ? ymd(b.archivedOn) : '', b.archivedWhy || ''].filter(Boolean).join(' · ');
  return b.archived
    ? `<span class="badge b-arch"${why?` title="${esc(why)}"`:''}>已归档</span>
       <button class="archbtn" data-arch="${esc(b.docId)}" data-to="0" title="放回在用列表">放回</button>`
    : `<button class="archbtn" data-arch="${esc(b.docId)}" data-to="1" title="从默认列表里收起来，不删文件、不动成绩">归档</button>`;
}

// 归档 = 从默认题库列表里收起来。文件留着、历史成绩照样指得到、归档的还能派作业（§三之二）。
// 只写 Firestore。归档状态从此以线上为准，bank.json 不会自己跟上 ——
// 要把它抄回本机那份：node homework-system/check-bank.mjs --pull。
async function setArchived(ids, on){
  const del = firebase.firestore.FieldValue.delete();
  const batch = db.batch();
  ids.forEach(id => batch.set(db.collection('bank').doc(id), on
    ? { archived:true, archivedOn: iso(today), archivedWhy: '家长手动归档' }
    : { archived:false, archivedOn: del, archivedWhy: del }, { merge:true }));
  await batch.commit();
  // BANK 和 BANK_BY_ID 指的是同一批对象，改一处两边都跟上，不用重新拉一次题库
  ids.forEach(id=>{
    const b = BANK_BY_ID[id];
    if(!b) return;
    if(on){ b.archived = true; b.archivedOn = iso(today); b.archivedWhy = '家长手动归档'; }
    else { b.archived = false; delete b.archivedOn; delete b.archivedWhy; }
  });
}

// One bank row. withPlace: also say which subject / book it sits in (the by-time list has no groups).
function bankRow(b, withPlace){

    <td><div class="t">${openLink(b.href, `${esc(b.ic)} ${esc(b.t)}`)} ${assignedBadge(b.docId)}</div><div class="d">${esc(b.d)}</div>
      ${withPlace?`<div class="crumb">${esc(b.subj)}${b.book?' · '+esc(b.book):''}</div>`:''}${bankDates(b)}</td>

      今天已经派出去的标着 <span class="badge b-assigned" style="cursor:default">✓ Assigned</span>（后面是派给了谁）。</p><p>
      <b style="color:var(--blue)">可判分</b> 做完自动出分 ·
      <b style="color:var(--gold)">练习</b> 闯关式，按「一次就对」算分 ·
      <b style="color:var(--mute)">参考</b> 只记看过没看过</p>

    <div class="filters bankf">

      ${[['kid','孩子',[['all','全部'],['grace','👧 Grace'],['warren','👦 Warren']]],
         ['type','类型',[['all','不限'],['quiz','可判分'],['practice','练习'],['ref','参考']]],
         ['arch','归档',[['active','在用'],['all','含已归档'],['archived','只看归档']]],

          `<button class="fchip${F[f]===v?' on':''}" data-f="${f}" data-v="${v}">${l}</button>`).join('')}</span></div>`).join('')}
    </div>
    <div class="seclead groupbar">${rows.length} 条${F.q?` 匹配「${esc(F.q)}」`:''}
      <span class="spacer"></span>
      ${F.sort==='time'?'':`<button class="fchip icon" data-act="expand" title="全部展开" aria-label="全部展开"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"/></svg><span class="txt">全部展开</span></button>
      <button class="fchip icon" data-act="collapse" title="全部收起" aria-label="全部收起"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l5 5 5-5M7 20l5-5 5 5"/></svg><span class="txt">全部收起</span></button>`}</div>`;

            data-ids="${esc(list.map(b=>b.docId).join(' '))}">
          <button class="shelftog${shut?'':' open'}" data-shelf="${esc(key)}">${esc(book)}</button>

      }
      if(!shut) html += `<table><tbody>${list.map(b=>bankRow(b, false)).join('')}</tbody></table>`;
      html += `</div>`;

/* ===================== HISTORY (完成记录) ===================== */
// One day at a time with a written summary per kid (Sam 2026-09-13: 每天都要总结，不要三周总结), and
// every number carries a note saying what it counts. The same paper done several times that day is
// one row — 第一遍 20% → 第二遍 100% — so a quick retry can't hide a weak first try.
let HD = iso(today);   // the day 完成记录 is showing
const PASS = 80;       // same pass line as the quiz pages and pctColor
const ZH_N = '一二三四五六七八九十';
const nthTry = i => i < 10 ? `第${ZH_N[i]}遍` : `第 ${i+1} 遍`;

// A kid's papers on day d: attempts grouped by item, each group oldest-first; latest activity first.
function dayPapers(k, d){
  const by = new Map();
  ATT.filter(a=>a.kid===k && a.date===d).reverse().forEach(a=>{   // ATT is newest-first
    if(!by.has(a.id)) by.set(a.id, []);
    by.get(a.id).push(a);
  });
  return [...by.values()].map(tries=>{
    const x = tries[tries.length-1], r = scoreTries(tries);
    return { id:x.id, t:x.t, subj:x.subj, book:x.book, tries, prac:r.prac, scored:r.scored, essay:!!lastEssay(tries),
             first:r.first, last:r.last, secs:tries.reduce((s,a)=>s+a.secs,0),
             before:ATT.filter(a=>a.kid===k && a.id===x.id && a.date && a.date<d).length, end:x.at };
  }).sort((a,b)=>(b.end||0)-(a.end||0));
}

function dayStats(papers){
  const scored = papers.filter(p=>p.scored);
  return { scored, plain:papers.filter(p=>!p.scored && !p.essay), essays:papers.filter(p=>p.essay),
           firstOk:scored.filter(p=>p.first.pct>=PASS), lastOk:scored.filter(p=>p.last.pct>=PASS),
           nAtt:papers.reduce((s,p)=>s+p.tries.length,0), secs:papers.reduce((s,p)=>s+p.secs,0) };
}

// Book, else subject without its emoji ("🔤 Vocabulary" → "Vocabulary") — for the sentences below.
const where = p => p.book || (p.subj||'').replace(/^[^\p{L}\p{N}《]+/u, '');

// The day in plain sentences: what was done, what passed on the first try, what only passed on a retry.
function histSummary(k, papers, S){
  const n = KID[k].n;
  if(!papers.length) return `${n} 这天没有交卷记录。派了作业却没做的话，到「今日作业」翻到这一天看。`;
  const books = [...new Set(papers.map(where).filter(Boolean))];
  const out = [`${n} 这天做了 <b>${papers.length} 份</b>（交卷 ${S.nAtt} 次），一共用了 <b>${dur(S.secs)}</b>` +
    (books.length ? `，内容是 ${books.slice(0,3).map(esc).join('、')}${books.length>3?' 等':''}` : '') + '。'];
  const sc = S.scored.length;
  if(sc){
    const fixed = S.scored.filter(p=>p.first.pct<PASS && p.last.pct>=PASS);
    const open = S.scored.filter(p=>p.last.pct<PASS);
    if(S.firstOk.length===sc) out.push(`打分的 ${sc} 份<b>第一遍就全部达标</b>。`);
    else {
      const parts = [];
      if(S.firstOk.length) parts.push(`${S.firstOk.length} 份第一遍就达标`);
      if(fixed.length){
        const lo = Math.min(...fixed.map(p=>p.first.pct)), hi = Math.max(...fixed.map(p=>p.first.pct));
        parts.push(`<b>${fixed.length} 份第一遍没到 ${PASS}%</b>（第一遍 ${lo===hi?lo:lo+'–'+hi}%），重做后才达标`);
      }
      if(open.length) parts.push(`<b style="color:var(--red)">${open.length} 份到最后还没达标</b>（${open.map(p=>'「'+esc(p.t)+'」').join('、')}）`);
      out.push(`打分的 ${sc} 份里，${parts.join('；')}。`);
      // Minutes between the first try and the passing one: that close, the answers were still fresh.
      // Not for practice games: their rounds are different 关, so a later passing round isn't a quick retry.
      const quick = fixed.filter(p=>!p.prac);
      const gaps = quick.map(p=>{
        const ok = p.tries.find(a=>a.pct!=null && a.pct>=PASS);
        return p.first.at && ok && ok.at ? Math.round((ok.at - p.first.at)/60000) : null;
      });
      if(quick.length && gaps.every(g=>g!=null && g<=30))
        out.push(`${quick.length>1?`这 ${quick.length} 份都是`:'这份是'}第一遍之后 ${Math.max(1,...gaps)} 分钟内就重做到达标。分数涨得这么快，可能是真学会了，也可能是记住了上一遍的答案 —— 建议隔一天再做一遍，看第一遍能不能过。`);
      const weak = [...new Set(S.scored.filter(p=>p.first.pct<PASS).map(where).filter(Boolean))];
      if(weak.length) out.push(`第一遍没过的都在 <b>${weak.map(esc).join('、')}</b>。`);
      out.push(`第一遍每道题用了几秒、中途有没有离开页面，到「专注情况」看。`);
    }
  }
  const es = S.essays.flatMap(p=>p.tries.filter(a=>a.wl)), todo = es.filter(a=>ess(a).todo).length;
  if(es.length) out.push(`${sc?'还':''}写了 <b>${es.length} 篇作文</b>（${es.map(a=>ess(a).txt).join('、')}，满分 6，不算进达标）` +
    (todo ? `，<b style="color:var(--amber)">${todo} 篇等你批改</b>，到「作文」标签批。` : `，原文和批改到「作文」标签看。`));
  if(S.plain.length){
    const np = S.plain.length;
    out.push(`${sc?`另外 ${np} 份`:np>1?`${np} 份都`:'这份'}不打分（只记做过、看过），记 ✓。`);
  }
  return out.join('');
}

// One paper: every try that day in order, the last score on the right, and a verdict tag.
function histPaper(p){
  const b = BANK_BY_ID[p.id] || {};
  const fin = p.scored ? p.last.pct : null, many = p.tries.length > 1, le = lastEssay(p.tries);
  const tag = le ? (ess(le).todo ? `<span class="chipst st-open">作文 · 待批改</span>` : `<span class="chipst st-prac">作文 · 满分 6 · 不算达标</span>`)
    : !p.scored ? `<span class="chipst st-prac">${b.type==='practice'?'练习 · ':''}不打分</span>`
    : p.first.pct>=PASS ? `<span class="chipst st-done">第一遍就达标</span>`
    : fin>=PASS ? `<span class="chipst st-open">第一遍没过 · 重做后达标</span>`
    : `<span class="chipst st-low">还没达标</span>`;
  const meta = [p.subj, p.book, LABEL[b.type]||'', b.n ? b.n+(b.type==='quiz'?' 题':' 项') : '',
                p.before ? `这天之前做过 ${p.before} 次` : ''].filter(Boolean).map(esc).join(' · ');
  const tries = p.tries.map((a,i)=>{
    const pr = a.practice;
    const what = a.wl ? `<b style="color:${ess(a).col}">${ess(a).txt}</b> <button class="mini" data-essay="${esc(a.aid)}">${ess(a).todo?'去批改':'看作文'} ›</button>`
      : a.pct!=null
      ? `<b style="color:${pctColor(a.pct)}">${a.pct}%</b>${a.total?`（对 ${a.score}/${a.total} 题）`
          : pr && pr.items ? `（一次就对 ${pr.firstTry}/${pr.items}）` : ''}`
      : `<b style="color:var(--green)">✓</b>`;
    const name = a.wl ? `第 ${i+1} 篇` : p.scored && !p.prac ? nthTry(i) : `第 ${i+1} 轮${pr && pr.round ? ' '+esc(pr.round) : ''}`;
    return `<span class="try">${name} ${what}${a.at?` · ${hm(a.at)} 交`:''} · 用 ${dur(a.secs)}</span>`;
  }).join('<span class="arr">→</span>');
  const wq = wrongQs(p.last.wrong);
  const wrong = p.scored && fin<100 && wq.length ? `${many?'最后一遍':''}错的是第 ${wq.map(x=>x.q).join('、')} 题` : '';
  return `<div class="prow"><div class="ptop">
      <div class="nm"><b>${openLink(b.href, esc(p.t))}</b><span class="crumb">${meta}</span></div>
      <div class="pscore"><div class="sc" style="color:${le?ess(le).col:pctColor(fin)}">${le?ess(le).txt:pctText(fin)}</div>
        <div class="cap">${le?(ess(le).todo?'等你批改':many?'最后一篇':'批改'):!p.scored?'做完了':p.prac?'一次就对':many?'最后一遍':'得分'}</div></div></div>
    <div class="bar"><i style="width:${le&&le.essay!=null?Math.round(100*le.essay/6):fin==null?100:fin}%;background:${le?ess(le).col:pctColor(fin)}"></i></div>
    <div class="tries">${tries}</div>
    <div class="pfoot">${tag}${many?`<span>这天${le?'写':'做'}了 ${p.tries.length} ${le?'篇':p.scored&&!p.prac?'遍':'轮'}，一共 ${dur(p.secs)}</span>`:''}${wrong?`<span>${wrong}</span>`:''}</div>
  </div>`;
}

// What the kid reads under 「My day」 for that day — shown here so the parent sees exactly the same words.
function noteBlock(k, d){
  const s = NOTES[k+'|'+d];
  if(s===undefined) return `<div class="dnote quiet"><span class="lbl">给孩子的总结</span>正在读…</div>`;
  if(!s) return `<div class="dnote quiet"><span class="lbl">给孩子的总结</span>这天还没写。要写就在 Claude 对话里说「总结一下 ${KID[k].n} ${Number(d.slice(5,7))} 月 ${Number(d.slice(8))} 号的作业」。</div>`;
  const list = (h, xs) => xs && xs.length ? `<div class="h">${h}</div><ul>${xs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : '';
  return `<details class="dnote" open><summary><span class="lbl">给孩子的总结 · ${s.by==='mom'?'妈妈':'爸爸'}的口吻 · ${KID[k].n} 在孩子页「My day」里看到的就是这段</span>${esc(s.headline)}</summary>
    ${list('🌟 What went well', s.good)}${list('🎯 What to work on', s.work)}${list('➡️ Next time', s.next)}</details>`;
}

        <span class="d">${d.slice(5)} 周${wdOf(d)}</span><span class="s">${txt}</span></button>`;
    }

/* ===================== SKILLS (知识点) ===================== */
// 「该复习哪几条」的清单，不是分析仪表盘 (HOMEWORK-SYSTEM.md §三十五). A knowledge point only turns
// red when all three hold: 累计 ≥5 题, 正确率 <70%, 错在 ≥2 个不同日期. Two kids do a handful of pages
// a week, so 3 题错 2 题 is noise, not a weakness — under the bar it stays grey and says 数据还不够.
const SK_MIN_Q = 5, SK_MAX_PCT = 70, SK_MIN_DAYS = 2;
const SK_PLAIN_MAX = 20;   // 未标注 is a leftover bucket, not a log — only the latest papers are listed
const skName = sk => (SKILLS[sk] && SKILLS[sk].n) || sk;
const skWhere = sk => SKILLS[sk] ? `第 ${Number(SKILLS[sk].ch)} 章 · ${SKILLS[sk].chTitle}` : '知识点表里没有这个 id';

// One attempt → the questions on it that carry a knowledge point, with whether each was right.
// v2 records put sk on every qTimes entry (that's the denominator — 正确率 needs the questions the kid
// got RIGHT too, not just the misses); wrong[] carries it as well, so either one alone is enough.
// Untagged questions, and every record written before 2026-09-17, yield nothing → 未标注.
function skQs(a){
  const byQ = new Map();
  wrongQs(a.wrong).forEach(x => { if(x.sk) byQ.set(x.q, x.sk); });
  (a.qTimes||[]).forEach(t => { if(t && t.sk) byQ.set(t.q, t.sk); });
  const out = [], seen = new Set();
  (a.qTimes||[]).forEach(t => {
    if(!t || typeof t.correct !== 'boolean' || !byQ.has(t.q)) return;
    seen.add(t.q); out.push({ sk: byQ.get(t.q), q: t.q, correct: t.correct });
  });
  // A tagged miss that never made it into qTimes still counts against its knowledge point.
  wrongQs(a.wrong).forEach(x => { if(x.sk && !seen.has(x.q)) out.push({ sk: x.sk, q: x.q, correct: false }); });
  return out;
}

// One kid, every attempt: per-knowledge-point totals, plus the misses we can't place (未标注).
function skStats(k){
  const by = new Map(), plain = new Map();
  let nTagged = 0;
  ATT.filter(a => a.kid === k).forEach(a => {
    const tagged = skQs(a), href = (BANK_BY_ID[a.id]||{}).href || '';
    nTagged += tagged.length;
    tagged.forEach(x => {
      let r = by.get(x.sk);
      if(!r) by.set(x.sk, r = { sk:x.sk, n:0, ok:0, dates:new Set(), last:'', miss:[] });
      r.n++;
      if(x.correct){ r.ok++; return; }
      r.dates.add(a.date);
      if(a.date > r.last) r.last = a.date;
      r.miss.push({ date:a.date, t:a.t, href, q:x.q });
    });
    // Misses with no knowledge point: an untagged page, or a record from before tagging started.
    const placed = new Set(tagged.map(x => x.q));
    const rest = wrongQs(a.wrong).filter(x => !x.sk && !placed.has(x.q)).map(x => x.q);
    if(!rest.length) return;
    const key = a.date + '|' + a.id;
    let g = plain.get(key);
    if(!g) plain.set(key, g = { date:a.date, t:a.t, href, qs:[] });
    g.qs.push(...rest);
  });
  const rows = [...by.values()].map(r => {
    const pct = Math.round(100 * r.ok / r.n);
    return Object.assign(r, { pct, red: r.n >= SK_MIN_Q && pct < SK_MAX_PCT && r.dates.size >= SK_MIN_DAYS });
  });
  // Weakest first among the red ones; the rest by how much evidence there is so far.
  rows.sort((a,b) => (b.red-a.red) || (a.red ? a.pct-b.pct : (b.n-a.n) || a.pct-b.pct));
  return { rows, nTagged,
           plain: [...plain.values()].sort((a,b) => b.date.localeCompare(a.date)),
           red: rows.filter(r => r.red), thin: rows.filter(r => !r.red) };
}

// The misses under one knowledge point, newest first: one line per day per paper.
function skMissList(miss){
  const by = new Map();
  miss.forEach(m => {
    const key = m.date + '|' + m.t;
    let g = by.get(key);
    if(!g) by.set(key, g = { date:m.date, t:m.t, href:m.href, qs:[] });
    g.qs.push(m.q);
  });
  return [...by.values()].sort((a,b) => b.date.localeCompare(a.date)).map(g =>
    `<li><b>${esc(g.date.slice(5))} 周${wdOf(g.date)}</b> · ${openLink(g.href, esc(g.t))} · 第 ${
      [...new Set(g.qs)].sort((x,y)=>x-y).join('、')} 题</li>`).join('');
}

function skRow(r){
  const pctCol = r.red ? 'var(--red)' : 'var(--mute)';
  const tag = r.red ? `<span class="chipst st-low">该复习</span>`
                    : `<span class="chipst st-prac">数据还不够</span>`;
  // Grey is "can't tell yet", not "fine" — so say which of the three conditions isn't met.
  const unmet = [];
  if(r.n < SK_MIN_Q) unmet.push(`还差 ${SK_MIN_Q - r.n} 题才够 ${SK_MIN_Q} 题`);
  if(r.pct >= SK_MAX_PCT) unmet.push(`正确率 ${r.pct}%，没低于 ${SK_MAX_PCT}%`);
  if(r.dates.size < SK_MIN_DAYS) unmet.push(r.dates.size ? '只错在 1 天' : '一题没错');
  const note = r.red ? '' : `<div class="sknot">还看不出是不是弱点：${unmet.join(' · ')}</div>`;
  const met = (v, name, col) => `<div><b style="color:${col||'var(--cream)'}">${v}</b>${name}</div>`;
  return `<div class="skrow${r.red?' red':' thin'}">
    <div class="sktop"><span class="nm">${esc(skName(r.sk))}</span>${tag}
      <span class="crumb">${esc(skWhere(r.sk))}</span><span class="skid">${esc(r.sk)}</span></div>
    <div class="skmet">
      ${met(r.n + ' 题', '做过')}
      ${met(r.pct + '%', '正确率', pctCol)}
      ${met((r.n - r.ok) + ' 题', '错的')}
      ${met(r.last ? r.last.slice(5) : '—', '最近错在', r.last?'var(--cream)':'var(--mute)')}
      ${met(r.dates.size + ' 天', '错在几天')}
    </div>${note}
    ${r.miss.length ? `<details class="skwrong"><summary>看是哪几题（${r.miss.length}）</summary>
      <ul>${skMissList(r.miss)}</ul></details>` : ''}
  </div>`;
}

function viewSkills(){
  let html = `<h2 class="sec">知识点 · 该复习哪几条${qm(`把两个孩子的错题按<b>知识点</b>聚到一起 —— 同一条在不同卷子、不同日子上反复错，才算弱点。
      这是一份复习清单，不是仪表盘。`)}</h2>
    <details class="hguide" data-guide="skills"${guideOpen('skills')}><summary><b>这一页怎么看</b><span class="tap">点开</span></summary><ul>
      <li><b>亮红</b>要三个条件<b>同时</b>满足：这条知识点累计做过 <b>≥ ${SK_MIN_Q} 题</b>、正确率 <b>&lt; ${SK_MAX_PCT}%</b>、
        而且错在 <b>≥ ${SK_MIN_DAYS} 个不同日期</b>。三条缺一条就还是灰的。</li>
      <li>灰色的「数据还不够」<b>不等于没问题</b>，是<b>还看不出来</b>。两个孩子一周就做几页题，
        一条知识点 3 题里错 2 题是随机波动，不是弱点 —— 别照着它调作业。</li>
      <li>错了之后<b>默认回书上那一课重做原题</b>（哪一课在每条后面写着）。只有程序性的知识点
        （互化、化简、加减、四舍五入这些）连错两次，才值得出换数字的变式。</li>
      <li><b>未标注</b> = 那份卷子还没打知识点标签，或者是打标之前做的。这些错题只按卷子列出来，
        <b>不进上面的统计</b>。存量的 152 页不回补标签，所以这一块会一直有东西。</li>
      <li>点知识点里的「看是哪几题」能展开原题的日期和卷子；点卷子名在新标签页打开（家长预览，不记成绩）。</li>
    </ul></details><div class="grid2">`;

  ['grace','warren'].forEach(k=>{
    const S = skStats(k);
    html += kidCard('skills', k,
      S.nTagged ? `打过标签的 ${S.nTagged} 题 · ${S.rows.length} 条知识点` : '还没有打过标签的题',
      !S.rows.length ? '还没有打过标签的卷子进这张表'
        : S.red.length ? `<b style="color:var(--red)">该复习 ${S.red.length} 条</b> · ${S.red.map(r=>esc(skName(r.sk))).join('、')}`
        : `没有该复习的 · ${S.thin.length} 条都还没到亮红的门槛`);
    if(!S.rows.length){
      html += `<div class="dsum"><span class="lbl">还没数据</span>
        知识点标签是 2026-09-17 才开始打的，只有打了标签的卷子进这张表。
        ${KID[k].n} 做过打标的卷子之后，这里才会有东西。</div>`;
    } else {
      html += `<div class="dsum"><span class="lbl">一句话</span>${
        S.red.length ? `有 <b>${S.red.length}</b> 条该复习：${S.red.map(r=>esc(skName(r.sk))).join('、')}。`
                     : `<b>没有</b>该复习的知识点 —— ${S.thin.length} 条都还没到亮红的门槛（数据还不够，不是没问题）。`
      }</div>`;
      if(S.red.length){
        html += `<div class="subhd">该复习 · ${S.red.length} 条</div>${S.red.map(skRow).join('')}`;
      }
      if(S.thin.length){
        html += `<div class="subhd">数据还不够 · ${S.thin.length} 条</div>${S.thin.map(skRow).join('')}`;
      }
    }
    if(S.plain.length){
      // 存量那 152 页都不打标，所以这一段会一直长 —— 只列最近的，更早的去「完成记录」一天一天翻。
      const nq = S.plain.reduce((n,g)=>n+g.qs.length, 0), shown = S.plain.slice(0, SK_PLAIN_MAX);
      const more = S.plain.length - shown.length;
      html += `<div class="subhd">未标注 · ${nq} 题（不进上面的统计）</div>
        <div class="skrow thin"><div class="sknot">这些卷子还没打知识点标签，或者是打标之前做的，只能按卷子列。</div>
        <ul class="skwrong" style="padding-left:16px;margin-top:6px">${shown.map(g=>
          `<li><b>${esc(g.date.slice(5))} 周${wdOf(g.date)}</b> · ${openLink(g.href, esc(g.t))} · 第 ${
            [...new Set(g.qs)].sort((x,y)=>x-y).join('、')} 题</li>`).join('')}</ul>
        ${more ? `<div class="sknot">只列了最近 ${SK_PLAIN_MAX} 份，更早的还有 ${more} 份 —— 去「完成记录」一天一天翻。</div>` : ''}</div>`;
    }
    html += `</details>`;
  });
  return html + `</div>`;
}

/* ===================== FOCUS (专注情况) ===================== */
// A web page sees the page leave the foreground (another app, another tab, screen locked),
// never which app. HOMEWORK-SYSTEM.md §五.
let FR = 1;   // days shown — 今天 first (Sam 2026-09-19); 7 / 21 are options
const FOCUS = {
  awayCount: 3,     // flag a paper that left the page this many times
  awayShare: 0.2,   // … or spent this share of its time off the page
  longAway: 60,     // … or had one absence this long (s)
  slowMin: 60,      // a question is "slow" at ≥ this many seconds on the page
  slowX: 3,         // … and ≥ this many times the paper's median
  guessSecs: 3,     // a wrong answer faster than this looks like a guess
  attnSlow: 3,      // "需要留意" only for ≥ this many slow questions (one slow question is normal)
  attnGuess: 2      // … or ≥ this many fast wrong answers; any page-leaving flag always counts
};
// The one duration style for the whole console: always Chinese units, never a colon —
// "1:59" meant 1 min 59 s but read like 1 h 59 min. Clock times (19:02–20:14) keep the colon.
//   < 1 min → 不到 1 分钟 · < 1 h → 25 分钟 · ≥ 1 h → 1 小时 3 分钟. Never seconds (Sam, 2026-09-13)
const dur = s => {
  s = Math.max(0, Math.round(s||0));
  if(s < 60) return '不到 1 分钟';
  const m = Math.round(s/60);
  return m < 60 ? m+' 分钟' : Math.floor(m/60)+' 小时'+(m%60 ? ' '+(m%60)+' 分钟' : '');
};

function readFocus(a){
  const f = a.focus || {};
  const secs = a.secs || 0, awaySecs = f.awaySecs || 0;
  const active = a.activeSecs!=null ? a.activeSecs : Math.max(0, secs-awaySecs);
  const qs = a.qTimes.map(q=>({ q:q.q, active:Math.max(0,(q.secs||0)-(q.awaySecs||0)),
                                away:q.awaySecs||0, correct:q.correct }));
  const sorted = qs.map(q=>q.active).sort((x,y)=>x-y);
  const med = sorted.length ? sorted[Math.floor(sorted.length/2)] : 0;
  const slowAt = Math.max(FOCUS.slowMin, FOCUS.slowX*med);
  qs.forEach(q=>{ q.slow = q.active>=slowAt; q.guess = q.correct===false && q.active<FOCUS.guessSecs; });
  const flags = [];
  if((f.awayCount||0) >= FOCUS.awayCount) flags.push(`离开页面 ${f.awayCount} 次`);
  if(secs && awaySecs/secs >= FOCUS.awayShare) flags.push(`${Math.round(100*awaySecs/secs)}% 时间不在页面`);
  if((f.maxAwaySecs||0) >= FOCUS.longAway) flags.push(`最长一次离开 ${dur(f.maxAwaySecs)}`);
  const awayFlagged = flags.length > 0;
  const nSlow = qs.filter(q=>q.slow).length, nGuess = qs.filter(q=>q.guess).length;
  if(nSlow) flags.push(`${nSlow} 道慢题`);
  if(nGuess) flags.push(`${nGuess} 道答得很快又答错`);
  const attention = awayFlagged || nSlow >= FOCUS.attnSlow || nGuess >= FOCUS.attnGuess;
  return { secs, active, awaySecs, awayCount:f.awayCount||0, maxAway:f.maxAwaySecs||0, qs, med, flags, attention };
}

  let html = `<h2 class="sec">专注情况${qm(`<p>做题时页面在不在前台、一共用了多久、每道题停留多久。</p><p>

      <li><b>需要留意</b>只列满足任一条的卷子：离开 ≥ ${FOCUS.awayCount} 次；离开的时间占 ≥ ${Math.round(FOCUS.awayShare*100)}%；有一次离开 ≥ ${dur(FOCUS.longAway)}；
        ≥ ${FOCUS.attnSlow} 道慢题；≥ ${FOCUS.attnGuess} 道答得很快又答错。</li>
      <li><b>慢题</b> = 这道题在页面上停了 ≥ ${dur(FOCUS.slowMin)}，而且是这份卷子一般题目（中位数）的 ${FOCUS.slowX} 倍以上。
        <b>答得很快又答错</b> = 不到 ${FOCUS.guessSecs} 秒就选了、选错了，可能是蒙的。</li>
      <li>按交卷那天算。上面的「今天 / 近 7 天 / 近 21 天」换统计的天数。</li>

    <div class="grid2">`;

  ['grace','warren'].forEach(k=>{
    const mine = ATT.filter(a=>a.kid===k && a.date>=sinceIso).map(a=>Object.assign({ f:readFocus(a) }, a));
    const T = mine.reduce((s,a)=>({ secs:s.secs+a.f.secs, active:s.active+a.f.active, away:s.away+a.f.awaySecs,
                                    n:s.n+a.f.awayCount, max:Math.max(s.max,a.f.maxAway) }),
                          { secs:0, active:0, away:0, n:0, max:0 });
    const share = T.secs ? Math.round(100*T.active/T.secs) : null;
    const shareCol = share==null ? 'var(--mute)' : share>=90 ? 'var(--green)' : share>=75 ? 'var(--amber)' : 'var(--red)';
    html += kidCard('focus', k, `交卷 ${mine.length} 次`,
      mine.length ? `学习时长 <b>${dur(T.secs)}</b> · 在页面上 <b style="color:${shareCol}">${
          share==null?'—':share+'%'}</b> · 离开 ${T.n} 次`
        : '这段时间没有做题记录') + `

        <div><div class="v" style="color:${shareCol}">${share==null?'—':share+'%'}</div><div class="k">在页面上${qm(share==null?'这段时间没有记录':`页面在前台 ${dur(T.active)}，占学习时长的比例`)}</div></div>

      </div>`;
    if(!mine.length){ html += `<p class="empty">这段时间没有做题记录。</p></details>`; return; }

    html += `<div class="stack"><i class="on" style="width:${share}%"></i><i class="off" style="width:${100-share}%"></i></div>
      <div class="stacklbl">在页面上 ${dur(T.active)} · 不在页面 ${dur(T.away)}</div>`;

    const flagged = mine.filter(a=>a.f.attention);
    html += `<div class="subhd">需要留意 · ${flagged.length} 份${qm('满足「这些数字怎么读」里「需要留意」任一条的卷子。标签写的是它为什么被列进来；这是参考，不是判决。')}</div>`;
    html += flagged.length ? flagged.map(a=>`<div class="flagrow"><span class="when">${a.date.slice(5)}</span>

    html += `<div class="subhd">每份用时 · 每题停留${qm('右边大数字 = 这份从打开到交卷的时间。下面一排小条，一根是一道题，越高停得越久；颜色的意思在页面最下面。')}</div>`;
    mine.forEach(a=>{
      const f = a.f, maxQ = Math.max(1, ...f.qs.map(q=>q.active));
      const slowest = f.qs.reduce((m,q)=>!m||q.active>m.active?q:m, null);
      html += `<div class="frow"><div class="ftop"><span class="when">${a.date.slice(5)}</span>
          <span class="nm">${esc(a.t)}</span><span class="fnum">${dur(f.secs)}</span></div>
        <div class="fmeta">在页面上 ${dur(f.active)} · 离开 ${f.awayCount} 次${f.awaySecs?`（共 ${dur(f.awaySecs)}）`:''}${
          f.qs.length?` · 最慢第 ${slowest.q} 题 ${dur(slowest.active)}`:''}</div>
        ${f.qs.length ? `<div class="qstrip">${f.qs.map(q=>`<i class="${q.slow?'slow':q.guess?'guess':q.correct===false?'miss':''}${q.away?' away':''}"
            style="height:${Math.max(8,Math.round(100*q.active/maxQ))}%"
            title="第 ${q.q} 题 · ${dur(q.active)}${q.away?' · 中途离开 '+dur(q.away):''}${q.correct===false?' · 答错':''}"></i>`).join('')}</div>`
          : `<div class="fmeta" style="opacity:.7">练习 / 参考类，没有逐题记录</div>`}
      </div>`;
    });
    html += `</details>`;
  });

  return html + `</div>
    <div class="legend">每题小条：高度 = 这道题在页面上停留的时间（鼠标停在条上看这题用了多久）
      <br><i style="background:var(--blue)"></i>正常 <i style="background:#e59b98"></i>答错
      <i style="background:var(--red)"></i>慢题（≥ ${dur(FOCUS.slowMin)}且 ≥ 本卷中位数 ${FOCUS.slowX} 倍）
      <i style="background:var(--amber)"></i>答得很快又答错（可能是蒙的）
      · 条上方有小白点 = 做这题时离开过页面</div>`;
}

/* ===================== READING CLUB (阅读写作) ===================== */
// The data lives in Reading Club (英文阅读写作助手: Vercel + Supabase); this tab only reads its
// /api/parent-feed. That endpoint reads the database and nothing else — no grading, no cost.
// Auth is this page's Firebase Google sign-in: the server checks the signature, the parent email,
// and that the same email is a guardian over there. See HOMEWORK-SYSTEM.md §十.
// Wording follows Reading Club's own parent page: 「离开 N 次」, never 「走神」; no focus %; these
// numbers stay out of 专注情况's 需要留意 list (an iPad lock screen counts as leaving).
const READING = 'https://reading-app-delta-seven.vercel.app';
let RD = { days:1, data:null, err:'', loading:false, want:0, open:{} };   // open: day rows the parent unfolded / folded
const WD = ['日','一','二','三','四','五','六'];
const wdOf = ymd => WD[new Date(ymd+'T12:00:00').getDay()];
// Minutes are rounded on the server; a 20-second visit arrives as 0, which reads like "never there".
const mins = m => m ? dur(m*60) : '不到 1 分钟';

async function loadReading(){
  const user = auth.currentUser;
  if(!user) return;
  const want = RD.days;
  RD.want = want; RD.loading = true; RD.err = '';
  let data = null, err = '';
  try {
    const token = await user.getIdToken();
    const res = await fetch(`${READING}/api/parent-feed?days=${want}`,
                            { headers:{ Authorization:'Bearer '+token }, cache:'no-store' });
    const body = await res.json().catch(()=>null);
    if(res.ok && body && body.ok) data = body;
    // Mom's PIN login is let in only once Reading Club lists her uid; until then say so plainly.
    else if((res.status===401 || res.status===403) && user.email === MOM_EMAIL)
      err = 'Reading Club 那边还没开通妈妈的账号，暂时看不到阅读写作。其他标签都能正常用。';
    else err = res.status===401 || res.status===403
      ? `Reading Club 不认这个账号（${body&&body.why || res.status}）。`
      : `Reading Club 返回错误：${body&&body.why || 'HTTP '+res.status}`;
  } catch(e){
    // A missing route comes back without CORS headers, so it lands here too, not as a 404.
    err = `连不上 Reading Club（接口还没部署，或者网络断了）：${e.message||e}。其他标签不受影响。`;
  }
  if(RD.want !== want) return;   // the parent switched range while this was in flight
  RD.data = data; RD.err = err; RD.loading = false;
  if(V==='reading') render();
}

// Layout agreed from homework-system/reading-tab-mockup.html (2026-09-13): kids stacked, one summary row
// each, one aligned row per day, the per-page / timer detail folded into a click-to-open row.
const TASK_SHORT = { words:'词', check:'测', write:'写' };
// Under 80% right is marked amber — a nudge to look, not an alert; it stays out of 需要留意 like the rest.
const frac = (c,t) => `<span class="num ${c/t>=0.8?'ok':'low'}">${c}/${t}</span> 题`;
const mmdd = ymd => ymd.slice(5).replace('-','/');

function viewReading(){
  let html = `<div class="rc"><div class="sechead">
      <h2>阅读写作 · Reading Club</h2>
      <span class="muted range">${RD.data?`${mmdd(RD.data.from)} – ${mmdd(RD.data.to)}`:''}</span>
      <div class="chips">${[[1,'今天'],[7,'近 7 天'],[21,'近 21 天']].map(([v,l])=>
        `<button class="fchip${RD.days===v?' on':''}" data-rd="${v}">${l}</button>`).join('')}</div>
    </div>
    <details class="note"><summary>ⓘ 这些数字怎么读</summary>
      <p><b>在页</b> = 页面在前台的时间，不等于在读；<b>离开</b> = 页面不在前台了几次（锁屏、屏幕变暗、被叫走都算），不是走神几次。
      这里不算专注度百分比，也不进「专注情况」的需要留意。
      阅读是在纸上读的：每天只算<b>词 / 测验 / 写</b>三件事，也不报阅读页的时长。<b>计时</b>从打开那一页算起、中途不暂停，页面忘了关会显示得很长。
      数字的单位：<b>在页时长</b>、<b>计时</b>是时和分；<b>离开</b>是次数（各页停留里的「离开 2 次」= 在那一页上离开了 2 次）；
      <b>测验 / 单词</b>「7/7 题」= 答对几题 / 一共几题，不到 80% 标黄；「做 2 遍」= 那天这份测验做了 2 遍，显示最好的一遍；
      <b>写作</b>按英文词数算；<b>粘贴</b>按字符数算（一个字母算一个）；时段跨过半夜写「次日」。作文原文和批改在 <a href="${READING}/family" target="_blank" rel="noopener">Reading Club 家长页</a>看。</p>
    </details>`;

  if(RD.err) return html + `<p class="empty" style="color:var(--red)">${esc(RD.err)}</p>
    <p style="text-align:center"><button class="btn" data-rdretry>重试</button></p></div>`;
  const F = RD.data;
  if(!F) return html + `<p class="empty">正在从 Reading Club 取数据…</p></div>`;
  if(!F.kids.length) return html + `<p class="empty">Reading Club 里这个账号名下没有孩子。</p></div>`;
  return html + F.kids.map(kid=>readingKid(kid, F)).join('') + `</div>`;
}

function readingKid(kid, F){
  const key = Object.keys(KID).find(k=>KID[k].n.toLowerCase()===String(kid.name).toLowerCase());
  const days = kid.days, tracked = days.filter(d=>d.tracked);
  const sum = f => days.reduce((s,d)=>s+(f(d)||0),0);
  const full = days.filter(d=>d.tasks.every(t=>t.done)).length;
  const opened = days.filter(d=>d.time || d.tasks.some(t=>t.done)).length;
  const qc = sum(d=>d.quiz&&d.quiz.correct), qt = sum(d=>d.quiz&&d.quiz.total);
  const wc = sum(d=>d.words&&d.words.correct), wt = sum(d=>d.words&&d.words.total);
  const essays = days.filter(d=>d.writing).length, words = sum(d=>d.writing&&d.writing.words);
  const paste = F.showPaste ? sum(d=>d.pasteChars) : null;
  const unit = [...days].reverse().find(d=>d.unitNo);
  // Reading Club: a kid can read one book while another is paused (their docs/22). Unit numbers restart at 1
  // in every book, so once two books show up in this range each 章 cell says which book it belongs to.
  // Older feeds have no reading / paused / book fields — everything below falls back to the old look.
  const reading = kid.reading || null, paused = kid.paused || [];
  const multiBook = new Set(days.filter(d=>d.book).map(d=>d.book.title)).size > 1;
  const unitOf = d => (d.book && (multiBook || (reading && d.book.title!==reading.title)) ? `${esc(d.book.short)} ` : '') + `第 ${d.unitNo} 章`;

  let h = `<section class="rkid">
    <div class="rhead"><span class="av">${key?KID[key].av:'🧒'}</span><div><h3>${esc(kid.name)}</h3>
      <div class="sub">${reading?`在读《${esc(reading.title)}》· `:''}${unit?`最近在做 ${unit.book&&reading&&unit.book.title===reading.title?`第 ${unit.unitNo} 章`:unitOf(unit)}`:RD.days===1?'今天没有打卡':'这段时间没有打卡'}${
        paused.length?` · 暂停 ${paused.length} 本${qm(paused.map(p=>`<p>《${esc(p.title)}》做到第 ${p.unitNo} 章 / 共 ${p.totalUnits} 章，回来接着做</p>`).join(''))}`:''}</div></div>
      <a class="link" href="${READING}/family" target="_blank" rel="noopener">作文和批改 → Reading Club</a></div>
    <div class="kpis">
      <div class="kpi"><div class="v"><span style="white-space:nowrap">${full}<small>/ ${days.length} 天</small></span><small>· 打开 ${opened} 天</small></div><div class="k">三件全做完</div></div>
      <div class="kpi"><div class="v">${tracked.length?dur(sum(d=>d.time&&d.time.activeMin)*60):'—'}</div><div class="k">在页时长</div></div>
      <div class="kpi"><div class="v">${tracked.length?sum(d=>d.time&&d.time.blurCount):'—'}<small>次</small></div><div class="k">离开</div></div>
      <div class="kpi"><div class="v">${qt?`${qc}<small>/ ${qt} 题</small>`:'—'}</div><div class="k">测验答对</div></div>
      <div class="kpi"><div class="v">${wt?`${wc}<small>/ ${wt} 题</small>`:'—'}</div><div class="k">单词答对</div></div>
      <div class="kpi"><div class="v">${essays?`${words}<small>词 · ${essays} 篇</small>`:'—'}</div><div class="k">写作</div></div>
      ${paste==null?'':`<div class="kpi"><div class="v ${paste?'amber':''}">${paste}<small>字符</small></div><div class="k">粘贴</div></div>`}
    </div>
    <div class="swipe">← 表格左右滑动看全部列 →</div>
    <div class="tablewrap"><table><thead><tr>
      <th>日期</th><th>章</th><th>三件事</th><th class="r">在页时长</th><th class="r">离开次数</th>
      <th class="r">测验</th><th class="r">单词</th><th class="r">写作</th>${F.showPaste?'<th class="r">粘贴</th>':''}<th></th>
    </tr></thead><tbody>`;

  // By default only the most recent day with a visit is unfolded; a parent's own clicks win after that.
  const firstActive = [...days].reverse().find(d=>d.time);
  [...days].reverse().forEach(d=>{
    const did = d.time || d.tasks.some(t=>t.done) || d.quiz || d.words || d.writing;
    const id = `${kid.name}-${d.day}`;
    const hasDetail = d.time || (d.timers && d.timers.length);
    // On a phone every day starts folded: the day cards are already two lines each.
    const open = hasDetail && (id in RD.open ? RD.open[id] : d === firstActive && !PHONE.matches);
    // Class hooks for the phone card layout only (the computer table ignores them):
    // st = a number with its name in data-l, nil = nothing that day (hidden on a phone), plain = 没打开 / 还没有记录.
    const st = (l, has) => `class="r st${has?'':' nil'}" data-l="${l}"`;
    h += `<tr class="day${did?'':' quiet'}${open?' open':''}" data-id="${esc(id)}">
      <td class="date"><b>${mmdd(d.day)}</b><span>周${wdOf(d.day)}</span></td>
      <td${d.unitNo?'':' class="nil"'}>${d.unitNo?`<span class="unit"${d.book?` title="${esc(d.book.title)}"`:''}>${unitOf(d)}</span>`:'<span class="muted">—</span>'}</td>
      <td><span class="dots">${d.tasks.map(t=>`<span class="dot${t.done?' on':''}" title="${esc(t.zh)}">${TASK_SHORT[t.task]||esc(t.zh)}</span>`).join('')}</span></td>
      <td ${!d.tracked||(!d.time&&!did)?'class="r st plain" data-l="在页"':st('在页', d.time).replace('st', 'st act')}>${!d.tracked?'<span class="muted">还没有记录</span>':d.time?mins(d.time.activeMin):(did?'—':'没打开')}</td>
      <td ${st('离开', d.time)}>${d.time?`${d.time.blurCount} 次`:'—'}</td>
      <td ${st('测验', d.quiz)}>${d.quiz?frac(d.quiz.correct,d.quiz.total)+(d.quiz.tries>1?` <span class="muted" title="这天这份测验做了 ${d.quiz.tries} 遍，显示最好的一遍">· 做 ${d.quiz.tries} 遍</span>`:''):'—'}</td>
      <td ${st('单词', d.words)}>${d.words?frac(d.words.correct,d.words.total):'—'}</td>
      <td ${st('写作', d.writing)}>${d.writing?`${d.writing.words} 词`:'—'}</td>
      ${F.showPaste?`<td ${st('粘贴', d.pasteChars)}>${d.pasteChars?`<span class="amber">${d.pasteChars} 字符</span>`:'—'}</td>`:''}
      <td class="r cr">${hasDetail?'<span class="caret">▶</span>':''}</td></tr>`;
    if(hasDetail) h += readingDetail(d, id, open, F);
  });
  return h + `</tbody></table></div></section>`;
}

function readingDetail(d, id, open, F){
  const cols = F.showPaste ? 10 : 9;
  const pmax = Math.max(1, ...d.pages.map(p=>p.activeMin));
  const pages = d.pages.length ? d.pages.map(p=>`<div class="brow"><span class="lbl">${esc(p.zh)}</span>
      <span class="rbar"><i style="width:${Math.max(3,Math.round(100*p.activeMin/pmax))}%"></i></span>
      <span class="val">${mins(p.activeMin)}${p.blurCount?` <span class="muted">· 离开 ${p.blurCount} 次</span>`:''}</span></div>`).join('')
    : '<div class="muted" style="font-size:12.5px">没有各页记录</div>';

  // null = that day predates the timer feature (timerSince), which is not the same as "no timer that day".
  const timers = d.timers || [];
  // Every bar is scaled to twice the planned time; anything longer is capped and fades out.
  const tim = d.timers==null ? `<div class="muted" style="font-size:12.5px">这天还没有计时功能（${F.timerSince} 起）</div>`
    : timers.length ? timers.map(x=>{
      if(!x.on) return `<div class="brow"><span class="lbl">${esc(x.zh)}</span><span class="muted" style="font-size:12px">没记到钟</span><span></span></div>`;
      const cap = x.plannedMin*2, w = cap ? Math.min(100, Math.round(100*x.usedMin/cap)) : 100, over = x.usedMin > cap;
      return `<div class="brow"><span class="lbl">${esc(x.zh)}</span>
        <span class="rbar"><i class="${over?'over':''}" style="width:${Math.max(3,w)}%"></i><b style="left:50%"></b></span>
        <span class="val">${dur(x.usedMin*60)} <span class="muted">/ 定了 ${mins(x.plannedMin)}</span></span></div>`;
    }).join('') : '<div class="muted" style="font-size:12.5px">这天没有计时</div>';

  return `<tr class="detail" data-for="${esc(id)}"${open?'':' hidden'}><td colspan="${cols}"><div class="dgrid">
      <div><div class="dh">各页停留${d.time?` <b>时段 ${d.time.from}–${d.time.to<d.time.from?'次日 ':''}${d.time.to}</b>`:''}</div>${pages}
        ${d.time&&d.time.blurMin?`<div class="hint">离开一共 ${mins(d.time.blurMin)}</div>`:''}
        ${d.writing&&d.writing.typedMin!=null?`<div class="hint">作文打字 ${mins(d.writing.typedMin)}</div>`:''}</div>
      <div><div class="dh">计时 · 用了多久 / 定了多久</div>${tim}
        <div class="hint">白线 = 定的时间。条画到定的 2 倍为止，更长的会淡出 —— 多半是页面开着没关。</div></div>
    </div></td></tr>`;
}

// Writing Lab pieces (writings/{attempt ID}). The kid hands one in; Dad or Mom marks it here and sends it back
// (HOMEWORK-SYSTEM.md 2026-09-18 手动批改). Marking in progress — and Claude's first draft of it — is kept in
// reviewDrafts/{ID}, which kids can't read, so the kid only ever sees what a parent sent.
// A note is { s, e, quote, kind, fix, note } on characters s..e of the text (JS/writing-review.js draws them).
const WR_MAX = 60;
let WR = { list:null, drafts:{}, err:'', loading:false, kid:'all', cur:'', editing:false, diff:false, setup:false,
           ed:null, sel:null, aiBusy:false };
// by 'claude': marked from the chat window on Sam's Mac (homework-system/writing-review.mjs), no API key.
const WHO_ZH = { dad:'爸爸', mom:'妈妈', claude:'Claude' };
const WR_KIND = { fix:'要改', good:'写得好', note:'批注' };
const meAs = () => auth.currentUser && auth.currentUser.email === MOM_EMAIL ? 'mom' : 'dad';
const wrCur = () => (WR.list || []).find(w=>w.id===WR.cur);

async function loadWritings(){
  WR.loading = true; WR.err = '';
  try {
    const [snap, dr] = await Promise.all([db.collection('writings').orderBy('submittedAt','desc').limit(WR_MAX).get(),
                                          db.collection('reviewDrafts').get()]);   // a handful at most: parent-only drafts
    WR.drafts = Object.fromEntries(dr.docs.map(d=>[d.id, d.data()]));
    WR.list = snap.docs.map(d=>{ const w = d.data();
      return Object.assign({}, w, { id:d.id, kid:kidOf(w.kidId), at:tsDate(w.submittedAt) }); }).filter(w=>w.kid);
  } catch(e){ console.error(e); WR.err = '读作文失败：' + (e.code||e.message); }
  WR.loading = false;
  if(V==='essay') render();
}

// From 完成记录 / 今日作业: straight to that piece. One newer than what was read → read again.

// The marking being edited: the saved draft if there is one, else what was sent, else empty.
async function openEditor(w){
  WR.ed = { id:w.id, notes:[], summary:'', score:null, saved:'', loading:true, dirty:false };
  const ed = WR.ed;
  try {
    const d = await db.doc('reviewDrafts/'+w.id).get();
    const src = d.exists ? d.data() : (w.review || {});
    Object.assign(ed, { notes: WritingReview.ordered(src.notes||[]), summary: src.summary||'',
      score: typeof src.score==='number' ? src.score : null,
      saved: d.exists ? `接着上次的草稿（${WHO_ZH[src.by]||''}${src.updatedAt ? ' · '+stamp(tsDate(src.updatedAt)) : ''}）`
           : w.review ? '在已经发出的批改上修改，改完要再点一次「发给」' : '' });
  } catch(e){ ed.saved = '读草稿失败：' + (e.code||e.message); }
  ed.loading = false;
  if(V==='essay' && WR.ed===ed) render();
}

let wrTimer = 0;
function wrSaved(t){ if(WR.ed) WR.ed.saved = t; const el = document.getElementById('wrsaved'); if(el) el.textContent = t; }
function wrSave(){ if(!WR.ed) return; WR.ed.dirty = true; wrSaved('正在存草稿…'); clearTimeout(wrTimer); wrTimer = setTimeout(wrFlush, 1000); }
async function wrFlush(){
  clearTimeout(wrTimer);
  const ed = WR.ed;
  if(!ed || !ed.dirty) return;
  ed.dirty = false;
  try {
    await db.doc('reviewDrafts/'+ed.id).set({ notes:ed.notes, summary:ed.summary, score:ed.score, by:meAs(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    if(WR.ed===ed) wrSaved('草稿已存 ' + hm(new Date()));
  } catch(e){ ed.dirty = true; if(WR.ed===ed) wrSaved('草稿没存上：' + (e.code||e.message) + '，稍后会再试'); }
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) wrFlush(); });

function addNote(sel){
  const w = wrCur(), ed = WR.ed;
  if(!w || !ed || !sel) return;
  const n = { s:sel.s, e:sel.e, quote:w.text.slice(sel.s, sel.e), kind:'fix', fix:'', note:'' };
  ed.notes = WritingReview.ordered(ed.notes.concat([n]));
  getSelection().removeAllRanges(); WR.sel = null; wrAdd.hidden = true;
  wrSave(); render();
  const el = document.getElementById('wn-'+ed.notes.indexOf(n));
  if(el){ el.scrollIntoView({ block:'center' }); const f = el.querySelector('input,textarea'); if(f) f.focus({ preventScroll:true }); }
}

// "＋ 批注" floats under whatever is selected in the text. It lives outside #view so render() leaves it alone.
const wrAdd = document.createElement('button');
wrAdd.className = 'wradd'; wrAdd.textContent = '＋ 批注'; wrAdd.hidden = true;
document.body.appendChild(wrAdd);
wrAdd.addEventListener('mousedown', e=>e.preventDefault());   // keep the selection
wrAdd.addEventListener('click', ()=>addNote(WR.sel));
// Offset in the text: everything before the point, minus the note numbers (<sup>) drawn into it.
function wrOffset(root, node, off){
  const r = document.createRange(); r.selectNodeContents(root); r.setEnd(node, off);
  const f = r.cloneContents(); f.querySelectorAll('sup').forEach(x=>x.remove());
  return f.textContent.length;
}
function wrSelCheck(){
  const root = document.getElementById('wrtext'), sel = getSelection(), w = wrCur();
  WR.sel = null; wrAdd.hidden = true;
  if(V!=='essay' || !root || !w || !sel.rangeCount || sel.isCollapsed) return;
  const r = sel.getRangeAt(0);
  if(!root.contains(r.startContainer) || !root.contains(r.endContainer)) return;
  let s = wrOffset(root, r.startContainer, r.startOffset), e = wrOffset(root, r.endContainer, r.endOffset);
  while(s < e && /\s/.test(w.text[s])) s++;
  while(e > s && /\s/.test(w.text[e-1])) e--;
  if(e <= s) return;
  WR.sel = { s, e };
  const b = r.getBoundingClientRect();
  wrAdd.style.left = Math.max(8, Math.min(innerWidth - 100, b.left + b.width/2 - 45)) + 'px';
  wrAdd.style.top = Math.max(8, Math.min(innerHeight - 50, b.bottom + 10)) + 'px';
  wrAdd.hidden = false;
}
let wrSelT = 0;
const wrSelSoon = ()=>{ clearTimeout(wrSelT); wrSelT = setTimeout(wrSelCheck, 120); };
document.addEventListener('selectionchange', wrSelSoon);
window.addEventListener('scroll', ()=>{ if(!wrAdd.hidden) wrSelSoon(); }, { passive:true });

async function aiDraft(){

  const prev = w.prevId && (WR.list||[]).find(x=>x.id===w.prevId);
  const user = [
    'PROMPT TYPE: ' + (w.promptKind==='story' ? 'SSAT creative story starter — the student continues the opening line' : 'ISEE personal / expository topic'),
    'PROMPT: ' + w.prompt, '',
    'CONDITIONS: ' + ((w.draftNo||1) > 1 ? `draft ${w.draftNo}, rewritten after marking` : `written in ${Math.round((w.secs||0)/60)} minutes (the test allows 30)`) +
      `, ${w.words||0} words` + (w.pasted > 20 ? `, ${w.pasted} characters were pasted in rather than typed` : '') + '.',
    ...(prev && prev.review ? ['', 'WHAT WAS MARKED ON THE DRAFT BEFORE:',
      ...WritingReview.ordered(prev.review.notes).map(n=>`- [${n.kind}] "${n.quote}"${n.fix?' -> '+n.fix:''}${n.note?' ('+n.note+')':''}`)] : []),
    '', 'THE STUDENT\'S WRITING (verbatim, between the markers):', '<<<WRITING', w.text, 'WRITING>>>'
  ].join('\n');
  WR.aiBusy = true; render();
  try {
    const fb = await KidsAI.askJSON({ system: WR_AI_SYS, user, maxTokens: 4000 });
    const from = {}, notes = [];
    (Array.isArray(fb.notes) ? fb.notes : []).forEach(n=>{
      if(!n || !n.quote) return;
      const q = String(n.quote), at = WritingReview.locate(w.text, q, from[q] || 0);
      if(at) from[q] = at[1];
      const kind = ['fix','good','note'].includes(n.kind) ? n.kind : 'note';
      notes.push({ s: at ? at[0] : -1, e: at ? at[1] : -1, quote: at ? w.text.slice(at[0], at[1]) : q,
                   kind, fix: kind==='fix' ? String(n.fix||'') : '', note: String(n.note||'') });
    });
    const next = Array.isArray(fb.next_time) ? fb.next_time.filter(Boolean) : [];
    Object.assign(ed, { notes: WritingReview.ordered(notes),
      summary: [String(fb.summary||'').trim(), ...(next.length ? ['', 'Next time:', ...next.map(x=>'• '+x)] : [])].join('\n').trim(),
      score: Math.min(6, Math.max(1, Math.round(Number(fb.score)))) || null });
    wrSave();
    toast('Claude 的草稿好了：删改之后再发');
  } catch(e){ toast(e.message || String(e), true); }
  WR.aiBusy = false;
  if(V==='essay') render();
}

async function wrSend(){
  const w = wrCur(), ed = WR.ed;
  if(!w || !ed) return;
  if(!ed.notes.length && !ed.summary.trim() && !confirm('没有批注也没有总评，确定就这样发吗？')) return;
  const review = { by: meAs(), score: ed.score, summary: ed.summary.trim(),
    notes: ed.notes.map(n=>({ s:n.s, e:n.e, quote:n.quote, kind:n.kind, fix:n.fix||'', note:n.note||'' })),
    at: firebase.firestore.FieldValue.serverTimestamp() };
  clearTimeout(wrTimer); ed.dirty = false;
  const b = db.batch();
  b.update(db.doc('writings/'+w.id), { status:'reviewed', review, seenAt: firebase.firestore.FieldValue.delete() });
  b.delete(db.doc('reviewDrafts/'+w.id));
  try { await b.commit(); delete WR.drafts[w.id]; }
  catch(e){ console.error(e); ed.dirty = true; toast('没发出去：' + (e.code||e.message) + '，批改还在草稿里', true); return; }
  // The attempt carries the score for 完成记录 / 今日作业. If that fails the marking is still sent.
  db.doc('attempts/'+w.attemptId).update({ 'practice.firstTry': ed.score, 'practice.reviewed': true })
    .catch(e=>console.warn('[作文] attempt not updated:', e.code||e));
  Object.assign(w, { status:'reviewed', review: Object.assign({}, review, { at: firebase.firestore.Timestamp.now() }) });
  delete w.seenAt;
  const a = ATT.find(x=>x.aid===w.attemptId);
  if(a){ a.reviewed = true; a.essay = ed.score; }
  WR.editing = false; WR.ed = null;
  toast(`已发给 ${KID[w.kid].n}`);
  render(); window.scrollTo({ top:0 });
}

  const d = document.getElementById('assdate').value || iso(today);

        const have = new Set(items.map(it=>it.id));

                       at: firebase.firestore.Timestamp.now() });

        const withdrawn = ((snap.data()||{}).withdrawn || []).filter(p=>!have.has(p.id) && !ids.includes(p.id));
        tx.set(refs[i], { items, withdrawn, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge:true });
      });
    });

    SEL.clear(); render();
    toast(`已派给 ${kids.map(kk=>KID[kk].n).join(' 和 ')} · ${d} · ${ids.length} 份`);

// 撤回: the item leaves the kid's day. A copy goes to `withdrawn`, so the parent sees what was taken
// back and the kids page still knows the subject of any score on it. Attempts are never touched.
async function pullItem(k, id, btn){
  const d = TD, it = ASSIGN[k].find(x=>x.id===id);
  if(!it) return;
  const did = ATT.some(a=>a.kid===k && a.id===id && a.date===d);
  if(!confirm(`从 ${KID[k].n} ${d} 的作业里撤回「${it.t}」？${did?`\n\n${KID[k].n} 这天已经做过这份，成绩记录会保留。`:''}`)) return;
  btn.disabled = true;
  const ref = dayRef(k, d);
  try {
    await db.runTransaction(async tx=>{
      const x = (await tx.get(ref)).data() || {};
      const items = x.items || [], gone = items.find(i=>i.id===id);
      if(!gone) return;   // already withdrawn (another tab or device)
      tx.set(ref, { items: items.filter(i=>i.id!==id),
        withdrawn: [...(x.withdrawn||[]).filter(p=>p.id!==id), { ...gone, withdrawnAt: firebase.firestore.Timestamp.now() }],
        updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge:true });
    });
    MOVING = ''; await loadDay(d); render();
    toast(`已撤回 · ${KID[k].n} · ${d} · ${it.t}`);
  } catch(e){
    console.error(e); btn.disabled = false;
    toast('撤回失败：' + (e.code||e.message) + '，没有改动', true);
  }
}

// 改日期: off this day and onto another, in one transaction — never on both days, never on neither.
// If the other day already has it, it just comes off this one.
async function moveItem(k, id, to, btn){
  const from = TD, it = ASSIGN[k].find(x=>x.id===id);
  if(!it) return;
  if(!to || to===from) return toast('选一个别的日期', true);
  btn.disabled = true;
  const src = dayRef(k, from), dst = dayRef(k, to);
  try {
    await db.runTransaction(async tx=>{
      const [s, t] = await Promise.all([tx.get(src), tx.get(dst)]);
      const sItems = (s.data()||{}).items || [], tItems = (t.data()||{}).items || [];
      const cur = sItems.find(i=>i.id===id);
      if(!cur) return;
      const now = firebase.firestore.FieldValue.serverTimestamp();
      tx.set(src, { items: sItems.filter(i=>i.id!==id), updatedAt: now }, { merge:true });
      if(!tItems.some(i=>i.id===id))
        tx.set(dst, { items: [...tItems, { ...cur, movedFrom: from }], updatedAt: now }, { merge:true });
    });
    MOVING = ''; await Promise.all([loadDay(from), to===iso(today) ? loadDay(to) : null]); render();
    toast(`已把「${it.t}」从 ${from} 挪到 ${to}`);
  } catch(e){
    console.error(e); btn.disabled = false;
    toast('改日期失败：' + (e.code||e.message) + '，没有改动', true);
  }
}

// Mom's PIN signs in as soon as the 4th digit is typed. Firebase remembers the login on this
// device (the page never signs itself out), so she only types it again after 退出登录.
function momSignIn(){
  const pin = momPin.value;
  if(!/^\d{4}$/.test(pin)) return;
  gateErr.textContent = ''; momPin.disabled = true; signinBtn.disabled = true;
  auth.signInWithEmailAndPassword(MOM_EMAIL, 'family-' + pin).catch(e=>{
    const wrong = ['auth/wrong-password','auth/invalid-credential','auth/invalid-login-credentials','auth/user-not-found'].includes(e.code);
    showGate(e.code==='auth/too-many-requests' ? '输错太多次了，等几分钟再试。'
           : wrong ? '密码不对，再试一次。' : '登录没成功：' + (e.code||e.message));
    momPin.focus();
  });
}
momPin.addEventListener('input', ()=>{
  momPin.value = momPin.value.replace(/\D/g,'').slice(0,4);
  if(momPin.value.length === 4) momSignIn();
});

signinBtn.addEventListener('click', ()=>{
  gateErr.textContent = ''; signinBtn.disabled = true;
  auth.signInWithPopup(provider).catch(e=>{
    if(e.code==='auth/popup-blocked') return auth.signInWithRedirect(provider);
    const quiet = e.code==='auth/popup-closed-by-user' || e.code==='auth/cancelled-popup-request';
    showGate(quiet ? '' : '登录没成功：' + (e.code||e.message));
  });
});
auth.getRedirectResult().catch(e=>{ gateMsg = '登录没成功：' + (e.code||e.message); });

auth.onAuthStateChanged(async user=>{
  if(!user){ showGate(gateMsg); gateMsg = ''; return; }
  signinBtn.disabled = true; signinBtn.textContent = '正在读取数据…'; momPin.disabled = true;
  try {
    await loadAll();
    WR.list = null; WR.cur = ''; WR.ed = null;   // the 作文 tab reads its own collection, lazily
    document.getElementById('whoami').textContent = user.email === MOM_EMAIL ? '👩 妈妈' : (user.email || '');
    gate.hidden = true;
    render();
  } catch(e){
    console.error(e);
    if(e.code==='permission-denied'){
      // Rules said no: this Google account isn't a parent. Sign it out of this page only.
      gateMsg = `${user.email||'这个账号'} 不是家长账号，读不到数据。换一个 Google 账号试试。`;
      await auth.signOut();
    } else {
      showGate('读取数据失败：' + (e.code||e.message) + '。检查网络后刷新页面。');
    }
  }
});
document.getElementById('lock').addEventListener('click', ()=>auth.signOut());
</script>
</body>
</html>
