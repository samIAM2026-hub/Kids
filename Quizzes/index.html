<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quizzes &middot; Grace &amp; Warren</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    font-family: 'Trebuchet MS', system-ui, sans-serif;
    background: linear-gradient(160deg, #fff3dd 0%, #eaf5ef 55%, #dcefe6 100%);
    background-attachment: fixed;
    min-height: 100vh; color: #33291c; padding: 22px 16px 60px;
  }
  .wrap { max-width: 940px; margin: 0 auto; }
  h1.title { text-align: center; font-size: 32px; color: #b3541e; margin-bottom: 3px; }
  .sub { text-align: center; color: #6b7d72; margin-bottom: 18px; font-size: 14.5px; }

  /* ============ sticky top bar: search + who + view ============ */
  .topbar {
    position: sticky; top: 8px; z-index: 60; margin-bottom: 20px; padding: 11px 12px 10px;
    background: rgba(255,250,240,.95); backdrop-filter: blur(10px);
    border: 2px solid rgba(0,0,0,.08); border-radius: 18px;
    box-shadow: 0 5px 18px rgba(0,0,0,.10);
    display: flex; flex-direction: column; gap: 9px;
  }
  .searchrow { display: flex; gap: 8px; align-items: center; }
  .searchbox { flex: 1; position: relative; display: flex; align-items: center; }
  .searchbox .mag { position: absolute; left: 13px; font-size: 17px; pointer-events: none; opacity: .55; }
  #q {
    width: 100%; font-family: inherit; font-size: 16px; font-weight: bold; color: #33291c;
    background: #fff; border: 2.5px solid #e4d3b4; border-radius: 999px;
    padding: 11px 40px 11px 40px; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  #q::placeholder { color: #b3a892; font-weight: normal; }
  #q:focus { border-color: #b3541e; box-shadow: 0 0 0 4px rgba(179,84,30,.13); }
  #qclear {
    position: absolute; right: 8px; border: none; background: #e8ddc6; color: #7a6a55;
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 15px;
    font-family: inherit; line-height: 1; display: none;
  }
  #qclear:hover { background: #d9c9a8; }
  #q.has + #qclear, #qclear.show { display: block; }
  .dice {
    flex: 0 0 auto; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: bold;
    background: #fff; border: 2.5px solid #cbb789; color: #8a6d3b;
    border-radius: 999px; padding: 10px 15px; white-space: nowrap;
    transition: transform .12s, background .12s, color .12s;
  }
  .dice:hover { transform: translateY(-2px) rotate(-4deg); background: #b3541e; border-color: #b3541e; color: #fff; }

  .chiprow { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
  .chiprow::-webkit-scrollbar { height: 5px; }
  .chiprow::-webkit-scrollbar-thumb { background: #cbb789; border-radius: 999px; }
  .chiprow.views { border-top: 1px dashed rgba(0,0,0,.12); padding-top: 8px; }
  .chip {
    flex: 0 0 auto; cursor: pointer; white-space: nowrap; font-family: inherit;
    background: #fff; border: 2px solid rgba(0,0,0,.09); border-radius: 999px;
    padding: 8px 15px; font-size: 14px; font-weight: bold; color: #5c6b62;
    transition: background .12s, color .12s, border-color .12s, transform .12s;
  }
  .chip:hover { transform: translateY(-2px); border-color: #b3541e; color: #b3541e; }
  .chip.active { background: #b3541e; border-color: #b3541e; color: #fff; }
  .chip .n { font-size: 11px; opacity: .65; margin-left: 5px; font-weight: bold; }
  .chip.active .n { opacity: .85; }
  .chiprow.views .chip { font-size: 13px; padding: 6px 13px; }
  .chiprow.views .chip.active { background: #2f6f5e; border-color: #2f6f5e; }
  .chip .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
               background: #e2574c; vertical-align: middle; margin-left: 6px; }
  .chip.active .dot { background: #fff; }

  /* ============ the new-today banner ============ */
  .newbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: #fff1ef; border: 2.5px solid #f0b4ad; border-radius: 16px;
    padding: 12px 16px; margin-bottom: 18px; box-shadow: 0 4px 0 rgba(0,0,0,.06);
  }
  .newbar b { color: #c0392b; font-size: 16px; }
  .newbar .go {
    margin-left: auto; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: bold;
    background: #e2574c; color: #fff; border: none; border-radius: 999px; padding: 7px 14px;
  }
  .newbar .go:hover { background: #c0392b; }

  /* ============ level 1: one block per child ============ */
  .kid { border-radius: 22px; padding: 18px 18px 14px; margin-bottom: 22px;
         box-shadow: 0 6px 0 rgba(0,0,0,.08); scroll-margin-top: 130px; }
  .kid.peach     { background: #fff4e8; border: 3px solid #ffb37b; }
  .kid.river     { background: #eef6f0; border: 3px solid #8bb98f; }
  .kid.chocolate { background: #f7ece1; border: 3px solid #c9a06b; }
  .kid > h2 { font-size: 25px; margin-bottom: 1px; }
  .kid.peach > h2     { color: #d84315; }
  .kid.river > h2     { color: #3a7d44; }
  .kid.chocolate > h2 { color: #6d4326; }
  .who { font-size: 12.5px; font-weight: bold; opacity: .68; text-transform: uppercase;
         letter-spacing: .5px; margin-bottom: 15px; }

  /* ============ level 2: subject ============ */
  .subj { background: rgba(255,255,255,.6); border: 2px solid rgba(0,0,0,.06);
          border-radius: 16px; padding: 2px 13px; margin-bottom: 11px; }
  .subj > summary { cursor: pointer; list-style: none; padding: 11px 2px;
                    font-size: 17.5px; font-weight: bold; color: #4b5b52;
                    display: flex; align-items: center; gap: 9px; }
  .subj > summary::-webkit-details-marker { display: none; }
  .subj > summary::after { content: '\25BE'; margin-left: auto; opacity: .45; font-size: 14px;
                           transition: transform .15s; }
  .subj[open] > summary::after { transform: rotate(180deg); }
  .kid.peach     .subj > summary { color: #b3541e; }
  .kid.river     .subj > summary { color: #35704a; }
  .kid.chocolate .subj > summary { color: #8a5a34; }
  .count { font-size: 11px; font-weight: bold; background: rgba(0,0,0,.07);
           color: #6b6152; border-radius: 999px; padding: 2px 8px; }

  /* ============ level 3: the SHELF - one tile per book / test set ============ */
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr));
           gap: 10px; margin: 3px 0 13px; align-items: stretch; }
  .book {
    display: flex; align-items: center; gap: 11px; cursor: pointer; text-align: left;
    font-family: inherit; color: inherit; width: 100%;
    background: #fff; border: 2.5px solid rgba(0,0,0,.07); border-radius: 15px;
    padding: 13px 14px; transition: transform .12s, box-shadow .12s, border-color .12s;
  }
  .book:hover { transform: translateY(-3px); box-shadow: 0 7px 15px rgba(0,0,0,.13); }
  .kid.peach     .book:hover, .kid.peach     .book.open { border-color: #ff8a5c; }
  .kid.river     .book:hover, .kid.river     .book.open { border-color: #3a7d44; }
  .kid.chocolate .book:hover, .kid.chocolate .book.open { border-color: #a9703f; }
  .book.open { box-shadow: 0 5px 0 rgba(0,0,0,.07); }
  .book .bic { font-size: 30px; line-height: 1; flex: 0 0 auto; }
  .book > span:nth-child(2) { min-width: 0; }
  .book .bt { display: block; font-weight: bold; font-size: 14px; line-height: 1.28;
              overflow-wrap: break-word; }
  .book .bn { display: block; font-size: 11.5px; color: #7a6a55; margin-top: 3px; line-height: 1.35;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
              overflow: hidden; }
  .book .arrow { margin-left: auto; opacity: .4; font-size: 13px; transition: transform .15s; }
  .book.open .arrow { transform: rotate(90deg); opacity: .7; }
  .book .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
               background: #e2574c; vertical-align: middle; margin-left: 5px; }

  /* the drawer that opens under a book tile */
  .drawer { grid-column: 1 / -1; margin: -4px 0 8px; padding: 13px 14px 4px;
            background: rgba(255,255,255,.75); border: 2px dashed rgba(0,0,0,.12);
            border-radius: 15px; }
  .drawer .dhead { font-size: 13px; font-weight: bold; color: #7a6a55; margin-bottom: 9px;
                   display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .drawer .dhead .shut { margin-left: auto; cursor: pointer; font-family: inherit; font-size: 12px;
                         font-weight: bold; background: none; border: none; color: #9a8b78; }
  .drawer .dhead .shut:hover { color: #b3541e; text-decoration: underline; }

  /* ============ cards ============ */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(212px, 1fr));
          gap: 10px; margin: 3px 0 13px; }
  .quiz {
    display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit;
    background: #fff; border-radius: 14px; padding: 12px 14px; border: 2px solid rgba(0,0,0,.06);
    transition: transform .12s, box-shadow .12s, border-color .12s;
  }
  .quiz:hover { transform: translateY(-3px); box-shadow: 0 6px 14px rgba(0,0,0,.12); }
  .kid.peach     .quiz:hover { border-color: #ff8a5c; }
  .kid.river     .quiz:hover { border-color: #3a7d44; }
  .kid.chocolate .quiz:hover { border-color: #a9703f; }
  .quiz.wide { grid-column: 1 / -1; align-items: flex-start; }
  .quiz.wide .ic { margin-top: 2px; }
  .quiz.wide .d { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
                  overflow: hidden; }
  .quiz .ic { font-size: 25px; line-height: 1; flex: 0 0 auto; }
  .quiz .t { font-weight: bold; font-size: 14.5px; line-height: 1.3; }
  .quiz .d { font-size: 11.5px; color: #7a6a55; margin-top: 3px; line-height: 1.4; }
  .tag { display: inline-block; font-size: 10.5px; font-weight: bold; padding: 2px 8px;
         border-radius: 999px; margin-top: 5px; margin-right: 4px; }
  .tag.vocab { background: #ede0c4; color: #8a6d3b; }
  .tag.reading { background: #d7ecd7; color: #2e6b34; }
  .tag.think { background: #d9e8f5; color: #2f5d86; }
  .kid.peach .tag.reading { background: #ffe0cc; color: #c1440e; }

  .quiz.is-new { border-color: #e2574c; box-shadow: 0 0 0 3px rgba(226,87,76,.14); }
  .badge-new {
    display: inline-block; vertical-align: middle; margin-left: 6px;
    background: #e2574c; color: #fff; font-size: 10px; font-weight: bold;
    letter-spacing: .6px; padding: 2px 7px; border-radius: 999px;
    animation: newpulse 1.8s ease-in-out infinite;
  }
  @keyframes newpulse { 0%,100% { opacity:1; } 50% { opacity:.55; } }
  @media (prefers-reduced-motion: reduce) { .badge-new, .dice { animation: none; transition: none; } }
  summary .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
                 background: #e2574c; vertical-align: middle; }

  /* ============ search results + date view ============ */
  #panel { border-radius: 22px; padding: 18px 18px 12px; margin-bottom: 22px;
           background: #f2f7fb; border: 3px solid #a8c4d8; box-shadow: 0 6px 0 rgba(0,0,0,.08); }
  #panel h2 { font-size: 24px; color: #2f5d86; margin-bottom: 2px; }
  #panel .quiz:hover { border-color: #4d84ad; }
  .daygroup > h3 { font-size: 14px; color: #4b6b83; margin: 14px 0 2px;
                   border-bottom: 1px dashed rgba(0,0,0,.13); padding-bottom: 5px; }
  .crumb { display: block; font-size: 10.5px; font-weight: bold; letter-spacing: .3px;
           color: #97887a; margin-top: 5px; text-transform: uppercase; }
  mark { background: #ffe9a8; color: inherit; border-radius: 3px; padding: 0 2px; }
  .empty { font-size: 14.5px; color: #7d8c84; padding: 14px 2px 18px; line-height: 1.6; }
  .empty b { color: #b3541e; }
  .empty .go { cursor: pointer; font-family: inherit; font-size: 13px; font-weight: bold;
               background: #2f6f5e; color: #fff; border: none; border-radius: 999px;
               padding: 7px 14px; margin-left: 6px; }
  .empty .go:hover { background: #24564a; }

  footer { text-align: center; font-size: 12px; color: #8a9a90; margin-top: 26px; }
  a.home { display:inline-block; margin-top:14px; color:#6b7d72; text-decoration:none; font-size:13px; }
  a.home:hover { text-decoration: underline; }
  .homerow { text-align: center; display: flex; gap: 18px; justify-content: center; }

  @media (max-width: 560px) {
    body { padding: 16px 11px 50px; }
    h1.title { font-size: 26px; }
    .sub { font-size: 13px; }
    .shelf, .grid { grid-template-columns: 1fr; }
    .searchrow { flex-wrap: wrap; }        /* search gets its own full-width row */
    .searchbox { flex: 1 1 100%; }
    .dice { flex: 1 1 100%; padding: 9px 12px; font-size: 13.5px; }
    #q { font-size: 16px; }                /* 16px keeps iOS from zooming on focus */
  }
</style>
</head>

const NEW_DAYS = 1;        // a card shows the red NEW badge while it is this new
const KID_META = {
 "grace": {
  "tab": "👧 Grace",
  "cls": "peach",
  "blurb": "Reading &middot; SSAT &middot; vocabulary &middot; math"
 },
 "warren": {
  "tab": "👦 Warren",
  "cls": "river",
  "blurb": "Reading &middot; SSAT &middot; vocabulary &middot; algebra &middot; writing &middot; big ideas"
 },
 "both": {
  "tab": "🧒 Both",
  "cls": "chocolate",
  "blurb": "中文 &amp; everything else"
 }
};
const SUBJ_ORDER = ["📖 Reading", "📝 SSAT", "🔤 Vocabulary", "🧮 Math", "🧮 Algebra", "✍️ Writing &middot; Reflection", "🧠 Big Ideas &middot; concept exams", "📚 中文 Chinese", "🍁 More"];

/* ---------- helpers ---------- */
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const ENT = {'&amp;':'&','&middot;':'\u00b7','&mdash;':'\u2014','&ndash;':'\u2013',
  '&ldquo;':'\u201c','&rdquo;':'\u201d','&hellip;':'\u2026','&nbsp;':' ','&rarr;':'\u2192',
  '&times;':'\u00d7','&lt;':'<','&gt;':'>','&quot;':'"'};
const deent = s => String(s).replace(/&[a-z]+;/gi, m => {
  const v = ENT[m.toLowerCase()]; return v === undefined ? ' ' : v; });
const strip = s => deent(String(s).replace(/<[^>]+>/g,''));
const ageOf = a => { const p=String(a).split('-').map(Number);
  return (p.length===3 && !p.some(isNaN)) ? Math.round((TODAY-new Date(p[0],p[1]-1,p[2]))/864e5) : 99999; };
const dateOf = a => { const p=String(a).split('-').map(Number);
  return (p.length===3 && !p.some(isNaN)) ? new Date(p[0],p[1]-1,p[2]) : null; };
const numIn = s => { const m = strip(s).match(/\d+/); return m ? +m[0] : 9999; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

Q.forEach((c,ix) => {
  c.ix = ix; c.age = ageOf(c.a); c.date = dateOf(c.a);
  c.isNew = c.age >= 0 && c.age < NEW_DAYS;
  c.ord = (c.o !== undefined) ? c.o : numIn(c.t);
  c.hay = strip([c.t, c.d, c.s, c.g, c.gn, KID_META[c.k].tab, c.h].join(' ')).toLowerCase();
});

/* ---------- build one card ---------- */
function cardEl(c, opts) {
  opts = opts || {};
  const a = document.createElement('a');
  a.className = 'quiz' + (c.w ? ' wide' : '') + (c.isNew ? ' is-new' : '');
  a.href = c.h;
  if (c.ac) a.style.borderColor = c.ac;
  const hl = t => opts.hi ? String(t).replace(opts.hi, m => '<mark>' + m + '</mark>') : t;
  let tags = (c.tg || []).map(t => '<span class="tag ' + t[0] + '">' + t[1] + '</span>').join('');
  a.innerHTML =
    '<div class="ic">' + c.i + '</div><div>' +
    '<div class="t">' + hl(c.t) + (c.isNew ? '<span class="badge-new">NEW</span>' : '') + '</div>' +
    (c.d ? '<div class="d">' + hl(c.d) + '</div>' : '') + tags +
    (opts.crumb ? '<span class="crumb">' + KID_META[c.k].tab + ' &middot; ' + c.s +
                  (c.g ? ' &middot; ' + c.g : '') + '</span>' : '') +
    '</div>';
  return a;
}
function gridOf(list, opts) {
  const g = document.createElement('div'); g.className = 'grid';
  list.forEach(c => g.appendChild(cardEl(c, opts)));
  return g;
}

/* ---------- render the shelves (the "by subject" view) ---------- */
const shelvesEl = document.getElementById('shelves');

function renderShelves(who) {
  shelvesEl.innerHTML = '';
  ['grace','warren','both'].forEach(kid => {
    if (!(who === 'all' || kid === who || kid === 'both')) return;
    const mine = Q.filter(c => c.k === kid);
    if (!mine.length) return;
    const meta = KID_META[kid];

    const sec = document.createElement('section');
    sec.className = 'kid ' + meta.cls; sec.id = kid;
    sec.innerHTML = '<h2>' + meta.tab + '</h2><div class="who">' +
      meta.blurb + ' &middot; ' + mine.length + ' pages</div>';

    const subjects = [...new Set(mine.map(c => c.s))]
      .sort((a,b) => (SUBJ_ORDER.indexOf(a) + 99) - (SUBJ_ORDER.indexOf(b) + 99));

    subjects.forEach(subj => {
      const inSubj = mine.filter(c => c.s === subj);
      const det = document.createElement('details');
      det.className = 'subj';
      const hasNew = inSubj.some(c => c.isNew);
      det.open = hasNew;        // everything starts folded away except today's additions
      det.innerHTML = '<summary>' + subj + ' <span class="count">' + inSubj.length + '</span>' +
                      (hasNew ? '<span class="dot" title="has something new"></span>' : '') + '</summary>';

      const bySort = (a,b) => (b.w||0) - (a.w||0) || a.ord - b.ord || a.ix - b.ix;
      const loose = inSubj.filter(c => !c.g).sort(bySort);
      const books = [...new Set(inSubj.filter(c => c.g).map(c => c.g))];

      if (loose.length) det.appendChild(gridOf(loose));

      if (books.length) {
        const shelf = document.createElement('div'); shelf.className = 'shelf';
        books.forEach(bk => {
          const items = inSubj.filter(c => c.g === bk).sort(bySort);
          const note = items.find(c => c.gn) ? items.find(c => c.gn).gn : '';
          const bnew = items.some(c => c.isNew);
          const icon = (bk.match(/^\s*(\p{Extended_Pictographic}️?)/u) || [,'📘'])[1];
          const label = bk.replace(/^\s*\p{Extended_Pictographic}️?\s*/u, '');

          const tile = document.createElement('button');
          tile.type = 'button'; tile.className = 'book';
          tile.innerHTML = '<span class="bic">' + icon + '</span><span><span class="bt">' +
            label + '</span><span class="bn">' + items.length + ' set' +
            (items.length > 1 ? 's' : '') + (note ? ' &middot; ' + note : '') +
            '</span></span><span class="arrow">&#9656;</span>' +
            (bnew ? '<span class="dot"></span>' : '');

          tile.addEventListener('click', () => toggleBook(tile, shelf, bk, items, label, icon));
          shelf.appendChild(tile);
          if (bnew) requestAnimationFrame(() => toggleBook(tile, shelf, bk, items, label, icon, true));
        });
        det.appendChild(shelf);
      }
      sec.appendChild(det);
    });
    shelvesEl.appendChild(sec);
  });
}

/* one drawer open at a time, inside its own shelf */
function toggleBook(tile, shelf, bk, items, label, icon, force) {
  const already = shelf.dataset.open === bk;
  shelf.querySelectorAll('.drawer').forEach(d => d.remove());
  shelf.querySelectorAll('.book.open').forEach(b => b.classList.remove('open'));
  if (already && !force) { shelf.dataset.open = ''; return; }
  shelf.dataset.open = bk;

  const dr = document.createElement('div');
  dr.className = 'drawer';
  const head = document.createElement('div');
  head.className = 'dhead';
  head.innerHTML = icon + ' <span>' + label + ' &middot; ' + items.length + ' to choose from</span>' +
                   '<button class="shut" type="button">close &times;</button>';
  head.querySelector('.shut').addEventListener('click', e => {
    e.stopPropagation(); dr.remove(); tile.classList.remove('open'); shelf.dataset.open = '';
  });
  dr.appendChild(head);
  dr.appendChild(gridOf(items));
  tile.classList.add('open');
  tile.after(dr);
}

/* ---------- the panel: search results + date views ---------- */
const panel = document.getElementById('panel');
const panelTitle = document.getElementById('panel-title');
const panelSub = document.getElementById('panel-sub');
const panelBody = document.getElementById('panel-body');
const fmt = d => d.toLocaleDateString('en-CA', { year:'numeric', month:'short', day:'numeric' });
const dayName = d => d.toLocaleDateString('en-CA', { weekday:'long' });

function renderSearch(term, who) {
  const t = term.trim().toLowerCase();
  const every = Q.filter(c => c.hay.includes(t));
  const hits = every.filter(c => (who === 'all' || c.k === who || c.k === 'both'))
                    .sort((a,b) => (b.date||0) - (a.date||0));
  const elsewhere = every.length - hits.length;
  panelTitle.innerHTML = '&#128269; ' + esc(term.trim());
  panelSub.textContent = hits.length + (hits.length === 1 ? ' page found' : ' pages found');
  panelBody.innerHTML = '';

  // a hit hidden by the current name filter is the easiest way to think
  // something isn't here at all - so always say where the rest of them are
  const seeAll = () => {
    const p = document.createElement('p');
    p.className = 'empty';
    p.innerHTML = (hits.length ? '' : 'Nothing here for this name. ') +
      '<b>' + elsewhere + '</b> more ' + (elsewhere === 1 ? 'page matches' : 'pages match') +
      ' under the other names. <button class="go" type="button">Search everyone</button>';
    p.querySelector('.go').addEventListener('click', () =>
      document.querySelector('#who-chips .chip[data-value="all"]').click());
    return p;
  };

  if (!hits.length) {
    if (elsewhere) { panelBody.appendChild(seeAll()); return; }
    panelBody.innerHTML = '<p class="empty">Nothing matched <b>' + esc(term.trim()) +
      '</b>.<br>Try a book name (<b>huck</b>, <b>peach</b>), a chapter number (<b>18</b>), ' +
      'a subject (<b>math</b>, <b>vocab</b>), or Chinese (<b>拼音</b>).</p>';
    return;
  }
  const rx = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
  panelBody.appendChild(gridOf(hits, { hi: rx, crumb: true }));
  if (elsewhere) panelBody.appendChild(seeAll());
}

function renderByDate(days, who) {
  const list = Q.filter(c => (who === 'all' || c.k === who || c.k === 'both'))
                .filter(c => c.date && c.age <= days)
                .sort((a,b) => b.date - a.date);
  panelTitle.innerHTML = '&#128197; By date';
  panelSub.textContent = list.length + (list.length === 1 ? ' page' : ' pages') +
    (days === Infinity ? ' · newest first' : ' · added in the last ' + days + ' days');
  panelBody.innerHTML = '';
  if (!list.length) {
    panelBody.innerHTML = '<p class="empty">Nothing added in that window — try a longer one.</p>';
    return;
  }
  let stamp = '', grid = null;
  list.forEach(c => {
    const key = c.date.toDateString();
    if (key !== stamp) {
      stamp = key;
      const box = document.createElement('div'); box.className = 'daygroup';
      const h = document.createElement('h3');
      h.textContent = fmt(c.date) + ' · ' + dayName(c.date) +
        (c.age === 0 ? ' · today' : c.age === 1 ? ' · yesterday' : '');
      box.appendChild(h);
      grid = document.createElement('div'); grid.className = 'grid';
      box.appendChild(grid); panelBody.appendChild(box);
    }
    grid.appendChild(cardEl(c, { crumb: true }));
  });
}

/* ---------- chips, state, wiring ---------- */
(function app() {
  const KEY_WHO = 'kids_quiz_who_v2', KEY_VIEW = 'kids_quiz_view_v2';
  const whoBar = document.getElementById('who-chips');
  const viewBar = document.getElementById('view-chips');
  const qBox = document.getElementById('q');
  const qClear = document.getElementById('qclear');
  const VIEWS = [
    { v:'folders', label:'📂 By subject' },
    { v:'7',       label:'🆕 Last 7 days' },
    { v:'30',      label:'🗓️ Last 30 days' },
    { v:'all',     label:'📅 All, newest first' }
  ];
  let who = 'all', view = 'folders', term = '';

  function chip(bar, label, value, handler, extra) {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.dataset.value = value;
    b.innerHTML = label + (extra || '');
    b.addEventListener('click', () => handler(value));
    bar.appendChild(b); return b;
  }

  chip(whoBar, '🏠 Everyone', 'all', v => setWho(v),
       '<span class="n">' + Q.length + '</span>');
  ['grace','warren'].forEach(k => {
    const mine = Q.filter(c => c.k === k);
    chip(whoBar, KID_META[k].tab, k, v => setWho(v),
      '<span class="n">' + (mine.length + Q.filter(c => c.k === 'both').length) + '</span>' +
      (mine.some(c => c.isNew) ? '<span class="dot"></span>' : ''));
  });
  VIEWS.forEach(o => chip(viewBar, o.label, o.v, v => setView(v)));

  function apply(scroll) {
    const searching = term.trim().length > 0;
    shelvesEl.hidden = searching || view !== 'folders';
    panel.hidden = !searching && view === 'folders';

    if (searching) renderSearch(term, who);
    else if (view !== 'folders') renderByDate(view === 'all' ? Infinity : +view, who);
    else renderShelves(who);

    whoBar.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.value === who));
    viewBar.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.value === view));
    qClear.classList.toggle('show', searching);
    try { localStorage.setItem(KEY_WHO, who); localStorage.setItem(KEY_VIEW, view); } catch(e) {}
    if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  const setWho  = v => { who = v; apply(true); };
  const setView = v => { view = v; apply(true); };

  let timer;
  qBox.addEventListener('input', () => {
    term = qBox.value;
    clearTimeout(timer); timer = setTimeout(() => apply(false), 110);
  });
  qBox.addEventListener('keydown', e => { if (e.key === 'Escape') { qBox.value=''; term=''; apply(false); } });
  qClear.addEventListener('click', () => { qBox.value=''; term=''; qBox.focus(); apply(false); });

  document.getElementById('dice').addEventListener('click', () => {
    const pool = Q.filter(c => who === 'all' || c.k === who || c.k === 'both');
    if (pool.length) location.href = pool[Math.floor(Math.random() * pool.length)].h;
  });

  /* the "new today" banner */
  const fresh = Q.filter(c => c.isNew);
  if (fresh.length) {
    const bar = document.getElementById('newbar');
    bar.hidden = false;
    bar.innerHTML = '<b>🆕 ' + fresh.length + (fresh.length === 1 ? ' new page' : ' new pages') +
      ' added today</b><span style="font-size:13px;color:#96594f">' +
      fresh.map(c => c.t).slice(0,2).join(' &middot; ') +
      (fresh.length > 2 ? ' …' : '') + '</span>' +
      '<button class="go" type="button">Show me</button>';
    bar.querySelector('.go').addEventListener('click', () => setView('7'));
  }

  /* restore last choice, then honour a #grace / #warren deep link */
  try {
    const w = localStorage.getItem(KEY_WHO);
    if (w && whoBar.querySelector('[data-value="' + w + '"]')) who = w;
    const v = localStorage.getItem(KEY_VIEW);
    if (v && viewBar.querySelector('[data-value="' + v + '"]')) view = v;
  } catch(e) {}
  if (location.hash) {
    const h = location.hash.slice(1);
    if (KID_META[h]) { view = 'folders'; who = (h === 'both') ? 'all' : h; }
  }

  apply(false);

  if (location.hash) {
    const el = document.querySelector(location.hash);
    if (el) requestAnimationFrame(() => el.scrollIntoView({ block:'start' }));
  }
})();
</script>
