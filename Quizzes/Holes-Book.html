<div class="wrap">
  <header>
    <div class="eyebrow">Holes · Louis Sachar · The whole book</div>
    <h1>Fifty chapters, fifty questions</h1>
    <div class="sub">One question for every chapter. None of them ask you to just remember what happened &mdash; they ask why, and how the pieces fit together.</div>

<script>
/* Holes whole-book quiz — 2026-11-19. Sam: one question per chapter, no vocab, not too easy, scored,

{
"ch": 1,
"q": "Chapter 1 answers its own questions with one-word paragraphs: \"Usually.\" \"Always.\" What effect does this have?",

"It makes the dangers sound like rumours the boys tell to scare new campers",

"It shows the narrator is unsure what really happens at the camp",
"It slows the story down so the reader can relax before the action"

"answer": 1,
"why": "The flat, calm tone treats deadly danger as a plain fact — that's what makes it creepy."

{
"ch": 2,

"answer": 2,

},
{
"ch": 3,
"q": "How does the author present the family curse in Chapter 3?",

"answer": 0,

{
"ch": 4,

{

{

{

{
"ch": 16,
"q": "Zero has never heard of the nursery rhyme or Sesame Street. What does this hint about him?",

"He was home-schooled by parents who did not allow television"
],
"answer": 0,
"why": "Later (Ch 41, 43) we learn he was homeless. This is one of the first clues."
},
{
"ch": 17,
"q": "Zigzag hits Stanley with a shovel, then tells him to dig out \"his\" dirt. What does this scene show about the camp?",

"answer": 1,

},
{
"ch": 18,
"q": "\"His heart had hardened as well.\" Stanley refuses to teach Zero to read. Why would the author include this unlikable moment?",
"options": [
"To show that Stanley was guilty of the crime after all",
"To prove that reading is too hard to teach in a camp",
"To show the camp changing him, so his later kindness means more",
"To explain why Zero dislikes Stanley for the rest of the book"

"answer": 2,
"why": "A character who changes needs a low point. This is Stanley's."
},
{
"ch": 19,
"q": "Stanley takes the blame for the stolen sunflower seeds even though Magnet stole them. Why?",
"options": [
"He hopes the Warden will reward him for being honest",
"He believes he won't be punished as harshly because he is new",

"He is afraid that Magnet will tell everyone his real name"
],
"answer": 2,
"why": "Keeping the group's trust matters to him more than escaping punishment."

{
"ch": 20,
"q": "The Warden says Mr. Sir won't die: \"Unfortunately for you.\" What does she mean?",

"Mr. Sir will report Stanley to the police for the stolen seeds"

"answer": 2,
"why": "A short, quiet line with a threat inside it — and Ch 24 proves her right."
},
{
"ch": 21,
"q": "Stanley thinks the rattlesnake would be more dangerous without its rattle. Which character could this idea best describe?",

"Zigzag, who seems strange but means the boys no harm"
],
"answer": 0,

},
{
"ch": 22,
"q": "Zero can't read, yet he does hard sums in his head and learns letters fast. What point is the author making?",

{
"ch": 23,

var PREVIEW = /(?:^|&)preview=1(?:&|$)/.test(location.search.slice(1));
var KEY = 'holes.book.v1' + (PREVIEW ? '.preview' : '');
var S = load() || fresh();
if (!S.order || S.order.length !== DATA.length ||
    S.order.some(function (o, i) { return !o || o.length !== DATA[i].options.length; })) S = fresh();

/* Globals the picks adapter in quiz-report.js looks for. */
var QUIZ = DATA.map(function (d, i) {
  return { q: d.q, ch: d.ch, why: d.why,
           options: S.order[i].map(function (k) { return d.options[k]; }),
           answer: S.order[i].indexOf(d.answer) };
});
var picks = S.picks;
function rebuild() {
  QUIZ.forEach(function (q, i) { var d = DATA[i]; q.options = S.order[i].map(function (k) { return d.options[k]; }); q.answer = S.order[i].indexOf(d.answer); });
}
// quiz-report.js records a score whenever finishQuiz() leaves locked === true. A quiz already handed in
// (earlier visit, or another device) is 'final' instead: closed, but a stray finishQuiz() sends nothing.
var locked = S.done ? 'final' : false;

var ME = null, AUTH_KNOWN = false, CHECKED = false, CHECK_FAIL = false, VIEW = 'all', ASK = false;

function fresh() {
  return { order: DATA.map(function (d) { return shuffle(d.options.map(function (_, k) { return k; })); }),
           picks: DATA.map(function () { return null; }), at: 0, started: false, done: null };
}
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function answeredCount() { return picks.filter(function (p) { return p != null; }).length; }
function scoreOf() { return QUIZ.filter(function (q, i) { return picks[i] === q.answer; }).length; }
function partOf(ch) { return ch <= 28 ? 'Part One' : ch <= 49 ? 'Part Two' : 'Part Three'; }

/* ---------- actions (pick / finishQuiz are wrapped by quiz-report.js) ---------- */
function pick(i, j) {
  if (locked || S.done) return;
  picks[i] = j; save(); draw();
}
function finishQuiz() {
  if (S.done || answeredCount() < QUIZ.length) return;
  locked = true;                                    // quiz-report.js grades and records right after this
  S.done = { score: scoreOf(), total: QUIZ.length, at: Date.now(), here: true };
  ASK = false; save(); draw();
}
function go(i) { S.at = Math.max(0, Math.min(QUIZ.length - 1, i)); ASK = false; save(); draw(); window.scrollTo(0, 0); }
function askHandIn() { S.at = QUIZ.length - 1; save(); ASK = true; draw(); }
function begin() { S.started = true; save(); draw(); }

/* Can he hand in from here? Signed in, reporter loaded, and we have checked he hasn't done it elsewhere. */
function blocked() {
  if (PREVIEW) return '';
  if (!window.QuizReport) return 'The scoring script did not load, so your answers could not be recorded. Reload the page and try again.';
  if (!AUTH_KNOWN) return 'Checking who is signed in…';
  if (!ME) return 'You are not signed in. <a href="../homework.html">Sign in on your homework page</a>, then come back &mdash; your answers are saved.';
  if (CHECK_FAIL) return 'Could not reach the server to check your record. Check the internet, then reload the page &mdash; your answers are saved.';
  if (!CHECKED) return 'Checking your record…';
  return '';
}

/* ---------- drawing ---------- */
function draw() {
  var app = $('app');
  if (S.done) { app.innerHTML = result(); return; }
  if (!S.started) { app.innerHTML = intro(); return; }
  app.innerHTML = question();
}

function intro() {
  var stop = blocked();
  return '<div class="card"><h2>Before you start</h2><ul class="rules">' +
    '<li><b>50 questions</b>, one for each chapter, in order. About 45&ndash;60 minutes.</li>' +
    '<li>You get <b>one try</b>. When you hand in, your score is final and goes to Dad. Reloading the page will not start it over.</li>' +
    '<li>Your answers save as you go, so you can stop and come back later &mdash; <b>on this same device</b>.</li>' +
    '<li>You can change an answer any time before you hand in. You will see which ones you got right only after handing in, with a short explanation for every question.</li>' +
    '<li>Have the book nearby if you like. Every question is about <i>why</i> or <i>how</i>, so think before you pick.</li>' +
    '</ul>' +
    (PREVIEW ? '<div class="note">Preview: nothing will be recorded.</div>' : stop ? '<div class="note' + (ME === null && AUTH_KNOWN ? ' warn' : '') + '">' + stop + '</div>' : '') +
    '<div class="nav"><span></span><button class="go" onclick="begin()">Start</button></div></div>';
}

function question() {
  var i = S.at, q = QUIZ[i], n = answeredCount();
  var h = '<div class="card"><div class="n">Chapter ' + q.ch + ' · ' + partOf(q.ch) + ' · Question ' + (i + 1) + ' of ' + QUIZ.length + '</div>' +
    '<div class="bar"><i style="width:' + (100 * n / QUIZ.length) + '%"></i></div>' +
    '<p class="t">' + esc(q.q) + '</p>';
  q.options.forEach(function (o, j) {
    h += '<button class="btn' + (picks[i] === j ? ' on' : '') + '" onclick="pick(' + i + ',' + j + ')">' + 'ABCD'[j] + '. ' + esc(o) + '</button>';
  });
  h += '<div class="nav"><button class="go back" onclick="go(' + (i - 1) + ')"' + (i === 0 ? ' disabled' : '') + '>&larr; Back</button>' +
    (i < QUIZ.length - 1 ? '<button class="go" onclick="go(' + (i + 1) + ')">Next &rarr;</button>'
                         : '<button class="go" onclick="askHandIn()">Hand in</button>') + '</div>';
  if (!PREVIEW && AUTH_KNOWN && !ME) h += '<div class="note warn">You are signed out, so you will not be able to hand in. <a href="../homework.html">Sign in on My Homework</a>, then come back &mdash; your answers are saved.</div>';
  if (ASK) h += handInBox();
  h += '</div>';
  h += '<div class="card"><div class="small">' + n + ' of ' + QUIZ.length + ' answered. Tap a number to jump.</div><div class="grid">';
  QUIZ.forEach(function (_, k) {
    h += '<button class="' + (picks[k] != null ? 'done' : '') + (k === i ? ' here' : '') + '" onclick="go(' + k + ')">' + (k + 1) + '</button>';
  });
  h += '</div>' + (i < QUIZ.length - 1 ? '<div class="nav"><span></span><button class="go back" onclick="askHandIn()">Hand in…</button></div>' : '') + '</div>';
  return h;
}

function handInBox() {
  var left = [];
  picks.forEach(function (p, k) { if (p == null) left.push(k + 1); });
  if (left.length) return '<div class="confirm">You still have <b>' + left.length + '</b> unanswered: ' + left.join(', ') +
    '. Answer every question before handing in.</div>';
  var stop = blocked();
  if (stop) return '<div class="confirm"><div class="note warn">' + stop + '</div></div>';
  return '<div class="confirm"><b>Ready to hand in?</b> This is your one try &mdash; after this you cannot change any answer.' +
    '<div class="row"><button class="go" onclick="finishQuiz()">Yes, hand in</button><button class="go back" onclick="ASK=false;draw()">Not yet, let me check</button></div></div>';
}

function result() {
  var d = S.done, pct = Math.round(100 * d.score / d.total);
  var known = !!d.here;                         // handed in on this device: we know every answer he picked
  var wrongSet = {};
  if (!known) (d.wrong || []).forEach(function (q) { wrongSet[q] = true; });
  function ok(i) { return known ? picks[i] === QUIZ[i].answer : !wrongSet[i + 1]; }
  var h = '<div class="card"><h2>Handed in</h2><div class="score">' +
    '<div><b>' + d.score + '/' + d.total + '</b><span>Correct</span></div>' +
    '<div><b>' + pct + '%</b><span>Score</span></div>' +
    '<div><b>' + (d.total - d.score) + '</b><span>To look at again</span></div></div>' +
    (PREVIEW ? '<div class="note">Preview: nothing was recorded.</div>' : '<div class="note ok">Your score has gone to Dad. This quiz was one try only, so it stays as it is.</div>') +
    (known ? '' : '<div class="note">You handed this in on another device, so this one shows which questions were right and the correct answers, but not the letter you picked.</div>') +
    '<div class="grid" style="margin-top:12px">';
  QUIZ.forEach(function (_, k) { h += '<button class="' + (ok(k) ? 'right' : 'wrong') + '" onclick="document.getElementById(\'r' + k + '\').scrollIntoView({behavior:\'smooth\'})">' + (k + 1) + '</button>'; });
  h += '</div></div><div class="card"><div class="filters">' +
    '<button class="chip' + (VIEW === 'wrong' ? ' on' : '') + '" onclick="VIEW=\'wrong\';draw()">Ones I missed</button>' +
    '<button class="chip' + (VIEW === 'all' ? ' on' : '') + '" onclick="VIEW=\'all\';draw()">All 50</button></div>';
  QUIZ.forEach(function (q, i) {
    var good = ok(i);
    if (VIEW === 'wrong' && good) return;
    h += '<div class="rev" id="r' + i + '"><div class="n">Chapter ' + q.ch + ' · ' + (good ? '✓ right' : '✗ missed') + '</div><p class="t">' + esc(q.q) + '</p>';
    q.options.forEach(function (o, j) {
      var cls = j === q.answer ? ' right' : (known && picks[i] === j ? ' wrong' : '');
      var tag = j === q.answer ? '<span class="tag">correct</span>' : (known && picks[i] === j ? '<span class="tag">your pick</span>' : '');
      if (j === q.answer && known && picks[i] === j) tag = '<span class="tag">your pick ✓</span>';
      h += '<button class="btn' + cls + '" disabled>' + 'ABCD'[j] + '. ' + esc(o) + tag + '</button>';
    });
    h += '<div class="why">' + esc(q.why) + '</div></div>';
  });
  if (VIEW === 'wrong' && Object.keys(QUIZ).every(function (k) { return ok(+k); })) h += '<p>You missed none. Excellent reading.</p>';
  h += '<div class="nav"><span></span><a class="go" style="text-decoration:none" href="../homework.html">Back to My Homework</a></div>';
  return h + '</div>';
}

/* ---------- sign-in and "already handed in somewhere else?" ---------- */
function watchSignIn() {
  if (PREVIEW) { AUTH_KNOWN = CHECKED = true; return; }
  if (!window.QuizReport || !QuizReport.ready) { draw(); return; }
  QuizReport.ready.then(function (fb) {
    fb.auth.onAuthStateChanged(function (u) {
      ME = u && !u.isAnonymous ? u : null; AUTH_KNOWN = true; CHECKED = false; CHECK_FAIL = false;
      // The save on this device belongs to one kid: someone else signing in here starts clean.
      if (ME && S.uid && S.uid !== ME.uid) { S = fresh(); picks = S.picks; locked = false; rebuild(); }
      if (ME && !S.uid) { S.uid = ME.uid; save(); }
      if (!ME || S.done || !fb.db) { CHECKED = !!S.done; draw(); return; }
      fb.db.collection('attempts').where('kidId', '==', ME.uid).where('itemId', '==', QuizReport.itemId).limit(1).get()
        .then(function (snap) {
          CHECKED = true;
          if (!snap.empty && !S.done) {
            var a = snap.docs[0].data();
            locked = 'final';
            S.done = { score: a.score || 0, total: a.total || QUIZ.length, at: a.submittedAtMs || Date.now(), here: false,
                       wrong: (a.wrong || []).map(function (w) { return w.q; }) };
            save();
          }
          draw();
        }).catch(function () { CHECKED = false; CHECK_FAIL = true; draw(); });   // could not check: keep hand-in blocked
    });
  }).catch(function () { draw(); });
}

draw();
</script>
<script src="../JS/quiz-report.js"></script>
<script>watchSignIn();</script>
</body>
