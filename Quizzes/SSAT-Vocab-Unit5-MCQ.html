<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSAT Vocabulary Unit 5 — Meanings &amp; Context</title>
<!--
  KIDS READING-QUIZ TEMPLATE (Warren & Grace).
  Edit ONLY the CONFIG block and the `questions` array below.
  - CONFIG.theme = "peach" (Grace / James) or "river" (Warren / Huck Finn).
  - Author each question's correct option at index 0 (answer:0); options are shuffled at load.
  - Works for reading comprehension AND fill-in-the-blank+comprehension (use `ch` labels like
    "Part 1 · Fill in the Blank" / "Part 2 · Comprehension"), and vocabulary-meaning MCQs.
  Run scripts/scan_quiz.py on the finished file until it prints PASS.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --font:'Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
    --bg:linear-gradient(160deg,#ffe29a 0%,#ffb37b 50%,#ff8a5c 100%);
    --ink:#4a2c0f;
    --header-bg:#ff7043; --header-shadow:#d84315; --header-radius:24px;
    --bar-bg:#fff3e0; --bar-shadow:#ffccbc; --track:#ffccbc; --fill:#43a047;
    --card-bg:#fff; --card-shadow:#e0a96d; --card-radius:20px; --meta:#ef6c00;
    --opt-bg:#fff8f0; --opt-border:#ffd2a8; --opt-hover:#ff9d57; --opt-radius:14px;
    --correct-bg:#d7f5d3; --correct-border:#43a047; --wrong-bg:#ffd9d9; --wrong-border:#e53935;
    --good-bg:#e8f7e6; --good-fg:#2e7d32; --bad-bg:#fdeaea; --bad-fg:#c62828;
    --btn:#43a047; --btn-shadow:#2e7d32; --next:#ff7043; --next-shadow:#d84315;
    --result-title:#ef6c00; --footer:#7a4a1f;
  }
  body.theme-river{
    --font:'Georgia','Times New Roman',serif;
    --bg:linear-gradient(160deg,#cfe8f0 0%,#a9d3c2 45%,#8bb98f 100%);
    --ink:#2c2418;
    --header-bg:#5b4636; --header-shadow:#3a2c20; --header-radius:18px;
    --bar-bg:#f5ecd9; --bar-shadow:#c9b890; --track:#d9c9a3; --fill:#3a7d44;
    --card-bg:#fffdf7; --card-shadow:#c9b890; --card-radius:16px; --meta:#8a6d3b;
    --opt-bg:#f7f1e3; --opt-border:#ddcaa3; --opt-hover:#b89968; --opt-radius:12px;
    --correct-bg:#d7f0d3; --correct-border:#3a7d44; --wrong-bg:#f6d6d6; --wrong-border:#c0392b;
    --good-bg:#e8f5e6; --good-fg:#2e6b34; --bad-bg:#fbeaea; --bad-fg:#a5352a;
    --btn:#3a7d44; --btn-shadow:#285a30; --next:#8a6d3b; --next-shadow:#5b4636;
    --result-title:#5b4636; --footer:#4c4030;
  }
  body { font-family:var(--font); background:var(--bg); min-height:100vh; color:var(--ink); padding:20px; }
  .wrap { max-width:760px; margin:0 auto; }
  header { background:var(--header-bg); border-radius:var(--header-radius); padding:26px 24px; text-align:center; color:#fff; box-shadow:0 8px 0 var(--header-shadow); margin-bottom:18px; }
  header .ic { font-size:50px; line-height:1; }
  header h1 { font-size:25px; margin:8px 0 4px; }
  header p { font-size:16px; opacity:.95; }
  .bar { background:var(--bar-bg); border-radius:14px; padding:12px 18px; display:flex; justify-content:space-between; align-items:center; font-weight:bold; margin-bottom:16px; box-shadow:0 4px 0 var(--bar-shadow); }
  .progress-track { flex:1; height:14px; background:var(--track); border-radius:10px; margin:0 14px; overflow:hidden; }
  .progress-fill { height:100%; width:0; background:var(--fill); border-radius:10px; transition:width .3s; }
  .card { background:var(--card-bg); border-radius:var(--card-radius); padding:22px; box-shadow:0 6px 0 var(--card-shadow); margin-bottom:16px; }
  .qmeta { font-size:13px; color:var(--meta); font-weight:bold; text-transform:uppercase; letter-spacing:.5px; }
  .qtext { font-size:20px; margin:8px 0 16px; line-height:1.45; }
  .opt { display:block; width:100%; text-align:left; background:var(--opt-bg); border:3px solid var(--opt-border); border-radius:var(--opt-radius); padding:13px 16px; font-size:17px; font-family:inherit; color:var(--ink); margin-bottom:10px; cursor:pointer; transition:transform .1s, background .15s, border-color .15s; }
  .opt:hover:not(:disabled) { transform:translateX(4px); border-color:var(--opt-hover); }
  .opt:disabled { cursor:default; }
  .opt.correct { background:var(--correct-bg); border-color:var(--correct-border); }
  .opt.wrong { background:var(--wrong-bg); border-color:var(--wrong-border); }
  .feedback { margin-top:6px; padding:12px 14px; border-radius:12px; font-size:15px; line-height:1.45; display:none; }
  .feedback.show { display:block; }
  .feedback.good { background:var(--good-bg); color:var(--good-fg); }
  .feedback.bad { background:var(--bad-bg); color:var(--bad-fg); }
  .btn { background:var(--btn); color:#fff; border:none; border-radius:14px; padding:14px 28px; font-size:18px; font-family:inherit; font-weight:bold; cursor:pointer; box-shadow:0 5px 0 var(--btn-shadow); transition:transform .1s; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 var(--btn-shadow); }
  .btn.next { background:var(--next); box-shadow:0 5px 0 var(--next-shadow); display:none; margin-top:6px; }
  .center { text-align:center; }
  .result { background:var(--card-bg); border-radius:var(--card-radius); padding:34px 24px; text-align:center; box-shadow:0 6px 0 var(--card-shadow); }
  .result .big { font-size:62px; }
  .result h2 { font-size:27px; margin:10px 0; color:var(--result-title); }
  .scoreline { font-size:22px; margin:14px 0; }
  .stars { font-size:33px; letter-spacing:4px; margin:10px 0; }
  .hidden { display:none; }
  footer { text-align:center; font-size:13px; color:var(--footer); margin-top:10px; opacity:.85; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ic" id="icon">🍑</div>
    <h1 id="title">Book Title</h1>
    <p id="subtitle">Reading Quiz · Chapter N</p>
  </header>
  <div class="bar">
    <span id="qcount">Question 1</span>
    <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
    <span id="scoreboard">0</span>
  </div>
  <div id="quizArea"></div>
  <div id="resultArea" class="result hidden"></div>
  <footer id="footer"></footer>
</div>

<script>
/* ======================= EDIT THIS ======================= */
const CONFIG = {
  title:    "SSAT Vocabulary · Unit 5",
  subtitle: "Meanings & Word in Context · 20 questions",
  child:    "Warren",
  theme:    "river",
  icon:     "📘",
  passPct:  0.85
};

const questions = [
  { ch:"Part 1 · What Does It Mean?", q:"<b>Queasy</b> most nearly means &mdash;",
    options:["feeling sick and slightly uneasy","feeling calm and well rested now","feeling eager and impatient too","feeling cold and stiff all over"],
    answer:0,
    why:"Queasy is that unsettled, nauseated feeling &mdash; like standing on a rocking boat." },

  { ch:"Part 1 · What Does It Mean?", q:"<b>Quixotic</b> most nearly means &mdash;",
    options:["noble in aim but impractical","clever in aim and well planned","modest in aim and easy to do","selfish in aim and kept hidden"],
    answer:0,
    why:"The word comes from Don Quixote, who charged at windmills &mdash; grand ideals, no chance of working." },

  { ch:"Part 1 · What Does It Mean?", q:"<b>Resourceful</b> most nearly means &mdash;",
    options:["clever at working around problems","careful about following instructions","thorough about gathering supplies","confident about speaking to a crowd"],
    answer:0,
    why:"Resourceful is about inventiveness, not about how many resources a person happens to own." },

  { ch:"Part 1 · What Does It Mean?", q:"<b>Solicitude</b> most nearly means &mdash;",
    options:["care and concern for someone","a taste for being alone and quiet","a polite request to a stranger","a stretch of silence in a meeting"],
    answer:0,
    why:"Solicitude is caring concern. Its look-alike <i>solitude</i> is the one that means being alone." },

  { ch:"Part 1 · What Does It Mean?", q:"<b>Stagnant</b> most nearly means &mdash;",
    options:["not moving or developing","moving in a steady flow","growing at a rapid rate","changing from day to day"],
    answer:0,
    why:"A stagnant pond sits still and goes green; a stagnant economy stops growing." },

  { ch:"Part 1 · What Does It Mean?", q:"<b>Tremulous</b> most nearly means &mdash;",
    options:["shaking or quivering slightly","booming and full of force","smooth and evenly paced","silent and held quite still"],
    answer:0,
    why:"A tremulous voice trembles &mdash; the two words share the same root." },

  { ch:"Part 1 · What Does It Mean?", q:"<b>Upheaval</b> most nearly means &mdash;",
    options:["a big change causing disorder","a slow rise in cost or value","a plan made to stop trouble","a return to an earlier state"],
    answer:0,
    why:"Upheaval literally means <i>heaved up</i> &mdash; everything gets turned over at once." },

  { ch:"Part 1 · What Does It Mean?", q:"<b>Verbose</b> most nearly means &mdash;",
    options:["using far more words than needed","using unusual or difficult words","speaking in a very quiet voice","writing in short, clipped lines"],
    answer:0,
    why:"Verbose is about the <i>quantity</i> of words, not how hard they are." },

  { ch:"Part 2 · Word in Context", q:"After the coach benched him, Danny looked for a way to <b>retaliate</b>. He wanted to &mdash;",
    options:["pay someone back for a wrong","apologise for causing a wrong","explain the reason for a wrong","recover quietly from a wrong"],
    answer:0,
    why:"To retaliate is to hit back after being hit &mdash; the Latin root means payment in kind." },

  { ch:"Part 2 · Word in Context", q:"The inspector <b>scrutinized</b> every seam of the parachute. She &mdash;",
    options:["examined it very closely","criticised it quite loudly","replaced it with a new one","measured it against a rule"],
    answer:0,
    why:"Scrutinize means to look at something hard and carefully &mdash; here, seam by seam." },

  { ch:"Part 2 · Word in Context", q:"Two neighbours <b>wrangled</b> over the fence line for six years. They &mdash;",
    options:["argued back and forth at length","agreed after a short discussion","shared the cost of the repair","reported it to the town council"],
    answer:0,
    why:"A wrangle is a long, grinding dispute &mdash; six years of it in this case." },

  { ch:"Part 2 · Word in Context", q:"Smartphones are now <b>ubiquitous</b> in middle schools. They are &mdash;",
    options:["found just about everywhere","banned under a strict rule","popular with a small group","expensive for most families"],
    answer:0,
    why:"Ubiquitous means present everywhere at once, from the Latin <i>ubique</i>." },

  { ch:"Part 2 · Word in Context", q:"She gave a <b>rueful</b> smile when she saw her exam score. She felt &mdash;",
    options:["regretful about what happened","delighted about what happened","confused about what happened","irritated about what happened"],
    answer:0,
    why:"Rueful is that half-smile of regret &mdash; you <i>rue</i>, or regret, what you did." },

  { ch:"Part 2 · Word in Context", q:"He is a <b>voracious</b> reader who finishes a novel a night. This means he is &mdash;",
    options:["hungry for more, in a big way","slow and careful with detail","well informed on many topics","picky about what he chooses"],
    answer:0,
    why:"Voracious describes appetite, not knowledge &mdash; he reads a lot, fast and eagerly." },

  { ch:"Part 2 · Word in Context", q:"The coach warned the team not to <b>transgress</b> the rules again. He told them not to &mdash;",
    options:["go past what the rules allow","argue over what the rules mean","forget what the rules require","rewrite the rules of the game"],
    answer:0,
    why:"<i>Trans-</i> means across; to transgress is to step across a boundary you were told to respect." },

  { ch:"Part 2 · Word in Context", q:"Her support for the plan began to <b>waver</b> in week two. It started to &mdash;",
    options:["grow unsteady and uncertain","spread across her whole team","harden into a firm belief","become known to her manager"],
    answer:0,
    why:"To waver is to wobble between two views &mdash; the opposite of standing firm." },

  { ch:"Part 3 · Think About It", q:"Which pair of words comes closest to being <b>opposites</b>?",
    options:["tremulous and stalwart","queasy and anxious","verbose and garrulous","rueful and penitent"],
    answer:0,
    why:"Tremulous means shaky and stalwart means sturdy; the other three pairs are near synonyms." },

  { ch:"Part 3 · Think About It", q:"A senator gives a ninety-minute speech that could have taken ten. Which word fits him best?",
    options:["verbose","quixotic","voracious","tremulous"],
    answer:0,
    why:"Verbose means using many more words than the point actually needs." },

  { ch:"Part 3 · Think About It", q:"Which word best describes a plan that is admirable but has almost no chance of working?",
    options:["quixotic","resourceful","stagnant","ubiquitous"],
    answer:0,
    why:"Quixotic captures noble intentions paired with impossible odds." },

  { ch:"Part 3 · Think About It", q:"A parent sits up all night in the hospital corridor. Which word names what the parent is showing?",
    options:["solicitude","solitude","upheaval","scrutiny"],
    answer:0,
    why:"Solicitude is anxious care for another person; solitude, its look-alike, just means being alone." }
];

/* ===================== END EDIT AREA ===================== */

document.body.className = 'theme-' + CONFIG.theme;
const MARK = CONFIG.theme === 'river' ? '✓' : '⭐';
document.getElementById('icon').textContent = CONFIG.icon;
document.getElementById('title').textContent = CONFIG.title;
document.getElementById('subtitle').textContent = CONFIG.subtitle;

questions.forEach(item => {
  const correct = item.options[item.answer];
  for (let i = item.options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [item.options[i], item.options[j]] = [item.options[j], item.options[i]];
  }
  item.answer = item.options.indexOf(correct);
});

let current = 0, score = 0, answered = false;
const passNeeded = Math.ceil(questions.length * CONFIG.passPct);
const pctLabel = Math.round(CONFIG.passPct * 100);
const quizArea = document.getElementById('quizArea');
const resultArea = document.getElementById('resultArea');
const qcount = document.getElementById('qcount');
const scoreboard = document.getElementById('scoreboard');
const progress = document.getElementById('progress');
document.getElementById('footer').textContent =
  `For ${CONFIG.child} · Passing score: ${pctLabel}% (${passNeeded} of ${questions.length})`;

function render() {
  answered = false;
  const item = questions[current];
  qcount.textContent = `Question ${current + 1} of ${questions.length}`;
  scoreboard.textContent = `${MARK} ${score}`;
  progress.style.width = `${(current / questions.length) * 100}%`;
  const opts = item.options.map((o, i) => `<button class="opt" data-i="${i}" onclick="choose(${i})">${o}</button>`).join('');
  quizArea.innerHTML = `
    <div class="card">
      <div class="qmeta">${item.ch}</div>
      <div class="qtext">${item.q}</div>
      ${opts}
      <div class="feedback" id="fb"></div>
      <div class="center"><button class="btn next" id="nextBtn" onclick="next()">Next →</button></div>
    </div>`;
}

function choose(i) {
  if (answered) return;
  answered = true;
  const item = questions[current];
  const buttons = document.querySelectorAll('.opt');
  buttons.forEach(b => b.disabled = true);
  const fb = document.getElementById('fb');
  if (i === item.answer) {
    score++;
    buttons[i].classList.add('correct');
    fb.className = 'feedback good show';
    fb.innerHTML = `✅ <strong>Correct!</strong> ${item.why}`;
  } else {
    buttons[i].classList.add('wrong');
    buttons[item.answer].classList.add('correct');
    fb.className = 'feedback bad show';
    fb.innerHTML = `❌ <strong>Not quite.</strong> ${item.why}`;
  }
  scoreboard.textContent = `${MARK} ${score}`;
  document.getElementById('nextBtn').style.display = 'inline-block';
}

function next() { current++; if (current < questions.length) render(); else showResult(); }

function showResult() {
  quizArea.classList.add('hidden');
  document.querySelector('.bar').classList.add('hidden');
  resultArea.classList.remove('hidden');
  progress.style.width = '100%';
  const pct = Math.round((score / questions.length) * 100);
  const passed = score >= passNeeded;
  let stars, msg, emoji;
  if (pct === 100) { stars='⭐⭐⭐⭐⭐'; msg="Perfect score! You really know it."; emoji='🏆'; }
  else if (passed) { stars='⭐⭐⭐⭐'; msg="Excellent! You passed with room to spare."; emoji='🎖️'; }
  else if (pct >= 60) { stars='⭐⭐⭐'; msg=`So close! You need ${pctLabel}% to pass — review and try again.`; emoji='📖'; }
  else if (pct >= 40) { stars='⭐⭐'; msg=`Good effort! You need ${pctLabel}% to pass. Re-read and give it another go.`; emoji='📚'; }
  else { stars='⭐'; msg="Let's read it again carefully and try once more."; emoji='📗'; }
  const banner = passed
    ? `<div style="background:var(--correct-bg);color:var(--good-fg);border-radius:12px;padding:14px;font-size:24px;font-weight:bold;margin:14px 0;">🎉 PASSED! 🎉</div>`
    : `<div style="background:var(--bad-bg);color:var(--bad-fg);border-radius:12px;padding:14px;font-size:24px;font-weight:bold;margin:14px 0;">Not passed yet — need ${pctLabel}%</div>`;
  resultArea.innerHTML = `
    <div class="big">${emoji}</div>
    <h2>Quiz Complete!</h2>
    ${banner}
    <div class="stars">${stars}</div>
    <div class="scoreline">You got <strong>${score}</strong> out of <strong>${questions.length}</strong> (${pct}%)</div>
    <div style="font-size:15px;color:var(--footer);margin:-4px 0 8px;">Passing score: ${pctLabel}% (${passNeeded} of ${questions.length})</div>
    <p style="margin:10px 0 20px;font-size:17px;">${msg}</p>
    <button class="btn" onclick="restart()">Try Again 🔄</button>`;
}

function restart() {
  current = 0; score = 0; answered = false;
  resultArea.classList.add('hidden');
  quizArea.classList.remove('hidden');
  document.querySelector('.bar').classList.remove('hidden');
  render();
}
render();
</script>
</body>
</html>
