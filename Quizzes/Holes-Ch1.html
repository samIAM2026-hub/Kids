<script>
/* Holes, Chapter 1 (Warren). The chapter itself is not printed here: he reads it in his book.
   Scores go out through quiz-report.js ('picks' adapter); the paragraph goes to `writings` and is marked
   from the chat window (homework-system/writing-review.mjs, course 'reading' in JS/writing-kinds.js). */
/* ---------- content ---------- */
var WORDS = [
  { w:'wasteland', pos:'noun', m:'Ruined, empty land where almost nothing can live.' },
  { w:'shriveled', pos:'verb', m:'Dried out, shrank and wrinkled. Normally said of fruit, leaves or skin.' },
  { w:'hovers', pos:'verb', m:'Hangs in one place, or stays near one level, without moving off.' },
  { w:'forbidden', pos:'adjective', m:'Not allowed by a rule or by someone in power.' }
];

var QUIZ = {
  words: [
    { q:"The author writes that the town “shriveled.” That word usually describes fruit or leaves. Using it for a town is…", options:["an exaggeration that is meant as a joke","a metaphor for slow death by thirst","a literal report of what happened","a polite way to avoid the truth"], answer:1,
      why:"A town cannot literally shrivel. The word borrows the picture of a grape drying into a raisin, so in one verb you see the town losing its water and its life together. That is metaphor doing the work of a whole paragraph." },
    { q:"The temperature “hovers” around ninety-five. Why is hovers a stronger choice than reaches?", options:["It suggests heat that hangs in place all day long","It suggests the heat arrives quickly, then is gone","It suggests nobody has measured the temperature","It suggests the heat is pleasant, like a warm bath"], answer:0,
      why:"Reaches is a moment. Hovers is a condition. Things that hover (a hawk, a helicopter) stay over you and do not leave. The verb makes the heat feel like something watching the camp." },
    { q:"Which word is closest in meaning to forbidden, as the chapter uses it?", options:["discouraged","neglected","abandoned","prohibited"], answer:3,
      why:"Prohibited means banned by a rule. Discouraged is weaker: you may still do it. Forbidden always implies somebody with the power to forbid." },
    { q:"Complete the analogy. Wasteland is to barren as oasis is to ___.", options:["distant","shallow","fertile","ancient"], answer:2,
      why:"The bridge is “a place and the quality that defines it.” A wasteland is barren, where nothing grows. An oasis is fertile, where things grow in the middle of desert." }
  ],
  check: [
    { q:"Some campers try to get bitten by a scorpion so they can rest. What is the strongest inference?", options:["The counselors do not watch the campers closely","Scorpion bites at this camp are mostly harmless","The campers have never been warned about bites","A day of digging is worse than a venomous bite"], answer:3,
      why:"Nobody chooses pain unless the other choice is worse. The author never says the digging is terrible. He lets a boy's choice say it. That is showing instead of telling." },
    { q:"The boys are called “campers” and the place a “camp.” Given what the chapter describes, those words work as…", options:["euphemisms that make something harsh sound mild","technical terms that the law requires people use","nicknames the boys proudly chose for themselves","insults that are meant to embarrass the boys"], answer:0,
      why:"A euphemism is a gentle word laid over a hard fact. Camp sounds like canoes and marshmallows. Ask who benefits when a place like this is given a name like that." },
    { q:"Which pair of words best describes the narrator's tone?", options:["resentful and accusing","dry and matter-of-fact","tender and reassuring","nervous and bewildered"], answer:1,
      why:"He reports a slow and painful death in the same voice you would use for bus times. That flat, deadpan voice is a choice: horror told calmly is more unsettling than horror shouted." },
    { q:"A skilled writer chooses what to leave out. Which fact does Chapter 1 deliberately withhold?", options:["How hot the lake bed gets in summer","What a lizard bite does to a person","Why the campers are digging holes","Who is allowed to use the hammock"], answer:2,
      why:"The holes are mentioned only in passing, as places where snakes hide. The book is titled Holes and the first chapter will not tell you what they are for. A question planted this early is one the whole book intends to answer." },
    { q:"The chapter ends by saying a bitten camper may as well lie in the hammock, because no one can punish him any more. What does that ending imply?", options:["The Warden becomes kind once a camper is badly hurt","Only a camper with nothing left to lose is free here","The hammock is the safest place to wait for a doctor","Lizard bites are rare enough that the rule is a joke"], answer:1,
      why:"The one way to break the Warden's rule is to be past punishing. That tells you how total the Warden's power is, and it is a very dark joke: the hammock is finally yours when you are dying." },
    { q:"The first sentence tells you what is NOT there. Why might an author open a book that way?", options:["To prove the narrator has visited the place himself","To make the setting easier for a reader to picture","To save the real description for a later chapter","To break the name's promise in the very first line"], answer:3,
      why:"You arrive with a picture the name gave you, and the first sentence takes it away. From line one you learn not to trust what things are called here. Keep that habit for the next forty-nine chapters." }
  ],
  craft: [
    { q:"Three one-word lines appear: “Usually.” “Usually.” “Always.” What does breaking the pattern on the third one achieve?", options:["It shows the narrator has lost track of his list","It lets the reader relax after the earlier danger","It turns a small doubt into a certainty of death","It proves the first two warnings were only jokes"], answer:2,
      why:"Repetition sets up an expectation, and the change is where the meaning lands. Two “Usually” lines leave a crack of hope. “Always” closes it. This is the rule of three: set up, repeat, then twist." },
    { q:"The narrator speaks to “you” and offers “a good rule to remember,” like a visitor's guide. What is the effect?", options:["It places you inside the camp as if you were a camper","It shows the narrator is one of the camp's counselors","It tells you the story happened a very long time ago","It makes the dangers seem too silly to take seriously"], answer:0,
      why:"Second-person address (“you”) removes the safe distance between reader and story. The cheerful guidebook voice also clashes with the content, which is another layer of irony." },
    { q:"Which of these is situational irony, where what happens is the opposite of what you would expect?", options:["A narrator who describes the heat in exact degrees","A camp where being bitten counts as a lucky break","A rule that campers may not lie in the hammock","A lake bed where snakes hide under the rocks"], answer:1,
      why:"You expect a venomous bite to be a disaster. Here it is a holiday. When events turn expectation upside down, that is situational irony. (Verbal irony is saying the opposite of what you mean.)" },
    { q:"“The Warden owns the shade.” The Warden has not appeared yet. What is the author doing?", options:["Explaining the legal history of the camp's land","Hinting that the Warden will be absent all book","Showing that the campers admire their Warden","Building a character through one telling detail"], answer:3,
      why:"This is indirect characterization. No description, no dialogue, yet you already know this person: someone who claims the one comfort in a wasteland. You will meet the Warden already afraid." }
  ]
};

var TERMS = [
  ['tone','the attitude in the narrator\'s voice'],
  ['euphemism','a mild word covering a harsh fact'],
  ['situational irony','events turn out opposite to what you expect'],
  ['indirect characterization','showing a person through details, not description']
];
var PROMPTS = {
  A: { name:'Analysis', q:'How does the author make Camp Green Lake feel dangerous without showing a single person getting hurt?',
       how:'① State your claim in one sentence. ② Give two specific details from the chapter. ③ Name the technique behind at least one of them (tone, irony, euphemism, word choice, what is left out). ④ Explain how each detail creates the feeling.' },
  B: { name:'Imitation', q:'Invent a place whose name lies. Write the opening of a story about it, in this narrator\'s voice.',
       how:'① Start by saying what is not there. ② Keep the voice calm and factual. ③ Use the one-word-line trick at least twice, and break the pattern once. ④ Never say directly that the place is bad. Let the details do it.' }
};

var CLUES = ['the hammock','the two oak trees','the Warden','the holes','the yellow-spotted lizards','the dried-up town'];
var REALITY = ['No lake. It dried up long ago.','No shade, except the Warden\'s.','Rattlesnakes, scorpions and deadly lizards.'];

var STEPS = [
  { id:'before', n:'1', label:'Before' },
  { id:'words',  n:'2', label:'Word choice' },
  { id:'check',  n:'3', label:'Read between' },
  { id:'craft',  n:'4', label:'Craft' },
  { id:'clues',  n:'5', label:'Predict' },
  { id:'write',  n:'6', label:'Write' },
  { id:'done',   n:'★', label:'Finish' }
];

/* ---------- the shape quiz-report.js looks for (its 'picks' adapter) ----------
   QUIZ[] flat, picks[], locked, pick(i, j), finishQuiz(), resetQuiz(). REPORT_WRITING is set just around
   finishQuiz() the first time, so the paragraph goes to `writings` with the same ID as the attempt. */
var BYSET = QUIZ, SETS = ['words', 'check', 'craft'], OFF = {};
QUIZ = [];
SETS.forEach(function (s) { OFF[s] = QUIZ.length; BYSET[s].forEach(function (q) { QUIZ.push(q); }); });
var picks = QUIZ.map(function () { return null; });
var locked = false;
var REPORT_WRITING = null;

/* ---------- state (this device) ---------- */
// A parent's preview (?preview=1, the same test quiz-report.js uses) records nothing, so it keeps its own
// state: it must never leave the kid's page looking finished and handed in.
var PREVIEW = /(?:^|&)preview=1(?:&|$)/.test(location.search.slice(1));
var CH = 1, KEY = 'holes.ch1.v1' + (PREVIEW ? '.preview' : ''), NB_KEY = 'holes.notebook.v1' + (PREVIEW ? '.preview' : '');
var S = { step: 0, guess: ['', '', ''], read: false, picks: null, clues: [], clueWhy: '', essay: '', prompt: 'A',
          pasted: 0, writeSecs: 0, sent: false, done: false, finished: false, lastPicks: null, elsewhere: false };
// Nobody signed in: quiz-report.js would drop the record, so the paragraph is not handed in (it stays on this device).
function noOne() { return !PREVIEW && AUTH_KNOWN && !ME && !S.sent; }
// quiz-report.js did not load (the network dropped): nothing would be recorded at all.
function noReporter() { return !PREVIEW && !window.QuizReport; }
function blocked() { return noOne() || noReporter(); }
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
(function () {
  var saved = lsGet(KEY);
  if (!saved || typeof saved !== 'object') return;
  Object.keys(S).forEach(function (k) { if (saved[k] !== undefined && saved[k] !== null) S[k] = saved[k]; });
  if (!Array.isArray(S.guess)) S.guess = ['', '', ''];
  if (!Array.isArray(S.clues)) S.clues = [];
  if (Array.isArray(S.picks) && S.picks.length === QUIZ.length) picks = S.picks.map(function (p) { return typeof p === 'number' ? p : null; });
  S.step = Math.max(0, Math.min(STEPS.length - 1, +S.step || 0));
  // A retry left half done does not hide a chapter that was finished: go back to the finished answers.
  if (S.finished && !S.done && Array.isArray(S.lastPicks) && S.lastPicks.length === QUIZ.length) { picks = S.lastPicks.slice(); S.done = true; }
  if (S.done) { locked = true; S.step = STEPS.length - 1; }
})();
function save() { S.picks = picks; lsSet(KEY, S); }
// The notebook is shared by every Holes chapter page on this device.
function saveNotebook() {
  var nb = lsGet(NB_KEY); if (!nb || typeof nb !== 'object') nb = {};
  nb['ch' + CH] = { clues: S.clues.slice(), prediction: S.clueWhy.trim() };
  lsSet(NB_KEY, nb);
}

/* ---------- who is signed in (the paragraph only reaches Dad when the kid is) ---------- */
var ME = null, AUTH_KNOWN = false;
function softDraw() {              // not while he is typing: a redraw would take the box out from under him
  var a = document.activeElement;
  if (a && (a.id === 'essay' || a.id === 'clueWhy')) refreshNext(); else draw();
}
function watchSignIn() {
  if (STEPS[S.step].id === 'write') softDraw();              // the first draw ran before quiz-report.js loaded
  if (PREVIEW || !window.QuizReport || !QuizReport.ready) return;
  QuizReport.ready.then(function (fb) {
    fb.auth.onAuthStateChanged(function (u) {
      ME = u && !u.isAnonymous ? u : null; AUTH_KNOWN = true;
      if (STEPS[S.step].id === 'write') softDraw();
      // Handed in from another device already? Then this one must not send a second paragraph.
      if (!ME || S.sent || !fb.db) return;
      fb.db.collection('writings').where('kidId', '==', ME.uid).where('itemId', '==', QuizReport.itemId).limit(1).get()
        .then(function (q) {
          if (q.empty || S.sent) return;
          S.sent = true; S.elsewhere = true; save();
          if (STEPS[S.step].id === 'write' || STEPS[S.step].id === 'clues') draw();
        }).catch(function () {});
    });
  }).catch(function () {});
}

/* ---------- helpers ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function words(s) { var m = String(s || '').trim().match(/[A-Za-z0-9'’\-]+/g); return m ? m.length : 0; }
function setDone(set) { return BYSET[set].every(function (q, i) { return picks[OFF[set] + i] != null; }); }
function score() { return QUIZ.filter(function (q, i) { return picks[i] === q.answer; }).length; }
var MIN_WORDS = 80, MIN_PREDICT = 12;
function stepReady(i) {
  var id = STEPS[i].id;
  if (id === 'before') return S.read && S.guess.some(function (g) { return String(g).trim(); });
  if (id === 'words' || id === 'check' || id === 'craft') return setDone(id);
  // Once the paragraph is handed in (here, or on another device) these two are fixed and no longer hold him up.
  if (id === 'clues') return S.sent || (S.clues.length > 0 && words(S.clueWhy) >= MIN_PREDICT);
  if (id === 'write') return S.sent || words(S.essay) >= MIN_WORDS;
  return true;
}
function firstNotReady() { for (var i = 0; i < STEPS.length - 1; i++) if (!stepReady(i)) return i; return -1; }

/* ---------- answering ---------- */
function pick(i, j) {
  if (locked || picks[i] != null) return;
  picks[i] = j; save(); draw();
}
function finishQuiz() {            // quiz-report.js grades after this, and only if locked turned true
  if (picks.every(function (p) { return p != null; })) locked = true;
}
function resetQuiz() {             // "try the questions again": the paragraph stays, it is not sent twice
  picks = QUIZ.map(function () { return null; });
  locked = false; S.done = false; S.step = 1; save(); draw(); window.scrollTo(0, 0);
}
function handIn() {
  var gap = firstNotReady();
  if (gap >= 0) { go(gap); return; }
  if (blocked()) { draw(); return; }
  tickWrite();
  saveNotebook();
  if (!S.sent && !PREVIEW) {
    var P = PROMPTS[S.prompt] || PROMPTS.A, essay = S.essay.trim();
    var text = essay + '\n\nMy prediction: ' + S.clueWhy.trim() + '\nWatching: ' + S.clues.join(', ');
    REPORT_WRITING = { pid: 'holes-ch' + CH + '-' + (S.prompt === 'B' ? 'B' : 'A'), prompt: 'Holes, Chapter ' + CH + ' · ' + P.name + ': ' + P.q,
      promptKind: S.prompt === 'B' ? 'imitation' : 'analysis', text: text.slice(0, 20000), words: words(essay),
      secs: Math.round(S.writeSecs), pasted: S.pasted || 0, status: 'submitted', draftNo: 1, reportVersion: 2 };
  }
  finishQuiz();                    // records the attempt, then the paragraph
  REPORT_WRITING = null;
  if (!locked) return;
  S.sent = true; S.done = true; S.finished = true; S.lastPicks = picks.slice();
  S.step = STEPS.length - 1; save(); draw(); window.scrollTo(0, 0);
}

/* time spent on the writing step (told to whoever marks it) */
var writeFrom = 0;
function tickWrite() { if (writeFrom) { S.writeSecs += (Date.now() - writeFrom) / 1000; writeFrom = 0; } }
function startWrite() { if (!writeFrom && !S.sent) writeFrom = Date.now(); }
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { tickWrite(); save(); } else if (STEPS[S.step].id === 'write') startWrite();
});

/* ---------- screens ---------- */
function quizHtml(set) {
  return BYSET[set].map(function (q, i) {
    var at = OFF[set] + i, p = picks[at], answered = p != null;
    return '<div class="q"><div class="n">Question ' + (i + 1) + ' of ' + BYSET[set].length + '</div><p class="t">' + esc(q.q) + '</p>' +
      q.options.map(function (o, j) {
        var cls = 'btn' + (answered && j === q.answer ? ' right' : '') + (answered && j === p && j !== q.answer ? ' wrong' : '');
        return '<button class="' + cls + '" onclick="pick(' + at + ',' + j + ')"' + (answered || locked ? ' disabled' : '') + '>' + esc(o) + '</button>';
      }).join('') +
      '<div class="why' + (answered ? ' show' : '') + '"><b>' + (answered && p === q.answer ? 'Yes. ' : 'Not quite. ') + '</b>' + esc(q.why) + '</div></div>';
  }).join('');
}
function nbHtml() {
  var out = S.clues.map(function (c) { return '<li><b>Ch ' + CH + '</b> · watching: ' + esc(c) + '</li>'; });
  if (S.clueWhy.trim()) out.push('<li><b>Ch ' + CH + '</b> · “' + esc(S.clueWhy.trim()) + '”</li>');
  return out.length ? out.join('') : '<li style="color:#9a8a78">Nothing yet. Pick a clue above.</li>';
}
var VIEW = {
  before: function () {
    return '<div class="card"><div class="mins">Step 1 · 2 minutes</div><h2>Before you open the book</h2>' +
      '<p class="lead">You are being sent to a place called <b>Camp Green Lake</b>. Going only by the name, what three things do you expect to find there?</p>' +
      '<div class="three">' + [0, 1, 2].map(function (i) { return '<input type="text" data-guess="' + i + '" placeholder="I expect…" maxlength="60" value="' + esc(S.guess[i] || '') + '">'; }).join('') + '</div>' +
      '<div class="read"><b>Now read Chapter 1 in your book.</b> It is one page. Read it twice: once for what happens, once for how it sounds.' +
      '<label><input type="checkbox" id="read"' + (S.read ? ' checked' : '') + '> I have read Chapter 1</label></div></div>';
  },
  words: function () {
    return '<div class="card"><div class="mins">Step 2 · 4 minutes</div><h2>Word choice</h2>' +
      '<p class="lead">You probably know these four words already. The real question is why the author picked each one over an easier word.</p>' +
      WORDS.map(function (w) { return '<div class="word"><h3>' + w.w + '<span class="pos">' + w.pos + '</span></h3><p>' + esc(w.m) + '</p></div>'; }).join('') + '</div>' +
      '<div class="card">' + quizHtml('words') + '</div>';
  },
  check: function () {
    return '<div class="card"><div class="mins">Step 3 · 5 minutes</div><h2>Read between the lines</h2>' +
      '<p class="lead">None of these answers is printed in the chapter. Each one has to be worked out from what is there, and from what is missing. Keep the book open.</p>' + quizHtml('check') + '</div>';
  },
  craft: function () {
    return '<div class="card"><div class="mins">Step 4 · 4 minutes</div><h2>Craft: how the effect is built</h2>' +
      '<div class="craft"><b>Terms for today.</b> ' + TERMS.map(function (t) { return '<b>' + t[0] + '</b>: ' + t[1]; }).join(' · ') + '.</div>' +
      quizHtml('craft') + '</div>';
  },
  clues: function () {
    var n = words(S.clueWhy), ro = S.sent ? ' disabled' : '';
    return '<div class="card"><div class="mins">Step 5 · 2 minutes</div><h2>Detective notebook</h2>' +
      '<p class="lead">This book hides clues in plain sight. Things mentioned once come back many chapters later. Your notebook follows you through all fifty chapters, and your predictions get checked when the book answers them.</p>' +
      '<p><b>Which of these will matter later?</b> Pick the ones you would bet on.</p>' +
      '<div class="chips">' + CLUES.map(function (c) { return '<button class="chip' + (S.clues.indexOf(c) >= 0 ? ' on' : '') + '" data-clue="' + esc(c) + '"' + ro + '>' + esc(c) + '</button>'; }).join('') + '</div>' +
      '<p><b>Make one prediction and give your evidence.</b> What will happen, and which words in Chapter 1 make you think so?</p>' +
      '<textarea id="clueWhy" style="min-height:80px" maxlength="600" placeholder="I predict … because the chapter …"' + ro + '>' + esc(S.clueWhy) + '</textarea>' +
      '<div class="count' + (n >= MIN_PREDICT ? ' ok' : '') + '" id="pcount">' + n + ' words · at least ' + MIN_PREDICT + '</div>' +
      '<div class="book"><h4>My notebook so far</h4><ul id="nb">' + nbHtml() + '</ul></div></div>';
  },
  write: function () {
    var n = words(S.essay), P = PROMPTS[S.prompt] || PROMPTS.A, ro = S.sent ? ' disabled' : '';
    return '<div class="card"><div class="mins">Step 6 · 8 minutes</div><h2>Write one paragraph</h2>' +
      '<p class="lead">Choose one. Your paragraph is read and marked by Dad, not by this page.</p>' +
      '<div class="chips">' + ['A', 'B'].map(function (k) { return '<button class="chip' + (S.prompt === k ? ' on' : '') + '" data-prompt="' + k + '"' + ro + '>' + k + ' · ' + PROMPTS[k].name + '</button>'; }).join('') + '</div>' +
      '<p><b>' + esc(P.q) + '</b></p>' +
      '<div class="craft"><b>What a strong answer does:</b> ' + esc(P.how) + '</div>' +
      '<textarea id="essay" style="min-height:210px" maxlength="6000" placeholder="' + (S.prompt === 'A' ? 'The author makes the camp feel dangerous by …' : 'There is no … at …') + '"' + ro + '>' + esc(S.essay) + '</textarea>' +
      '<div class="count' + (n >= MIN_WORDS ? ' ok' : '') + '" id="count">' + n + ' words · aim for 80 to 120</div>' +
      (S.sent ? '<p class="note ok">' + (S.elsewhere ? 'You already handed in a paragraph for this chapter on another device, so this one will not be sent.' : 'You already handed this paragraph in. It cannot be changed here.') + '</p>'
        : PREVIEW ? '<p class="note">Preview: nothing on this page is recorded or handed in.</p>'
        : noReporter() ? '<p class="note warn">This page could not connect to the homework system, so nothing can be handed in right now. Your work is saved on this device. Reload the page, then hand it in.</p>'
        : noOne() ? '<p class="note warn">You are not signed in, so your paragraph cannot reach Dad. It is saved on this device. <a href="../homework.html">Sign in on My Homework</a>, then come back and hand it in.</p>'
        : '<p class="note">When you press the button, your answers and your paragraph are handed in. You cannot change the paragraph afterwards, so read it through once.</p>') +
      '</div>';
  },
  done: function () {
    var got = score(), all = QUIZ.length, pct = Math.round(got / all * 100);
    var mine = S.guess.filter(function (g) { return String(g).trim(); });
    return '<div class="card"><div class="mins">Chapter 1 complete</div><h2>' + (pct >= 80 ? 'Sharp reading.' : 'Go back and read the explanations for the ones you missed.') + '</h2>' +
      '<div class="score"><div><b>' + got + ' / ' + all + '</b><span>questions right</span></div><div><b>' + pct + '%</b><span>' + (pct >= 80 ? 'passed' : '80% to pass') + '</span></div><div><b>' + words(S.essay) + '</b><span>words written</span></div></div>' +
      (PREVIEW ? '<p class="note">Preview: nothing was recorded or handed in.</p>'
        : '<p class="note ok">' + (navigator.onLine === false ? 'You are offline, so it is saved on this device and will be sent when the internet is back. ' : '') +
          '📬 Your paragraph and your prediction are handed in. Dad will read and mark the paragraph, and it will show up on <b>My Homework</b>.</p>') +
      '<p><b>Remember what you expected?</b></p>' +
      '<div class="vs"><div><h4>What the name promised you</h4><ul>' + (mine.length ? mine.map(function (g) { return '<li>' + esc(g) + '</li>'; }).join('') : '<li>(nothing typed)</li>') + '</ul></div>' +
      '<div><h4>What is really there</h4><ul>' + REALITY.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul></div></div>' +
      '<p style="margin-top:14px">The gap between those two boxes is the chapter\'s first <b>irony</b>, and the author built it out of a three-word name.</p>' +
      '<div class="book"><h4>My notebook so far</h4><ul>' + nbHtml() + '</ul></div>' +
      '<div class="next"><b>Next: Chapter 2.</b> It is under a hundred words. Count how many of today\'s techniques come back in it.</div></div>';
  }
};

/* ---------- drawing ---------- */
function draw() {
  var id = STEPS[S.step].id, last = S.step === STEPS.length - 1, ready = stepReady(S.step);
  $('steps').innerHTML = STEPS.map(function (s, i) {
    var reach = S.done || i < STEPS.length - 1;
    var cls = i === S.step ? 'on' : (i < STEPS.length - 1 && stepReady(i) && (S.done || i < S.step) ? 'done' : '');
    return '<button class="' + cls + '" data-step="' + i + '"' + (reach ? '' : ' disabled') + '><b>' + s.n + '</b>' + s.label + '</button>';
  }).join('');
  $('bar').style.width = Math.round(S.step / (STEPS.length - 1) * 100) + '%';
  var right;
  if (last) right = '<a class="go" href="../homework.html">Back to My Homework</a>';
  else if (id === 'write' && !S.done) right = '<button class="go" id="next"' + (ready && !blocked() ? '' : ' disabled') + '>' + (S.sent ? 'Finish →' : 'Hand in and finish →') + '</button>';
  else right = '<button class="go" id="next"' + (ready ? '' : ' disabled') + '>Next →</button>';
  $('main').innerHTML = VIEW[id]() +
    '<div class="nav"><button class="go back" id="back"' + (S.step === 0 ? ' disabled' : '') + '>← Back</button>' + right + '</div>' +
    (last ? '<p class="hint"><button class="link" id="again">Try the questions again</button></p>'
          : '<p class="hint" id="hint"' + (ready ? ' style="display:none"' : '') + '>Finish this step to go on.</p>');
  if (id === 'write') startWrite(); else tickWrite();
}
function refreshNext() {
  var b = $('next'); if (!b) return;
  var ready = stepReady(S.step); b.disabled = !ready || (STEPS[S.step].id === 'write' && !S.done && blocked());
  var h = $('hint'); if (h) h.style.display = ready ? 'none' : '';
}
function go(i) {
  i = Math.max(0, Math.min(STEPS.length - 1, i));
  if (i === STEPS.length - 1 && !S.done) return;            // the finish page only after handing in
  S.step = i; save(); draw(); window.scrollTo(0, 0);
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('button'); if (!t || t.disabled) return;
  if (t.dataset.step != null) return go(+t.dataset.step);
  if (t.id === 'back') return go(S.step - 1);
  if (t.id === 'again') return resetQuiz();
  if (t.id === 'next') {
    if (!stepReady(S.step)) return;
    if (STEPS[S.step].id === 'write' && !S.done) return handIn();
    return go(S.step + 1);
  }
  if (S.sent) return;                                       // handed in: the notebook and the paragraph are fixed
  if (t.dataset.prompt) { S.prompt = t.dataset.prompt; save(); draw(); return; }
  if (t.dataset.clue) {
    var c = t.dataset.clue, at = S.clues.indexOf(c);
    if (at >= 0) S.clues.splice(at, 1); else S.clues.push(c);
    save(); t.classList.toggle('on'); $('nb').innerHTML = nbHtml(); refreshNext();
  }
});
document.addEventListener('input', function (e) {
  var t = e.target, n, c;
  if (t.dataset.guess != null) S.guess[+t.dataset.guess] = t.value;
  else if (t.id === 'read') S.read = t.checked;
  else if (t.id === 'clueWhy') { S.clueWhy = t.value; $('nb').innerHTML = nbHtml(); n = words(t.value); c = $('pcount');
    c.textContent = n + ' words · at least ' + MIN_PREDICT; c.className = 'count' + (n >= MIN_PREDICT ? ' ok' : ''); }
  else if (t.id === 'essay') { S.essay = t.value; n = words(t.value); c = $('count');
    c.textContent = n + ' words · aim for 80 to 120'; c.className = 'count' + (n >= MIN_WORDS ? ' ok' : ''); }
  else return;
  save(); refreshNext();
});
document.addEventListener('paste', function (e) {
  if (e.target && e.target.id === 'essay') { try { S.pasted += ((e.clipboardData || window.clipboardData).getData('text') || '').length; save(); } catch (err) {} }
});
window.addEventListener('pagehide', function () { tickWrite(); save(); });
draw();
</script>
<script src="../JS/quiz-report.js"></script>
<script>watchSignIn();</script>
</body>
</html>
