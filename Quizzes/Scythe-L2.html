function blocked() { return noOne() || noReporter(); }
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
(function () {
  var saved = lsGet(KEY);
  if (!saved || typeof saved !== 'object') return;
  Object.keys(S).forEach(function (k) { if (saved[k] !== undefined && saved[k] !== null) S[k] = saved[k]; });
  if (!Array.isArray(S.guess)) S.guess = ['', '', ''];
  if (!Array.isArray(S.clues)) S.clues = [];
  if (Array.isArray(S.picks) && S.picks.length === QUIZ.length) picks = S.picks.map(function (p) { return typeof p === 'number' ? p : null; });
  S.step = Math.max(0, Math.min(STEPS.length - 1, +S.step || 0));
  // A retry left half done does not hide a chapter that was finished: go back to the finished answers.
  if (S.finished && !S.done && Array.isArray(S.lastPicks) && S.lastPicks.length === QUIZ.length) { picks = S.lastPicks.slice(); S.done = true; }
  if (S.done) { locked = true; S.step = STEPS.length - 1; }
})();
function save() { S.picks = picks; lsSet(KEY, S); }
// The notebook is shared by every Scythe lesson page on this device.
function saveNotebook() {
  var nb = lsGet(NB_KEY); if (!nb || typeof nb !== 'object') nb = {};
  nb['l' + LESSON] = { clues: S.clues.slice(), prediction: S.clueWhy.trim() };
  lsSet(NB_KEY, nb);
}

/* ---------- who is signed in (the paragraph only reaches Dad when the kid is) ---------- */
var ME = null, AUTH_KNOWN = false;
function softDraw() {              // not while he is typing: a redraw would take the box out from under him
  var a = document.activeElement;
  if (a && (a.id === 'essay' || a.id === 'clueWhy')) refreshNext(); else draw();
}
function watchSignIn() {
  if (handStep(S.step)) softDraw();              // the first draw ran before quiz-report.js loaded
  if (PREVIEW || !window.QuizReport || !QuizReport.ready) return;
  QuizReport.ready.then(function (fb) {
    fb.auth.onAuthStateChanged(function (u) {
      ME = u && !u.isAnonymous ? u : null; AUTH_KNOWN = true;
      if (handStep(S.step)) softDraw();
      // Handed in from another device already? Then this one must not send a second paragraph.
      if (!ME || S.sent || !fb.db) return;
      fb.db.collection('writings').where('kidId', '==', ME.uid).where('itemId', '==', QuizReport.itemId).limit(1).get()
        .then(function (q) {
          if (q.empty || S.sent) return;
          S.sent = true; S.elsewhere = true; save();
          if (STEPS[S.step].id === 'write' || STEPS[S.step].id === 'clues') draw();
        }).catch(function () {});
    });
  }).catch(function () {});
}

/* ---------- helpers ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function words(s) { var m = String(s || '').trim().match(/[A-Za-z0-9'’\-]+/g); return m ? m.length : 0; }
function setDone(set) { return BYSET[set].every(function (q, i) { return picks[OFF[set] + i] != null; }); }
function score() { return QUIZ.filter(function (q, i) { return picks[i] === q.answer; }).length; }
var MIN_WORDS = 80, MIN_PREDICT = 12;
function stepReady(i) {
  var id = STEPS[i].id;
  if (id === 'before') return S.read && (C.noGuess || S.guess.some(function (g) { return String(g).trim(); }));
  if (id === 'words' || id === 'check' || id === 'craft') return setDone(id);
  // Once the paragraph is handed in (here, or on another device) these two are fixed and no longer hold him up.
  if (id === 'clues') return S.sent || (S.clues.length > 0 && words(S.clueWhy) >= MIN_PREDICT);
  if (id === 'write') return S.sent || words(S.essay) >= MIN_WORDS;
  return true;
}
function firstNotReady() { for (var i = 0; i < STEPS.length - 1; i++) if (!stepReady(i)) return i; return -1; }

/* ---------- answering ---------- */
function pick(i, j) {
  if (locked || picks[i] != null) return;
  picks[i] = j; save(); draw();
}
function finishQuiz() {            // quiz-report.js grades after this, and only if locked turned true
  if (picks.every(function (p) { return p != null; })) locked = true;
}
function resetQuiz() {             // "try the questions again": the paragraph stays, it is not sent twice
  picks = QUIZ.map(function () { return null; });
  locked = false; S.done = false; S.step = 1; save(); draw(); window.scrollTo(0, 0);
}
function handIn() {
  var gap = firstNotReady();
  if (gap >= 0) { go(gap); return; }
  if (blocked()) { draw(); return; }
  tickWrite();
  if (HAS_WRITE) saveNotebook();
  if (HAS_WRITE && !S.sent && !PREVIEW) {
    var P = PROMPTS[S.prompt] || PROMPTS.A, essay = S.essay.trim();
    var text = essay + '\n\nMy prediction: ' + S.clueWhy.trim() + '\nWatching: ' + S.clues.join(', ');
    REPORT_WRITING = { pid: 'scythe-l' + LESSON + '-' + (S.prompt === 'B' ? 'B' : 'A'), prompt: 'Scythe, Lesson ' + LESSON + ' (' + CHAPTERS + ') · ' + P.name + ': ' + P.q,
      promptKind: (PROMPTS[S.prompt === 'B' ? 'B' : 'A'].kind || (S.prompt === 'B' ? 'argument' : 'analysis')), text: text.slice(0, 20000), words: words(essay),
      secs: Math.round(S.writeSecs), pasted: S.pasted || 0, status: 'submitted', draftNo: 1, reportVersion: 2 };
  }
  finishQuiz();                    // records the attempt, then the paragraph
  REPORT_WRITING = null;
  if (!locked) return;
  S.sent = true; S.done = true; S.finished = true; S.lastPicks = picks.slice();
  S.step = STEPS.length - 1; save(); draw(); window.scrollTo(0, 0);
}

/* time spent on the writing step (told to whoever marks it) */
var writeFrom = 0;
function tickWrite() { if (writeFrom) { S.writeSecs += (Date.now() - writeFrom) / 1000; writeFrom = 0; } }
function startWrite() { if (!writeFrom && !S.sent) writeFrom = Date.now(); }
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { tickWrite(); save(); } else if (STEPS[S.step].id === 'write') startWrite();
});

/* ---------- screens ---------- */
function quizHtml(set) {
  return BYSET[set].map(function (q, i) {
    var at = OFF[set] + i, p = picks[at], answered = p != null;
    return '<div class="q"><div class="n">Question ' + (i + 1) + ' of ' + BYSET[set].length + '</div><p class="t">' + esc(q.q) + '</p>' +
      q.options.map(function (o, j) {
        var cls = 'btn' + (answered && j === q.answer ? ' right' : '') + (answered && j === p && j !== q.answer ? ' wrong' : '');
        return '<button class="' + cls + '" onclick="pick(' + at + ',' + j + ')"' + (answered || locked ? ' disabled' : '') + '>' + esc(o) + '</button>';
      }).join('') +
      '<div class="why' + (answered ? ' show' : '') + '"><b>' + (answered && p === q.answer ? 'Yes. ' : 'Not quite. ') + '</b>' + esc(q.why) + '</div></div>';
  }).join('');
}
function nbHtml() {
  var nb = lsGet(NB_KEY), out = [];
  if (nb && typeof nb === 'object') for (var k = 1; k < LESSON; k++) {
    var e = nb['l' + k]; if (!e) continue;
    (e.clues || []).forEach(function (c) { out.push('<li style="color:#8a7866"><b>L' + k + '</b> · watching: ' + esc(c) + '</li>'); });
    if (e.prediction) out.push('<li style="color:#8a7866"><b>L' + k + '</b> · “' + esc(e.prediction) + '”</li>');
  }
  out = out.concat(S.clues.map(function (c) { return '<li><b>L' + LESSON + '</b> · watching: ' + esc(c) + '</li>'; }));
  if (S.clueWhy.trim()) out.push('<li><b>L' + LESSON + '</b> · “' + esc(S.clueWhy.trim()) + '”</li>');
  return out.length ? out.join('') : '<li style="color:#9a8a78">Nothing yet. Pick a clue above.</li>';
}
var VIEW = {
  before: function () {
    return '<div class="card"><div class="mins">Step 1 · 2 minutes</div><h2>Before you open the book</h2>' +
      '<p class="lead">' + esc(C.before) + '</p>' +
      '<div class="three">' + [0, 1, 2].map(function (i) { return '<input type="text" data-guess="' + i + '" placeholder="Maybe…" maxlength="60" value="' + esc(S.guess[i] || '') + '">'; }).join('') + '</div>' +
      '<div class="read"><b>' + esc(C.readHead) + '</b> ' + esc(C.readNote) +
      '<label><input type="checkbox" id="read"' + (S.read ? ' checked' : '') + '> ' + esc(C.readCheck) + '</label></div></div>';
  },
  words: function () {
    return '<div class="card"><div class="mins">Step 2 · 6 minutes</div><h2>Words from the book</h2>' +
      '<p class="lead">' + esc(C.wordsLead) + '</p>' +
      WORDS.map(function (w) { return '<div class="word"><h3>' + w.w + '<span class="pos">' + w.pos + '</span></h3><p>' + esc(w.m) + '</p><p class="eg">' + esc(w.eg) + '</p></div>'; }).join('') + '</div>' +
      '<div class="card">' + quizHtml('words') + '</div>';
  },
  check: function () {
    return '<div class="card"><div class="mins">Step 3 · 5 minutes</div><h2>Read between the lines</h2>' +
      '<p class="lead">None of these answers is printed in the chapter. Each one has to be worked out from what is there, and from what is left unsaid. Keep the book open.</p>' + quizHtml('check') + '</div>';
  },
  craft: function () {
    return '<div class="card"><div class="mins">Step 4 · 4 minutes</div><h2>Craft: how the effect is built</h2>' +
      '<div class="craft"><b>Terms for today.</b> ' + TERMS.map(function (t) { return '<b>' + t[0] + '</b>: ' + t[1]; }).join(' · ') + '.</div>' +
      quizHtml('craft') + '</div>';
  },
  clues: function () {
    var n = words(S.clueWhy), ro = S.sent ? ' disabled' : '';
    return '<div class="card"><div class="mins">Step 5 · 2 minutes</div><h2>Detective notebook</h2>' +
      '<p class="lead">Small things in this chapter come back later. Your notebook follows you through all 23 lessons, and your predictions get checked when the book answers them.</p>' +
      '<p><b>Which of these will matter later?</b> Pick the ones you would bet on.</p>' +
      '<div class="chips">' + CLUES.map(function (c) { return '<button class="chip' + (S.clues.indexOf(c) >= 0 ? ' on' : '') + '" data-clue="' + esc(c) + '"' + ro + '>' + esc(c) + '</button>'; }).join('') + '</div>' +
      '<p><b>Make one prediction and give your evidence.</b> ' + esc(C.predictQ) + '</p>' +
      '<textarea id="clueWhy" style="min-height:80px" maxlength="600" placeholder="I predict … because the chapter …"' + ro + '>' + esc(S.clueWhy) + '</textarea>' +
      '<div class="count' + (n >= MIN_PREDICT ? ' ok' : '') + '" id="pcount">' + n + ' words · at least ' + MIN_PREDICT + '</div>' +
      '<div class="book"><h4>My notebook so far</h4><ul id="nb">' + nbHtml() + '</ul></div></div>';
  },
  write: function () {
    var n = words(S.essay), P = PROMPTS[S.prompt] || PROMPTS.A, ro = S.sent ? ' disabled' : '';
    return '<div class="card"><div class="mins">Step 6 · 8 minutes</div><h2>Write one paragraph</h2>' +
      '<p class="lead">Choose one. Your paragraph is read and marked by Dad, not by this page.</p>' +
      '<div class="chips">' + ['A', 'B'].map(function (k) { return '<button class="chip' + (S.prompt === k ? ' on' : '') + '" data-prompt="' + k + '"' + ro + '>' + k + ' · ' + PROMPTS[k].name + '</button>'; }).join('') + '</div>' +
      '<p><b>' + esc(P.q) + '</b></p>' +
      '<div class="craft"><b>What a strong answer does:</b> ' + esc(P.how) + '</div>' +
      '<textarea id="essay" style="min-height:210px" maxlength="6000" placeholder="' + (PROMPTS[S.prompt === 'B' ? 'B' : 'A'].ph || '') + '"' + ro + '>' + esc(S.essay) + '</textarea>' +
      '<div class="count' + (n >= MIN_WORDS ? ' ok' : '') + '" id="count">' + n + ' words · aim for 80 to 120</div>' +
      (S.sent ? '<p class="note ok">' + (S.elsewhere ? 'You already handed in a paragraph for this lesson on another device, so this one will not be sent.' : 'You already handed this paragraph in. It cannot be changed here.') + '</p>'
        : PREVIEW ? '<p class="note">Preview: nothing on this page is recorded or handed in.</p>'
        : noReporter() ? '<p class="note warn">This page could not connect to the homework system, so nothing can be handed in right now. Your work is saved on this device. Reload the page, then hand it in.</p>'
        : noOne() ? '<p class="note warn">You are not signed in, so your paragraph cannot reach Dad. It is saved on this device. <a href="../homework.html">Sign in on My Homework</a>, then come back and hand it in.</p>'
        : '<p class="note">When you press the button, your answers and your paragraph are handed in. You cannot change the paragraph afterwards, so read it through once.</p>') +
      '</div>';
  },
  done: function () {
    var got = score(), all = QUIZ.length, pct = Math.round(got / all * 100);
    var mine = S.guess.filter(function (g) { return String(g).trim(); });
    return '<div class="card"><div class="mins">Lesson ' + LESSON + ' complete</div><h2>' + (pct >= 80 ? 'Sharp reading.' : 'Go back and read the explanations for the ones you missed.') + '</h2>' +
      '<div class="score"><div><b>' + got + ' / ' + all + '</b><span>questions right</span></div><div><b>' + pct + '%</b><span>' + (pct >= 80 ? 'passed' : '80% to pass') + '</span></div><div><b>' + words(S.essay) + '</b><span>words written</span></div></div>' +
      (PREVIEW ? '<p class="note">Preview: nothing was recorded or handed in.</p>'
        : '<p class="note ok">' + (navigator.onLine === false ? 'You are offline, so it is saved on this device and will be sent when the internet is back. ' : '') +
          '📬 Your paragraph and your prediction are handed in. Dad will read and mark the paragraph, and it will show up on <b>My Homework</b>.</p>') +
      '<p><b>Remember your three guesses?</b></p>' +
      '<div class="vs"><div><h4>What you guessed</h4><ul>' + (mine.length ? mine.map(function (g) { return '<li>' + esc(g) + '</li>'; }).join('') : '<li>(nothing typed)</li>') + '</ul></div>' +
      '<div><h4>' + esc(C.realityHead) + '</h4><ul>' + REALITY.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul></div></div>' +
      '<p style="margin-top:14px">' + C.finishNoteHtml + '</p>' +
      '<div class="book"><h4>My notebook so far</h4><ul>' + nbHtml() + '</ul></div>' +
      '<div class="next">' + C.nextHtml + '</div></div>';
  }
};

/* ---------- drawing ---------- */
function draw() {
  var id = STEPS[S.step].id, last = S.step === STEPS.length - 1, ready = stepReady(S.step);
  $('steps').innerHTML = STEPS.map(function (s, i) {
    var reach = S.done || i < STEPS.length - 1;
    var cls = i === S.step ? 'on' : (i < STEPS.length - 1 && stepReady(i) && (S.done || i < S.step) ? 'done' : '');
    return '<button class="' + cls + '" data-step="' + i + '"' + (reach ? '' : ' disabled') + '><b>' + s.n + '</b>' + s.label + '</button>';
  }).join('');
  $('bar').style.width = Math.round(S.step / (STEPS.length - 1) * 100) + '%';
  var right;
  if (last) right = '<a class="go" href="../homework.html">Back to My Homework</a>';
  else if (handStep(S.step) && !S.done) right = '<button class="go" id="next"' + (ready && !blocked() ? '' : ' disabled') + '>' + (S.sent ? 'Finish →' : 'Hand in and finish →') + '</button>';
  else right = '<button class="go" id="next"' + (ready ? '' : ' disabled') + '>Next →</button>';
  $('main').innerHTML = VIEW[id]() +
    '<div class="nav"><button class="go back" id="back"' + (S.step === 0 ? ' disabled' : '') + '>← Back</button>' + right + '</div>' +
    (last ? '<p class="hint"><button class="link" id="again">Try the questions again</button></p>'
          : '<p class="hint" id="hint"' + (ready ? ' style="display:none"' : '') + '>Finish this step to go on.</p>');
  if (id === 'write') startWrite(); else tickWrite();
}
function refreshNext() {
  var b = $('next'); if (!b) return;
  var ready = stepReady(S.step); b.disabled = !ready || (STEPS[S.step].id === 'write' && !S.done && blocked());
  var h = $('hint'); if (h) h.style.display = ready ? 'none' : '';
}
function go(i) {
  i = Math.max(0, Math.min(STEPS.length - 1, i));
  if (i === STEPS.length - 1 && !S.done) return;            // the finish page only after handing in
  S.step = i; save(); draw(); window.scrollTo(0, 0);
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('button'); if (!t || t.disabled) return;
  if (t.dataset.step != null) return go(+t.dataset.step);
  if (t.id === 'back') return go(S.step - 1);
  if (t.id === 'again') return resetQuiz();
  if (t.id === 'next') {
    if (!stepReady(S.step)) return;
    if (handStep(S.step) && !S.done) return handIn();
    return go(S.step + 1);
  }
  if (S.sent) return;                                       // handed in: the notebook and the paragraph are fixed
  if (t.dataset.prompt) { S.prompt = t.dataset.prompt; save(); draw(); return; }
  if (t.dataset.clue) {
    var c = t.dataset.clue, at = S.clues.indexOf(c);
    if (at >= 0) S.clues.splice(at, 1); else S.clues.push(c);
    save(); t.classList.toggle('on'); $('nb').innerHTML = nbHtml(); refreshNext();
  }
});
document.addEventListener('input', function (e) {
  var t = e.target, n, c;
  if (t.dataset.guess != null) S.guess[+t.dataset.guess] = t.value;
  else if (t.id === 'read') S.read = t.checked;
  else if (t.id === 'clueWhy') { S.clueWhy = t.value; $('nb').innerHTML = nbHtml(); n = words(t.value); c = $('pcount');
    c.textContent = n + ' words · at least ' + MIN_PREDICT; c.className = 'count' + (n >= MIN_PREDICT ? ' ok' : ''); }
  else if (t.id === 'essay') { S.essay = t.value; n = words(t.value); c = $('count');
    c.textContent = n + ' words · aim for 80 to 120'; c.className = 'count' + (n >= MIN_WORDS ? ' ok' : ''); }
  else return;
  save(); refreshNext();
});
document.addEventListener('paste', function (e) {
  if (e.target && e.target.id === 'essay') { try { S.pasted += ((e.clipboardData || window.clipboardData).getData('text') || '').length; save(); } catch (err) {} }
});
window.addEventListener('pagehide', function () { tickWrite(); save(); });
if (typeof VIEW_EXTRA === 'object') Object.keys(VIEW_EXTRA).forEach(function (k) { VIEW[k] = VIEW_EXTRA[k]; });
draw();
</script>
<script src="../JS/quiz-report.js"></script>
<script>watchSignIn();</script>
</body>
</html>
