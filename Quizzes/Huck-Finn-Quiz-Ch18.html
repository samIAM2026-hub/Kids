<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adventures of Huckleberry Finn — Chapter 18 Quiz</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', 'Times New Roman', serif; background: linear-gradient(160deg, #cfe8f0 0%, #a9d3c2 45%, #8bb98f 100%); min-height: 100vh; color: #2c2418; padding: 20px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { background: #5b4636; border-radius: 18px; padding: 26px 24px; text-align: center; color: #f5ecd9; box-shadow: 0 8px 0 #3a2c20; margin-bottom: 18px; }
  header .raft { font-size: 48px; line-height: 1; }
  header h1 { font-size: 25px; margin: 8px 0 4px; font-style: italic; }
  header p { font-size: 16px; opacity: 0.92; }
  .bar { background: #f5ecd9; border-radius: 14px; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; margin-bottom: 16px; box-shadow: 0 4px 0 #c9b890; }
  .progress-track { flex: 1; height: 14px; background: #d9c9a3; border-radius: 10px; margin: 0 14px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: #3a7d44; border-radius: 10px; transition: width .3s; }
  .card { background: #fffdf7; border-radius: 16px; padding: 22px; box-shadow: 0 6px 0 #c9b890; margin-bottom: 16px; }
  .qmeta { font-size: 13px; color: #8a6d3b; font-weight: bold; text-transform: uppercase; letter-spacing: .5px; }
  .qtext { font-size: 20px; margin: 8px 0 16px; line-height: 1.45; }
  .opt { display: block; width: 100%; text-align: left; background: #f7f1e3; border: 3px solid #ddcaa3; border-radius: 12px; padding: 13px 16px; font-size: 17px; font-family: inherit; color: #2c2418; margin-bottom: 10px; cursor: pointer; transition: transform .1s, background .15s, border-color .15s; }
  .opt:hover:not(:disabled) { transform: translateX(4px); border-color: #b89968; }
  .opt:disabled { cursor: default; }
  .opt.correct { background: #d7f0d3; border-color: #3a7d44; }
  .opt.wrong { background: #f6d6d6; border-color: #c0392b; }
  .feedback { margin-top: 6px; padding: 12px 14px; border-radius: 10px; font-size: 15px; line-height: 1.5; display: none; }
  .feedback.show { display: block; }
  .feedback.good { background: #e8f5e6; color: #2e6b34; }
  .feedback.bad { background: #fbeaea; color: #a5352a; }
  .btn { background: #3a7d44; color: #fff; border: none; border-radius: 12px; padding: 14px 28px; font-size: 18px; font-family: inherit; font-weight: bold; cursor: pointer; box-shadow: 0 5px 0 #285a30; transition: transform .1s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #285a30; }
  .btn.next { background: #8a6d3b; box-shadow: 0 5px 0 #5b4636; display: none; margin-top: 6px; }
  .center { text-align: center; }
  .result { background: #fffdf7; border-radius: 18px; padding: 34px 24px; text-align: center; box-shadow: 0 6px 0 #c9b890; }
  .result .big { font-size: 60px; }
  .result h2 { font-size: 27px; margin: 10px 0; color: #5b4636; }
  .scoreline { font-size: 22px; margin: 14px 0; }
  .stars { font-size: 32px; letter-spacing: 4px; margin: 10px 0; }
  .hidden { display: none; }
  footer { text-align: center; font-size: 13px; color: #4c4030; margin-top: 10px; opacity: .85; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="raft">⚔️🛶</div>
    <h1>The Adventures of Huckleberry Finn</h1>
    <p>Chapter 18 · The Feud · 20 Questions · by Mark Twain</p>
  </header>
  <div class="bar">
    <span id="qcount">Question 1 of 20</span>
    <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
    <span id="scoreboard">✓ 0</span>
  </div>
  <div id="quizArea"></div>
  <div id="resultArea" class="result hidden"></div>
  <footer id="footer">Part 1: what happened · Part 2: think about WHY. Passing score: 80%</footer>
</div>
<script>
const questions = [
  // ---------- PART 1: WHAT HAPPENED ----------
  { ch:"Part 1 · What Happened",
    q:"Huck says Colonel Grangerford was \"a gentleman all over.\" On Sundays the Colonel wore a ______.",
    options:[
      "blue swallow-tail coat with brass buttons",
      "grey riding jacket with silver buckles",
      "long black cloak with a velvet collar",
      "brown hunting coat with leather elbow patches"],
    answer:0,
    why:"Twain dresses the Colonel in a fine blue swallow-tail coat with brass buttons — the picture of an old-fashioned Southern gentleman." },

  { ch:"Part 1 · What Happened",
    q:"The Grangerfords ran a large plantation, and more than a hundred ______ worked on it.",
    options:[
      "enslaved people",
      "hired farm hands",
      "head of cattle",
      "fruit trees"],
    answer:0,
    why:"The family's grand, gentlemanly life rested on the labour of over a hundred enslaved people — a fact Huck states plainly and Twain wants us to notice." },

  { ch:"Part 1 · What Happened",
    q:"When Huck asks Buck how the feud began, Buck answers that ______.",
    options:[
      "it started with a lawsuit whose cause is now lost",
      "it started when a fence was moved onto their land",
      "it started with a card game that ended in a fight",
      "it started when a horse was taken from the stable"],
    answer:0,
    why:"Buck says it began about thirty years back over a lawsuit — and that nobody in either family can now recall what the lawsuit was even about." },

  { ch:"Part 1 · What Happened",
    q:"Buck fires at Harney Shepherdson from behind a bush and ______.",
    options:[
      "knocks Harney's hat off his head",
      "wounds Harney in the shoulder",
      "hits the tree above Harney's head",
      "startles Harney's horse into bolting"],
    answer:0,
    why:"The shot knocks Harney's hat off. Harney rides Buck down but does not shoot him — one of several hints that the feud has rules of its own." },

  { ch:"Part 1 · What Happened",
    q:"At church, during a sermon about brotherly love, the men kept their guns ______.",
    options:[
      "between their knees or against the wall",
      "in a locked box beside the front door",
      "under the wooden benches in the back row",
      "on their saddles out in the churchyard"],
    answer:0,
    why:"The men bring guns right into the pews — propped between their knees or leaned on the wall — while listening to a sermon on brotherly love." },

  { ch:"Part 1 · What Happened",
    q:"After church, Sophia Grangerford quietly asks Huck to go back and fetch her ______.",
    options:[
      "Testament, left behind in her seat",
      "bonnet, left hanging by the door",
      "hymn book, left on the front bench",
      "shawl, left folded under the pew"],
    answer:0,
    why:"Sophia sends Huck back for the Testament she 'forgot' — the excuse that lets a message reach her without anyone suspecting." },

  { ch:"Part 1 · What Happened",
    q:"Tucked inside that book, Huck finds a slip of paper with the words ______.",
    options:[
      "\"Half-past two\"",
      "\"After sundown\"",
      "\"By the old gate\"",
      "\"Tuesday night\""],
    answer:0,
    why:"The paper says only 'Half-past two' — a meeting time. Huck cannot read what it means yet, but it is the spark for everything that follows." },

  { ch:"Part 1 · What Happened",
    q:"Jack, the servant sent to wait on Huck, leads him into the swamp claiming he wants to show him ______.",
    options:[
      "some water-moccasins",
      "some wild blackberries",
      "a nest of bullfrogs",
      "a hollow cypress stump"],
    answer:0,
    why:"Jack's talk of water-moccasins is a cover story. He is really leading Huck to Jim, who has been hiding there and has mended the raft." },

  { ch:"Part 1 · What Happened",
    q:"The event that finally sets off the shooting is that Sophia has ______.",
    options:[
      "run off across the river to marry Harney",
      "told her father about the note in the book",
      "warned the Shepherdsons of an attack",
      "refused the husband her father chose"],
    answer:0,
    why:"Sophia elopes with Harney Shepherdson. Love crossing the feud line is the one thing neither family can bear." },

  { ch:"Part 1 · What Happened",
    q:"In the fight at the woodpile by the steamboat landing, Buck and his cousin Joe are ______.",
    options:[
      "shot and killed out in the river",
      "taken away by the Shepherdsons",
      "rescued by Buck's older brothers",
      "hidden by Huck in the woodpile"],
    answer:0,
    why:"The two boys are driven into the water and shot. Huck watches from a tree, and the memory haunts his dreams afterwards." },

  // ---------- PART 2: THINK ABOUT WHY ----------
  { ch:"Part 2 · Think About Why",
    q:"Huck admires the Colonel's fine manners, yet the Colonel keeps the feud going. What is Twain showing?",
    options:[
      "Beautiful manners can sit right beside terrible cruelty",
      "Wealthy families usually settle their quarrels more calmly",
      "Good manners are something learned mainly from books",
      "A polite man tends to make a peaceful neighbour"],
    answer:0,
    why:"Twain builds the Colonel up as a perfect gentleman so the killing lands harder. Polish on the outside is no proof of goodness inside." },

  { ch:"Part 2 · Think About Why",
    q:"Buck cannot say what the feud was ever about, but he still wants to fight. What is Twain's point?",
    options:[
      "The hatred has outlived any reason for it",
      "Buck has a poor memory for family stories",
      "The families are quarrelling over money again",
      "Boys invent quarrels to seem more grown up"],
    answer:0,
    why:"A hatred nobody can explain is a hatred that has become a habit. That is exactly what makes the feud so senseless — and so deadly." },

  { ch:"Part 2 · Think About Why",
    q:"The men carry guns into a sermon on brotherly love, then call the preaching very fine. What is Twain doing here?",
    options:[
      "Showing the gap between what they preach and how they live",
      "Showing that the preacher had chosen a poor subject",
      "Showing that the church was the safest spot in the county",
      "Showing that the families were ready to make peace"],
    answer:0,
    why:"This is Twain's sharpest joke in the chapter: people praising a sermon on love while holding the weapons they will use on their neighbours." },

  { ch:"Part 2 · Think About Why",
    q:"Huck feels uneasy after handing Sophia the Testament with the note inside. Why?",
    options:[
      "He senses he has set something dangerous moving",
      "He is afraid of walking past the church alone",
      "He worries the family will punish him for reading",
      "He thinks Sophia is playing a trick on Buck"],
    answer:0,
    why:"Huck does not know the plan, but he can feel he has been used as a messenger — and that whatever follows is partly his doing." },

  { ch:"Part 2 · Think About Why",
    q:"Why does Twain make the spark of the killing a runaway marriage rather than an insult or a theft?",
    options:[
      "Love crossing the feud line is what the families cannot bear",
      "A wedding gives the story a cheerful moment before the killing",
      "Marriages were the usual cause of quarrels along the river",
      "It shows Sophia caring little for her own relatives"],
    answer:0,
    why:"The one hopeful thing in the chapter — two young people in love — is the very thing that triggers the slaughter. That irony is the point." },

  { ch:"Part 2 · Think About Why",
    q:"During the shooting Huck climbs a tree and stays there. What does this tell us about his position?",
    options:[
      "He is a boy alone with no power to stop grown men",
      "He wants a clear view so he can describe it later",
      "He is hoping the Shepherdsons will notice him there",
      "He had promised Buck he would keep watch from above"],
    answer:0,
    why:"Huck is a witness, not a rescuer. Twain puts him up a tree so we see the horror through the eyes of someone who can do nothing about it." },

  { ch:"Part 2 · Think About Why",
    q:"Afterward Huck says he wished he had never come ashore. What does that wish reveal?",
    options:[
      "He feels a share of the blame for carrying the note",
      "He is tired of sleeping in an unfamiliar bed",
      "He believes town life is duller than river life",
      "He regrets losing the fine clothes the family lent him"],
    answer:0,
    why:"Huck's guilt is real even though he did not know what he was carrying. He measures himself by what happened, not by what he intended." },

  { ch:"Part 2 · Think About Why",
    q:"Huck pulls the bodies from the water, covers Buck's face, and cries. What does this show about him?",
    options:[
      "His tenderness toward people the feud treated as targets",
      "His wish to be remembered as a brave young man",
      "His belief that the Grangerfords brought this on themselves",
      "His hope that the Shepherdsons will be punished for it"],
    answer:0,
    why:"Nobody sees Huck do this, so it is not for show. His plain kindness stands against the whole grand, murderous code of the two families." },

  { ch:"Part 2 · Think About Why",
    q:"Twain describes the killing in plain, quiet language instead of grand heroic words. Why?",
    options:[
      "Plain words make the waste of the feud feel real",
      "Plain words keep the chapter shorter for readers",
      "Huck is too young to know any grander words",
      "The fight happened too fast to describe carefully"],
    answer:0,
    why:"Grand language would make the feud sound noble. Twain's flat, plain sentences let us see it for what it is — boys dying for nothing." },

  { ch:"Part 2 · Think About Why",
    q:"Back on the water Huck says there is no home like a raft. Why does the raft feel that way to him now?",
    options:[
      "It is free of the cruelty he has just watched on land",
      "It has far more room than the Grangerford house",
      "Jim has promised to do the cooking from now on",
      "It carries them downriver faster than a steamboat could"],
    answer:0,
    why:"After the woodpile, the raft with Jim is the only place Huck feels safe and easy. Twain sets the free river against the deadly shore again and again." }
];

// Shuffle the answer choices for every question so the correct one is never in the same spot.
questions.forEach(item => {
  const correctText = item.options[item.answer];
  for (let i = item.options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [item.options[i], item.options[j]] = [item.options[j], item.options[i]];
  }
  item.answer = item.options.indexOf(correctText);
});

let current = 0;
let score = 0;
let answered = false;
const passNeeded = Math.ceil(questions.length * 0.8);
const quizArea = document.getElementById('quizArea');
const resultArea = document.getElementById('resultArea');
const qcount = document.getElementById('qcount');
const scoreboard = document.getElementById('scoreboard');
const progress = document.getElementById('progress');
document.getElementById('footer').textContent =
  `Part 1: what happened · Part 2: think about WHY. Passing score: 80% (${passNeeded} of ${questions.length})`;

function render() {
  answered = false;
  const item = questions[current];
  qcount.textContent = `Question ${current + 1} of ${questions.length}`;
  scoreboard.textContent = `✓ ${score}`;
  progress.style.width = `${(current / questions.length) * 100}%`;
  let opts = item.options.map((o, i) => `<button class="opt" data-i="${i}" onclick="choose(${i})">${o}</button>`).join('');
  quizArea.innerHTML = `
    <div class="card">
      <div class="qmeta">${item.ch}</div>
      <div class="qtext">${item.q}</div>
      ${opts}
      <div class="feedback" id="fb"></div>
      <div class="center"><button class="btn next" id="nextBtn" onclick="next()">Next →</button></div>
    </div>`;
}

function choose(i) {
  if (answered) return;
  answered = true;
  const item = questions[current];
  const buttons = document.querySelectorAll('.opt');
  buttons.forEach(b => b.disabled = true);
  const fb = document.getElementById('fb');
  if (i === item.answer) {
    score++;
    buttons[i].classList.add('correct');
    fb.className = 'feedback good show';
    fb.innerHTML = `✅ <strong>Correct!</strong> ${item.why}`;
  } else {
    buttons[i].classList.add('wrong');
    buttons[item.answer].classList.add('correct');
    fb.className = 'feedback bad show';
    fb.innerHTML = `❌ <strong>Not quite.</strong> ${item.why}`;
  }
  scoreboard.textContent = `✓ ${score}`;
  document.getElementById('nextBtn').style.display = 'inline-block';
}

function next() { current++; if (current < questions.length) render(); else showResult(); }

function showResult() {
  quizArea.classList.add('hidden');
  document.querySelector('.bar').classList.add('hidden');
  resultArea.classList.remove('hidden');
  progress.style.width = '100%';
  const pct = Math.round((score / questions.length) * 100);
  const passed = score >= passNeeded;
  let stars, msg, emoji;
  if (pct === 100) { stars = '⭐⭐⭐⭐⭐'; msg = "Perfect score! You read this hard chapter with real care."; emoji = '🏆'; }
  else if (passed) { stars = '⭐⭐⭐⭐'; msg = "Excellent thinking! You passed with room to spare."; emoji = '🎖️'; }
  else if (pct >= 60) { stars = '⭐⭐⭐'; msg = "So close! You need 80% to pass — reread and think about the WHY behind each event."; emoji = '📖'; }
  else if (pct >= 40) { stars = '⭐⭐'; msg = "Good effort! You need 80% to pass. Re-read Chapter 18 and try again."; emoji = '📚'; }
  else { stars = '⭐'; msg = "Let's read Chapter 18 again carefully and try once more."; emoji = '🪵'; }
  const banner = passed
    ? `<div style="background:#d7f0d3;color:#2e6b34;border-radius:12px;padding:14px;font-size:24px;font-weight:bold;margin:14px 0;">🎉 PASSED! 🎉</div>`
    : `<div style="background:#fbeaea;color:#a5352a;border-radius:12px;padding:14px;font-size:24px;font-weight:bold;margin:14px 0;">Not passed yet — need 80%</div>`;
  resultArea.innerHTML = `
    <div class="big">${emoji}</div>
    <h2>Quiz Complete!</h2>
    ${banner}
    <div class="stars">${stars}</div>
    <div class="scoreline">You got <strong>${score}</strong> out of <strong>${questions.length}</strong> (${pct}%)</div>
    <div style="font-size:15px;color:#7a6a4a;margin:-4px 0 8px;">Passing score: 80% (${passNeeded} of ${questions.length})</div>
    <p style="margin:10px 0 20px;font-size:17px;">${msg}</p>
    <button class="btn" onclick="restart()">Try Again 🔄</button>`;
}

function restart() {
  current = 0; score = 0; answered = false;
  resultArea.classList.add('hidden');
  quizArea.classList.remove('hidden');
  document.querySelector('.bar').classList.remove('hidden');
  render();
}
render();
</script>
</body>
</html>
