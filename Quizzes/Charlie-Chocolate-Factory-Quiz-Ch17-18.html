<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charlie and the Chocolate Factory · Chapters 17–18</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --font:'Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
    --bg:linear-gradient(160deg,#ffe29a 0%,#ffb37b 50%,#ff8a5c 100%);
    --ink:#4a2c0f;
    --header-bg:#ff7043; --header-shadow:#d84315; --header-radius:24px;
    --bar-bg:#fff3e0; --bar-shadow:#ffccbc; --track:#ffccbc; --fill:#43a047;
    --card-bg:#fff; --card-shadow:#e0a96d; --card-radius:20px; --meta:#ef6c00;
    --opt-bg:#fff8f0; --opt-border:#ffd2a8; --opt-hover:#ff9d57; --opt-radius:14px;
    --correct-bg:#d7f5d3; --correct-border:#43a047; --wrong-bg:#ffd9d9; --wrong-border:#e53935;
    --good-bg:#e8f7e6; --good-fg:#2e7d32; --bad-bg:#fdeaea; --bad-fg:#c62828;
    --btn:#43a047; --btn-shadow:#2e7d32; --next:#ff7043; --next-shadow:#d84315;
    --result-title:#ef6c00; --footer:#7a4a1f;
  }
  body.theme-river{
    --font:'Georgia','Times New Roman',serif;
    --bg:linear-gradient(160deg,#cfe8f0 0%,#a9d3c2 45%,#8bb98f 100%);
    --ink:#2c2418;
    --header-bg:#5b4636; --header-shadow:#3a2c20; --header-radius:18px;
    --bar-bg:#f5ecd9; --bar-shadow:#c9b890; --track:#d9c9a3; --fill:#3a7d44;
    --card-bg:#fffdf7; --card-shadow:#c9b890; --card-radius:16px; --meta:#8a6d3b;
    --opt-bg:#f7f1e3; --opt-border:#ddcaa3; --opt-hover:#b89968; --opt-radius:12px;
    --correct-bg:#d7f0d3; --correct-border:#3a7d44; --wrong-bg:#f6d6d6; --wrong-border:#c0392b;
    --good-bg:#e8f5e6; --good-fg:#2e6b34; --bad-bg:#fbeaea; --bad-fg:#a5352a;
    --btn:#3a7d44; --btn-shadow:#285a30; --next:#8a6d3b; --next-shadow:#5b4636;
    --result-title:#5b4636; --footer:#4c4030;
  }
  body { font-family:var(--font); background:var(--bg); min-height:100vh; color:var(--ink); padding:20px; }
  .wrap { max-width:760px; margin:0 auto; }
  header { background:var(--header-bg); border-radius:var(--header-radius); padding:26px 24px; text-align:center; color:#fff; box-shadow:0 8px 0 var(--header-shadow); margin-bottom:18px; }
  header .ic { font-size:50px; line-height:1; }
  header h1 { font-size:25px; margin:8px 0 4px; }
  header p { font-size:16px; opacity:.95; }
  .bar { background:var(--bar-bg); border-radius:14px; padding:12px 18px; display:flex; justify-content:space-between; align-items:center; font-weight:bold; margin-bottom:16px; box-shadow:0 4px 0 var(--bar-shadow); }
  .progress-track { flex:1; height:14px; background:var(--track); border-radius:10px; margin:0 14px; overflow:hidden; }
  .progress-fill { height:100%; width:0; background:var(--fill); border-radius:10px; transition:width .3s; }
  .card { background:var(--card-bg); border-radius:var(--card-radius); padding:22px; box-shadow:0 6px 0 var(--card-shadow); margin-bottom:16px; }
  .qmeta { font-size:13px; color:var(--meta); font-weight:bold; text-transform:uppercase; letter-spacing:.5px; }
  .qtext { font-size:20px; margin:8px 0 16px; line-height:1.45; }
  .opt { display:block; width:100%; text-align:left; background:var(--opt-bg); border:3px solid var(--opt-border); border-radius:var(--opt-radius); padding:13px 16px; font-size:17px; font-family:inherit; color:var(--ink); margin-bottom:10px; cursor:pointer; transition:transform .1s, background .15s, border-color .15s; }
  .opt:hover:not(:disabled) { transform:translateX(4px); border-color:var(--opt-hover); }
  .opt:disabled { cursor:default; }
  .opt.correct { background:var(--correct-bg); border-color:var(--correct-border); }
  .opt.wrong { background:var(--wrong-bg); border-color:var(--wrong-border); }
  .feedback { margin-top:6px; padding:12px 14px; border-radius:12px; font-size:15px; line-height:1.45; display:none; }
  .feedback.show { display:block; }
  .feedback.good { background:var(--good-bg); color:var(--good-fg); }
  .feedback.bad { background:var(--bad-bg); color:var(--bad-fg); }
  .btn { background:var(--btn); color:#fff; border:none; border-radius:14px; padding:14px 28px; font-size:18px; font-family:inherit; font-weight:bold; cursor:pointer; box-shadow:0 5px 0 var(--btn-shadow); transition:transform .1s; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 var(--btn-shadow); }
  .btn.next { background:var(--next); box-shadow:0 5px 0 var(--next-shadow); display:none; margin-top:6px; }
  .center { text-align:center; }
  .result { background:var(--card-bg); border-radius:var(--card-radius); padding:34px 24px; text-align:center; box-shadow:0 6px 0 var(--card-shadow); }
  .result .big { font-size:62px; }
  .result h2 { font-size:27px; margin:10px 0; color:var(--result-title); }
  .scoreline { font-size:22px; margin:14px 0; }
  .stars { font-size:33px; letter-spacing:4px; margin:10px 0; }
  .hidden { display:none; }
  footer { text-align:center; font-size:13px; color:var(--footer); margin-top:10px; opacity:.85; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ic" id="icon">🚣</div>
    <h1 id="title">Book Title</h1>
    <p id="subtitle">Reading Quiz · Chapter N</p>
  </header>
  <div class="bar">
    <span id="qcount">Question 1</span>
    <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
    <span id="scoreboard">0</span>
  </div>
  <div id="quizArea"></div>
  <div id="resultArea" class="result hidden"></div>
  <footer id="footer"></footer>
</div>

<script>
/* ======================= EDIT THIS ======================= */
const CONFIG = {
  title:    "Charlie and the Chocolate Factory",
  subtitle: "Reading Quiz · Chapters 17–18",
  child:    "Grace",
  theme:    "peach",
  icon:     "🚣",
  passPct:  0.80
};

const questions = [
  // ---------- Chapter 17 · Augustus Gloop Goes Up the Pipe ----------
  { ch:"Chapter 17 · Augustus Gloop Goes Up the Pipe", q:"What was Augustus doing right before he tumbled into the chocolate river?",
    options:["Lying on the ground, lapping up chocolate with his mouth","Standing on a rock, scooping chocolate with a small cup","Kneeling by the bank, splashing chocolate on his face","Leaning on a tall rail, sipping chocolate through a straw"],
    answer:0,
    why:"Augustus lay flat with his head over the river, lapping up chocolate straight from the water like a dog." },

  { ch:"Chapter 17 · Augustus Gloop Goes Up the Pipe", q:"Who tried to warn Augustus to stop drinking from the river?",
    options:["Both his mother and Mr Wonka","The other three children in the group","A few nearby factory workers","His father, who called out from behind"],
    answer:0,
    why:"Mrs Gloop and Mr Wonka both called out for Augustus to stop, but he paid no attention." },

  { ch:"Chapter 17 · Augustus Gloop Goes Up the Pipe", q:"What pulled Augustus down into the chocolate river?",
    options:["The strong suction from a big glass pipe","A sudden gust of wind off the water","A slippery patch of chocolate-covered grass","A splash from a nearby Oompa-Loompa"],
    answer:0,
    why:"A large glass pipe hanging in the river sucked hard, and it pulled Augustus in when he leaned too close." },

  { ch:"Chapter 17 · Augustus Gloop Goes Up the Pipe", q:"What happened to Augustus after he was pulled into the pipe?",
    options:["He shot upward and got stuck partway through","He floated calmly until Wonka fished him out","He slid gently back down into the river","He was pushed sideways into a side channel"],
    answer:0,
    why:"The suction shot Augustus straight up the pipe, but he was too wide and became stuck partway along it." },

  { ch:"Chapter 17 · Augustus Gloop Goes Up the Pipe", q:"How did Mr Wonka react to Mrs Gloop's panic?",
    options:["He stayed calm and said Augustus would be fine","He panicked as well and ran for help","He scolded Mrs Gloop for not watching Augustus","He walked away without saying anything"],
    answer:0,
    why:"While Mrs Gloop panicked, Wonka stayed calm and reassured her that Augustus would come to no real harm." },

  { ch:"Chapter 17 · Augustus Gloop Goes Up the Pipe", q:"What dark joke did Mr Wonka make about Augustus's future?",
    options:["That he would end up tasting like fudge","That he would need a whole new wardrobe","That he would forget the whole adventure","That he would grow taller from the trip"],
    answer:0,
    why:"Wonka joked that Augustus might end up turned into chocolate or fudge, and that the taste would be terrible." },

  { ch:"Chapter 17 · Augustus Gloop Goes Up the Pipe", q:"Who did Mr Wonka send to help the Gloops find Augustus?",
    options:["An Oompa-Loompa, to guide them along","A security guard from the front gate","Charlie, since he knew the factory well","No one, since he said there was no rush"],
    answer:0,
    why:"Wonka called over an Oompa-Loompa to lead Mr and Mrs Gloop off to search for their son." },

  { ch:"Chapter 17 · Augustus Gloop Goes Up the Pipe", q:"What did the Oompa-Loompas do once Augustus got stuck in the pipe?",
    options:["They sang a song about his greedy habits","They rushed off to fetch a rescue net","They cried out loud in shock and worry","They quietly went back to their own work"],
    answer:0,
    why:"As soon as Augustus disappeared, the Oompa-Loompas broke into a song making fun of his greed." },

  { ch:"Chapter 17 · Augustus Gloop Goes Up the Pipe", q:"According to the Oompa-Loompa song, what would Augustus become?",
    options:["A lump of tasty fudge, made in the machine","A brand-new flavor of bubble gum for sale","A statue carved out of solid dark chocolate","A jar of chocolate spread for morning toast"],
    answer:0,
    why:"The song joked that Augustus would be boiled and turned into a tasty piece of fudge." },

  { ch:"Chapter 17 · Think About It", q:"What does Mr Wonka's calm, joking reaction to Augustus's accident suggest about him?",
    options:["He trusts his factory, so he isn't very worried","He is secretly terrified but hiding his feelings","He truly dislikes visiting children and wants them gone","He is confused about what just happened"],
    answer:0,
    why:"Wonka jokes and stays relaxed rather than panicking, showing he's confident nothing truly terrible will happen in his factory." },

  // ---------- Chapter 18 · Down the Chocolate River ----------
  { ch:"Chapter 18 · Down the Chocolate River", q:"What did Mr Wonka say would happen to Augustus after he vanished up the pipe?",
    options:["That everything would turn out fine in the end","That he would need to be rescued at once","That the factory would have to shut down","That his parents should go straight home without him"],
    answer:0,
    why:"Wonka brushed off the worry, saying Augustus would come out all right in the end." },

  { ch:"Chapter 18 · Down the Chocolate River", q:"What was the boat that carried the group down the river made from?",
    options:["A hollowed-out giant boiled sweet","Sheets of pressed chocolate bark","Carved and hand-painted pink wood","A large inflated sugar balloon"],
    answer:0,
    why:"The pink boat, shaped like an old Viking ship, was carved out of one enormous boiled sweet." },

  { ch:"Chapter 18 · Down the Chocolate River", q:"Roughly how many Oompa-Loompas rowed the boat?",
    options:["About a hundred of them","About a dozen of them","About twenty of them","About a thousand of them"],
    answer:0,
    why:"Around a hundred Oompa-Loompas manned the oars, with several rowing together on each one." },

  { ch:"Chapter 18 · Down the Chocolate River", q:"What did Veruca Salt demand after seeing the wonderful boat?",
    options:["A chocolate river and pink boat of her own","A turn steering the big boat down the river","A song written specially about her","A private tour of the Inventing Room"],
    answer:0,
    why:"Spoiled Veruca insisted that her father get her a chocolate river and a boat exactly like Wonka's." },

  { ch:"Chapter 18 · Down the Chocolate River", q:"Why did Mr Wonka offer Charlie and Grandpa Joe mugs of chocolate?",
    options:["He said they both looked far too thin and weak","He wanted to test a brand-new flavor on them","He was celebrating Augustus's safe rescue","He wanted them to stop asking questions"],
    answer:0,
    why:"Wonka said Charlie and Grandpa Joe looked half-starved and handed them mugs of chocolate from the river." },

  { ch:"Chapter 18 · Down the Chocolate River", q:"What happened as the chocolate river grew narrower?",
    options:["The boat sped into a pitch-black tunnel","The boat slowed down to a gentle stop","The river split into three smaller streams","The boat rose up out of the water"],
    answer:0,
    why:"As the river narrowed, the boat rushed the group into a completely dark tunnel." },

  { ch:"Chapter 18 · Down the Chocolate River", q:"What worried the parents while the boat raced through the dark tunnel?",
    options:["Mr Wonka singing strange songs and not steering","The boat leaking chocolate into the water","The Oompa-Loompas suddenly stopping their rowing","The tunnel walls beginning to crumble apart"],
    answer:0,
    why:"While Wonka sang strangely in the dark, the worried parents feared he had completely lost control of the boat." },

  { ch:"Chapter 18 · Down the Chocolate River", q:"What appeared printed on doors the boat sped past in the tunnel?",
    options:["Labels for storerooms, like creams and beans","Warning signs about slippery chocolate floors ahead","Portraits of Mr Wonka's past visitors","Maps showing the layout of the factory"],
    answer:0,
    why:"The boat rushed past storeroom doors labelled with things like all the creams and all the beans." },

  { ch:"Chapter 18 · Down the Chocolate River", q:"What made Mr Wonka suddenly call for the boat to stop?",
    options:["A bright red door coming into view","A strange noise coming from below deck","One of the Oompa-Loompas losing an oar","Charlie asking to stop and rest"],
    answer:0,
    why:"As a bright red door came into sight, Wonka waved his cane and ordered everyone to stop the boat." },

  { ch:"Chapter 18 · Think About It", q:"What does Charlie's wonder at the chocolate river show, compared with Veruca's reaction?",
    options:["He enjoys it, while Veruca wants to own it","He is bored by it, while Veruca loves it","He wants his own river too, exactly like Veruca","He is frightened by it, while Veruca stays calm"],
    answer:0,
    why:"Charlie simply enjoys the wonder of the chocolate river, while Veruca immediately demands one for herself." }
];
/* ===================== END EDIT AREA ===================== */

document.body.className = 'theme-' + CONFIG.theme;
const MARK = CONFIG.theme === 'river' ? '✓' : '⭐';
document.getElementById('icon').textContent = CONFIG.icon;
document.getElementById('title').textContent = CONFIG.title;
document.getElementById('subtitle').textContent = CONFIG.subtitle;

questions.forEach(item => {
  const correct = item.options[item.answer];
  for (let i = item.options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [item.options[i], item.options[j]] = [item.options[j], item.options[i]];
  }
  item.answer = item.options.indexOf(correct);
});

let current = 0, score = 0, answered = false;
const passNeeded = Math.ceil(questions.length * CONFIG.passPct);
const pctLabel = Math.round(CONFIG.passPct * 100);
const quizArea = document.getElementById('quizArea');
const resultArea = document.getElementById('resultArea');
const qcount = document.getElementById('qcount');
const scoreboard = document.getElementById('scoreboard');
const progress = document.getElementById('progress');
document.getElementById('footer').textContent =
  `For ${CONFIG.child} · Passing score: ${pctLabel}% (${passNeeded} of ${questions.length})`;

function render() {
  answered = false;
  const item = questions[current];
  qcount.textContent = `Question ${current + 1} of ${questions.length}`;
  scoreboard.textContent = `${MARK} ${score}`;
  progress.style.width = `${(current / questions.length) * 100}%`;
  const opts = item.options.map((o, i) => `<button class="opt" data-i="${i}" onclick="choose(${i})">${o}</button>`).join('');
  quizArea.innerHTML = `
    <div class="card">
      <div class="qmeta">${item.ch}</div>
      <div class="qtext">${item.q}</div>
      ${opts}
      <div class="feedback" id="fb"></div>
      <div class="center"><button class="btn next" id="nextBtn" onclick="next()">Next →</button></div>
    </div>`;
}

function choose(i) {
  if (answered) return;
  answered = true;
  const item = questions[current];
  const buttons = document.querySelectorAll('.opt');
  buttons.forEach(b => b.disabled = true);
  const fb = document.getElementById('fb');
  if (i === item.answer) {
    score++;
    buttons[i].classList.add('correct');
    fb.className = 'feedback good show';
    fb.innerHTML = `✅ <strong>Correct!</strong> ${item.why}`;
  } else {
    buttons[i].classList.add('wrong');
    buttons[item.answer].classList.add('correct');
    fb.className = 'feedback bad show';
    fb.innerHTML = `❌ <strong>Not quite.</strong> ${item.why}`;
  }
  scoreboard.textContent = `${MARK} ${score}`;
  document.getElementById('nextBtn').style.display = 'inline-block';
}

function next() { current++; if (current < questions.length) render(); else showResult(); }

function showResult() {
  quizArea.classList.add('hidden');
  document.querySelector('.bar').classList.add('hidden');
  resultArea.classList.remove('hidden');
  progress.style.width = '100%';
  const pct = Math.round((score / questions.length) * 100);
  const passed = score >= passNeeded;
  let stars, msg, emoji;
  if (pct === 100) { stars='⭐⭐⭐⭐⭐'; msg="Perfect score! You really know it."; emoji='🏆'; }
  else if (passed) { stars='⭐⭐⭐⭐'; msg="Excellent! You passed with room to spare."; emoji='🎖️'; }
  else if (pct >= 60) { stars='⭐⭐⭐'; msg=`So close! You need ${pctLabel}% to pass — review and try again.`; emoji='📖'; }
  else if (pct >= 40) { stars='⭐⭐'; msg=`Good effort! You need ${pctLabel}% to pass. Re-read and give it another go.`; emoji='📚'; }
  else { stars='⭐'; msg="Let's read it again carefully and try once more."; emoji='📗'; }
  const banner = passed
    ? `<div style="background:var(--correct-bg);color:var(--good-fg);border-radius:12px;padding:14px;font-size:24px;font-weight:bold;margin:14px 0;">🎉 PASSED! 🎉</div>`
    : `<div style="background:var(--bad-bg);color:var(--bad-fg);border-radius:12px;padding:14px;font-size:24px;font-weight:bold;margin:14px 0;">Not passed yet — need ${pctLabel}%</div>`;
  resultArea.innerHTML = `
    <div class="big">${emoji}</div>
    <h2>Quiz Complete!</h2>
    ${banner}
    <div class="stars">${stars}</div>
    <div class="scoreline">You got <strong>${score}</strong> out of <strong>${questions.length}</strong> (${pct}%)</div>
    <div style="font-size:15px;color:var(--footer);margin:-4px 0 8px;">Passing score: ${pctLabel}% (${passNeeded} of ${questions.length})</div>
    <p style="margin:10px 0 20px;font-size:17px;">${msg}</p>
    <button class="btn" onclick="restart()">Try Again 🔄</button>`;
}

function restart() {
  current = 0; score = 0; answered = false;
  resultArea.classList.add('hidden');
  quizArea.classList.remove('hidden');
  document.querySelector('.bar').classList.remove('hidden');
  render();
}
render();
</script>
</body>
</html>
