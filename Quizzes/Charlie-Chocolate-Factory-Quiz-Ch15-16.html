<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charlie and the Chocolate Factory · Chapters 15–16</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --font:'Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
    --bg:linear-gradient(160deg,#ffe29a 0%,#ffb37b 50%,#ff8a5c 100%);
    --ink:#4a2c0f;
    --header-bg:#ff7043; --header-shadow:#d84315; --header-radius:24px;
    --bar-bg:#fff3e0; --bar-shadow:#ffccbc; --track:#ffccbc; --fill:#43a047;
    --card-bg:#fff; --card-shadow:#e0a96d; --card-radius:20px; --meta:#ef6c00;
    --opt-bg:#fff8f0; --opt-border:#ffd2a8; --opt-hover:#ff9d57; --opt-radius:14px;
    --correct-bg:#d7f5d3; --correct-border:#43a047; --wrong-bg:#ffd9d9; --wrong-border:#e53935;
    --good-bg:#e8f7e6; --good-fg:#2e7d32; --bad-bg:#fdeaea; --bad-fg:#c62828;
    --btn:#43a047; --btn-shadow:#2e7d32; --next:#ff7043; --next-shadow:#d84315;
    --result-title:#ef6c00; --footer:#7a4a1f;
  }
  body.theme-river{
    --font:'Georgia','Times New Roman',serif;
    --bg:linear-gradient(160deg,#cfe8f0 0%,#a9d3c2 45%,#8bb98f 100%);
    --ink:#2c2418;
    --header-bg:#5b4636; --header-shadow:#3a2c20; --header-radius:18px;
    --bar-bg:#f5ecd9; --bar-shadow:#c9b890; --track:#d9c9a3; --fill:#3a7d44;
    --card-bg:#fffdf7; --card-shadow:#c9b890; --card-radius:16px; --meta:#8a6d3b;
    --opt-bg:#f7f1e3; --opt-border:#ddcaa3; --opt-hover:#b89968; --opt-radius:12px;
    --correct-bg:#d7f0d3; --correct-border:#3a7d44; --wrong-bg:#f6d6d6; --wrong-border:#c0392b;
    --good-bg:#e8f5e6; --good-fg:#2e6b34; --bad-bg:#fbeaea; --bad-fg:#a5352a;
    --btn:#3a7d44; --btn-shadow:#285a30; --next:#8a6d3b; --next-shadow:#5b4636;
    --result-title:#5b4636; --footer:#4c4030;
  }
  body { font-family:var(--font); background:var(--bg); min-height:100vh; color:var(--ink); padding:20px; }
  .wrap { max-width:760px; margin:0 auto; }
  header { background:var(--header-bg); border-radius:var(--header-radius); padding:26px 24px; text-align:center; color:#fff; box-shadow:0 8px 0 var(--header-shadow); margin-bottom:18px; }
  header .ic { font-size:50px; line-height:1; }
  header h1 { font-size:25px; margin:8px 0 4px; }
  header p { font-size:16px; opacity:.95; }
  .bar { background:var(--bar-bg); border-radius:14px; padding:12px 18px; display:flex; justify-content:space-between; align-items:center; font-weight:bold; margin-bottom:16px; box-shadow:0 4px 0 var(--bar-shadow); }
  .progress-track { flex:1; height:14px; background:var(--track); border-radius:10px; margin:0 14px; overflow:hidden; }
  .progress-fill { height:100%; width:0; background:var(--fill); border-radius:10px; transition:width .3s; }
  .card { background:var(--card-bg); border-radius:var(--card-radius); padding:22px; box-shadow:0 6px 0 var(--card-shadow); margin-bottom:16px; }
  .qmeta { font-size:13px; color:var(--meta); font-weight:bold; text-transform:uppercase; letter-spacing:.5px; }
  .qtext { font-size:20px; margin:8px 0 16px; line-height:1.45; }
  .opt { display:block; width:100%; text-align:left; background:var(--opt-bg); border:3px solid var(--opt-border); border-radius:var(--opt-radius); padding:13px 16px; font-size:17px; font-family:inherit; color:var(--ink); margin-bottom:10px; cursor:pointer; transition:transform .1s, background .15s, border-color .15s; }
  .opt:hover:not(:disabled) { transform:translateX(4px); border-color:var(--opt-hover); }
  .opt:disabled { cursor:default; }
  .opt.correct { background:var(--correct-bg); border-color:var(--correct-border); }
  .opt.wrong { background:var(--wrong-bg); border-color:var(--wrong-border); }
  .feedback { margin-top:6px; padding:12px 14px; border-radius:12px; font-size:15px; line-height:1.45; display:none; }
  .feedback.show { display:block; }
  .feedback.good { background:var(--good-bg); color:var(--good-fg); }
  .feedback.bad { background:var(--bad-bg); color:var(--bad-fg); }
  .btn { background:var(--btn); color:#fff; border:none; border-radius:14px; padding:14px 28px; font-size:18px; font-family:inherit; font-weight:bold; cursor:pointer; box-shadow:0 5px 0 var(--btn-shadow); transition:transform .1s; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 var(--btn-shadow); }
  .btn.next { background:var(--next); box-shadow:0 5px 0 var(--next-shadow); display:none; margin-top:6px; }
  .center { text-align:center; }
  .result { background:var(--card-bg); border-radius:var(--card-radius); padding:34px 24px; text-align:center; box-shadow:0 6px 0 var(--card-shadow); }
  .result .big { font-size:62px; }
  .result h2 { font-size:27px; margin:10px 0; color:var(--result-title); }
  .scoreline { font-size:22px; margin:14px 0; }
  .stars { font-size:33px; letter-spacing:4px; margin:10px 0; }
  .hidden { display:none; }
  footer { text-align:center; font-size:13px; color:var(--footer); margin-top:10px; opacity:.85; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ic" id="icon">🌊</div>
    <h1 id="title">Book Title</h1>
    <p id="subtitle">Reading Quiz · Chapter N</p>
  </header>
  <div class="bar">
    <span id="qcount">Question 1</span>
    <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
    <span id="scoreboard">0</span>
  </div>
  <div id="quizArea"></div>
  <div id="resultArea" class="result hidden"></div>
  <footer id="footer"></footer>
</div>

<script>
/* ======================= EDIT THIS ======================= */
const CONFIG = {
  title:    "Charlie and the Chocolate Factory",
  subtitle: "Reading Quiz · Chapters 15–16",
  child:    "Grace",
  theme:    "peach",
  icon:     "🌊",
  passPct:  0.80
};

const questions = [
  // ---------- Chapter 15 · The Chocolate Room ----------
  { ch:"Chapter 15 · The Chocolate Room", q:"What did the children see when Mr Wonka led them into the Chocolate Room?",
    options:["A green valley with a river made of melted chocolate","A tall glass tower stacked with wrapped chocolate bars","A dim underground cave lined with sugary candy canes","A busy kitchen crowded with rows of bubbling copper pots"],
    answer:0,
    why:"The Chocolate Room was a beautiful valley with a great brown river of melted chocolate flowing through it." },

  { ch:"Chapter 15 · The Chocolate Room", q:"Why did Mr Wonka insist that his chocolate must flow over a waterfall?",
    options:["Because the waterfall mixes and beats it into something light and frothy","Because the waterfall cools the chocolate fast enough to cut into bars","Because the waterfall keeps stray insects out of the flowing river","Because the waterfall lets the chocolate reach the delivery vans quickly"],
    answer:0,
    why:"Wonka said no other method mixes chocolate properly — the waterfall churns and pounds it until it's light and frothy." },

  { ch:"Chapter 15 · The Chocolate Room", q:"What did Mr Wonka use to carry chocolate away from the river to the rest of the factory?",
    options:["Huge glass pipes hanging down from the ceiling","A fleet of small chocolate-powered delivery trucks","Long wooden channels dug into the factory floor","Rows of buckets carried by hand along the path"],
    answer:0,
    why:"Enormous glass pipes hung over the river, sucking up chocolate and carrying it all over the factory." },

  { ch:"Chapter 15 · The Chocolate Room", q:"Which trees and bushes grew along the banks of the chocolate river?",
    options:["Tall weeping willows, alders, and blooming rhododendrons","Tall oak trees strung with long ropes of licorice","Rows of apple trees growing striped peppermint sticks","Thick pine trees dripping with warm golden caramel sauce"],
    answer:0,
    why:"The banks were planted with weeping willows, alders, and rhododendrons in flower, and every bit of it was edible." },

  { ch:"Chapter 15 · The Chocolate Room", q:"What was the meadow grass in the Chocolate Room actually made of?",
    options:["A soft minty sugar that Mr Wonka named swudge","Thin strands of green-dyed spun sugar candy","Crushed mint leaves stirred into warm melted fudge","Tiny curls of pale green marzipan rolled by hand"],
    answer:0,
    why:"Wonka explained that the grass was a brand-new kind of soft, minty sugar he had named swudge." },

  { ch:"Chapter 15 · The Chocolate Room", q:"How did most of the grown-ups and children treat the edible grass at first?",
    options:["They tried just one blade of grass or a buttercup","They filled their pockets with grass to take home","They turned away and would not taste any of it","They picked flowers instead and left the grass alone"],
    answer:0,
    why:"Most people were fairly polite about it and only tasted a blade of grass or a buttercup." },

  { ch:"Chapter 15 · The Chocolate Room", q:"How did Augustus Gloop behave differently from the others with the grass?",
    options:["He grabbed a big handful and stuffed it in his mouth","He calmly announced that the grass wasn't for him","He kindly fed his handful of grass to his mother","He took a very small nibble from the tip of one blade"],
    answer:0,
    why:"Unlike the others, greedy Augustus grabbed a large handful of grass and crammed it into his mouth." },

  { ch:"Chapter 15 · The Chocolate Room", q:"What did Violet Beauregarde do with her famous chewing gum before tasting the grass?",
    options:["She popped it out and tucked it behind her ear","She swallowed it whole before eating anything else","She wrapped it in paper and pocketed it away","She tossed it into the chocolate river below"],
    answer:0,
    why:"Violet popped her record-breaking gum out of her mouth and parked it behind her ear so she could taste the grass." },

  { ch:"Chapter 15 · The Chocolate Room", q:"What did Mr Wonka call the tiny people that Veruca spotted across the river?",
    options:["Oompa-Loompas, tiny workers brought in from afar","Wonka's own grandchildren, visiting for the day","Curious tourists who had wandered off a nearby tour","Local children who had snuck in to see the factory"],
    answer:0,
    why:"Veruca screamed when she spotted tiny figures across the river, and Mr Wonka happily explained they were his Oompa-Loompas." },

  { ch:"Chapter 15 · Think About It", q:"What does Mr Wonka's pride in his one-of-a-kind waterfall show about him as an inventor?",
    options:["He loves finding his own unusual way of doing things","He worries constantly about what rival factories think","He prefers borrowing methods from other chocolate makers","He finds new inventions stressful and hard to manage"],
    answer:0,
    why:"Wonka's insistence that the waterfall is the only proper way to mix chocolate shows how much he enjoys inventing things nobody else has thought of." },

  // ---------- Chapter 16 · The Oompa-Loompas ----------
  { ch:"Chapter 16 · The Oompa-Loompas", q:"What kind of place did Mr Wonka say Loompaland was?",
    options:["A wild, dangerous jungle full of fierce creatures","A quiet island covered mostly in soft green grass","A frozen land buried in snow all year round","A busy town crowded with shops and markets"],
    answer:0,
    why:"Wonka described Loompaland as a terrible, dangerous jungle full of fierce beasts." },

  { ch:"Chapter 16 · The Oompa-Loompas", q:"Which three dangerous creatures did Mr Wonka say lived in Loompaland?",
    options:["Hornswogglers, snozzwangers, and whangdoodles","Griffins, fire-breathing dragons, and sea serpents","Wolves, tigers, and enormous grizzly bears","Sharks, hungry crocodiles, and giant jungle eels"],
    answer:0,
    why:"Wonka named hornswogglers, snozzwangers, and the terrible wicked whangdoodles as the dangers of Loompaland." },

  { ch:"Chapter 16 · The Oompa-Loompas", q:"Why did the Oompa-Loompas used to build their houses up in the trees?",
    options:["To stay safe from the terrible jungle whangdoodle","To pick ripe fruit that grew near the treetops","To keep cool during the hot jungle afternoons","To watch for ships passing along the distant coast"],
    answer:0,
    why:"The whangdoodles were so dangerous that the Oompa-Loompas built houses up in the trees to keep safe." },

  { ch:"Chapter 16 · The Oompa-Loompas", q:"What did the Oompa-Loompas mostly eat before they came to work for Mr Wonka?",
    options:["Green caterpillars, which tasted quite revolting","Wild berries that grew along the riverbanks","Roasted nuts they slowly gathered from the jungle floor","Fish they caught from a nearby jungle stream"],
    answer:0,
    why:"Wonka explained that green caterpillars were nearly all the Oompa-Loompas had to eat, and they tasted disgusting." },

  { ch:"Chapter 16 · The Oompa-Loompas", q:"What did the Oompa-Loompas mix into their caterpillars to try to improve the taste?",
    options:["Red beetles, eucalyptus leaves, and bong-bong tree bark","Crushed jungle flowers and a splash of sweet coconut milk","Wild honey and generous handfuls of dried jungle berries","Sea salt and juice squeezed from the local fruit trees"],
    answer:0,
    why:"They tried mixing in red beetles, eucalyptus leaves, and bong-bong tree bark, but nothing made the caterpillars taste good." },

  { ch:"Chapter 16 · The Oompa-Loompas", q:"What food did the Oompa-Loompas truly long for back in Loompaland?",
    options:["Cacao beans, which were very hard to find there","Ripe mangoes, which grew in one far valley","Sweet honeycomb, closely guarded by swarms of jungle bees","Fresh coconuts, which fell once each season"],
    answer:0,
    why:"The Oompa-Loompas loved cacao beans more than anything, but in Loompaland they were nearly impossible to find." },

  { ch:"Chapter 16 · The Oompa-Loompas", q:"What did Mr Wonka offer the Oompa-Loompas in exchange for coming to work at his factory?",
    options:["As many cacao beans and chocolate as they wanted","A large sum of money paid to them weekly","A brand-new village built especially for them","A ship of their very own to sail wherever they liked"],
    answer:0,
    why:"Wonka promised the Oompa-Loompas unlimited cacao beans and chocolate if they moved to his factory." },

  { ch:"Chapter 16 · The Oompa-Loompas", q:"How did the Oompa-Loompa leader respond to Mr Wonka's offer?",
    options:["He happily agreed at once and called it a deal","He asked for a few days to think it over first","He turned the offer down when he first heard it","He asked the whole tribe to vote on it first"],
    answer:0,
    why:"The chief was so excited about the cacao beans that he accepted Wonka's offer on the spot." },

  { ch:"Chapter 16 · The Oompa-Loompas", q:"How did Mr Wonka bring the Oompa-Loompas over to his factory?",
    options:["He smuggled them over in packing cases with air holes","He sailed them over openly on his own private ship","He flew them in one at a time by hot air balloon","He walked the whole tribe over on a long and hidden road"],
    answer:0,
    why:"Wonka hid the Oompa-Loompas in large packing cases with holes poked in for air and brought them to his factory." },

  { ch:"Chapter 16 · Think About It", q:"What does Veruca's reaction to hearing about the Oompa-Loompas reveal about her?",
    options:["She is used to getting whatever she wants right away","She is shy about asking her father for new things","She would rather share new discoveries with others","She likes to wait patiently before asking for anything"],
    answer:0,
    why:"As soon as Veruca heard about the Oompa-Loompas, she demanded her father get her one immediately, showing how used to getting her way she is." }
];
/* ===================== END EDIT AREA ===================== */

document.body.className = 'theme-' + CONFIG.theme;
const MARK = CONFIG.theme === 'river' ? '✓' : '⭐';
document.getElementById('icon').textContent = CONFIG.icon;
document.getElementById('title').textContent = CONFIG.title;
document.getElementById('subtitle').textContent = CONFIG.subtitle;

questions.forEach(item => {
  const correct = item.options[item.answer];
  for (let i = item.options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [item.options[i], item.options[j]] = [item.options[j], item.options[i]];
  }
  item.answer = item.options.indexOf(correct);
});

let current = 0, score = 0, answered = false;
const passNeeded = Math.ceil(questions.length * CONFIG.passPct);
const pctLabel = Math.round(CONFIG.passPct * 100);
const quizArea = document.getElementById('quizArea');
const resultArea = document.getElementById('resultArea');
const qcount = document.getElementById('qcount');
const scoreboard = document.getElementById('scoreboard');
const progress = document.getElementById('progress');
document.getElementById('footer').textContent =
  `For ${CONFIG.child} · Passing score: ${pctLabel}% (${passNeeded} of ${questions.length})`;

function render() {
  answered = false;
  const item = questions[current];
  qcount.textContent = `Question ${current + 1} of ${questions.length}`;
  scoreboard.textContent = `${MARK} ${score}`;
  progress.style.width = `${(current / questions.length) * 100}%`;
  const opts = item.options.map((o, i) => `<button class="opt" data-i="${i}" onclick="choose(${i})">${o}</button>`).join('');
  quizArea.innerHTML = `
    <div class="card">
      <div class="qmeta">${item.ch}</div>
      <div class="qtext">${item.q}</div>
      ${opts}
      <div class="feedback" id="fb"></div>
      <div class="center"><button class="btn next" id="nextBtn" onclick="next()">Next →</button></div>
    </div>`;
}

function choose(i) {
  if (answered) return;
  answered = true;
  const item = questions[current];
  const buttons = document.querySelectorAll('.opt');
  buttons.forEach(b => b.disabled = true);
  const fb = document.getElementById('fb');
  if (i === item.answer) {
    score++;
    buttons[i].classList.add('correct');
    fb.className = 'feedback good show';
    fb.innerHTML = `✅ <strong>Correct!</strong> ${item.why}`;
  } else {
    buttons[i].classList.add('wrong');
    buttons[item.answer].classList.add('correct');
    fb.className = 'feedback bad show';
    fb.innerHTML = `❌ <strong>Not quite.</strong> ${item.why}`;
  }
  scoreboard.textContent = `${MARK} ${score}`;
  document.getElementById('nextBtn').style.display = 'inline-block';
}

function next() { current++; if (current < questions.length) render(); else showResult(); }

function showResult() {
  quizArea.classList.add('hidden');
  document.querySelector('.bar').classList.add('hidden');
  resultArea.classList.remove('hidden');
  progress.style.width = '100%';
  const pct = Math.round((score / questions.length) * 100);
  const passed = score >= passNeeded;
  let stars, msg, emoji;
  if (pct === 100) { stars='⭐⭐⭐⭐⭐'; msg="Perfect score! You really know it."; emoji='🏆'; }
  else if (passed) { stars='⭐⭐⭐⭐'; msg="Excellent! You passed with room to spare."; emoji='🎖️'; }
  else if (pct >= 60) { stars='⭐⭐⭐'; msg=`So close! You need ${pctLabel}% to pass — review and try again.`; emoji='📖'; }
  else if (pct >= 40) { stars='⭐⭐'; msg=`Good effort! You need ${pctLabel}% to pass. Re-read and give it another go.`; emoji='📚'; }
  else { stars='⭐'; msg="Let's read it again carefully and try once more."; emoji='📗'; }
  const banner = passed
    ? `<div style="background:var(--correct-bg);color:var(--good-fg);border-radius:12px;padding:14px;font-size:24px;font-weight:bold;margin:14px 0;">🎉 PASSED! 🎉</div>`
    : `<div style="background:var(--bad-bg);color:var(--bad-fg);border-radius:12px;padding:14px;font-size:24px;font-weight:bold;margin:14px 0;">Not passed yet — need ${pctLabel}%</div>`;
  resultArea.innerHTML = `
    <div class="big">${emoji}</div>
    <h2>Quiz Complete!</h2>
    ${banner}
    <div class="stars">${stars}</div>
    <div class="scoreline">You got <strong>${score}</strong> out of <strong>${questions.length}</strong> (${pct}%)</div>
    <div style="font-size:15px;color:var(--footer);margin:-4px 0 8px;">Passing score: ${pctLabel}% (${passNeeded} of ${questions.length})</div>
    <p style="margin:10px 0 20px;font-size:17px;">${msg}</p>
    <button class="btn" onclick="restart()">Try Again 🔄</button>`;
}

function restart() {
  current = 0; score = 0; answered = false;
  resultArea.classList.add('hidden');
  quizArea.classList.remove('hidden');
  document.querySelector('.bar').classList.remove('hidden');
  render();
}
render();
</script>
</body>
</html>
